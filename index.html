function storageGet(key){try{return localStorage.getItem(key)}catch{return null}}
function storageSet(key,value){try{localStorage.setItem(key,value);return true}catch{alert('This browser cannot save data. Enable site storage to keep your changes.');return false}}

async function api(path,options={}){const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),45000);try{const r=await fetch(path,{...options,signal:controller.signal});const data=await r.json();if(!r.ok)throw Error(data.message||data.answer||data.error||'Request failed. Please try again.');return data}finally{clearTimeout(timer)}}

function safeLink(value){try{if(typeof value!=='string'||/[\u0000-\u0020\u007f\\]/.test(value))return '';const u=new URL(value);return ['http:','https:'].includes(u.protocol)&&!u.username&&!u.password?u.href:''}catch{return ''}}
function newsCards(rows){return rows.length?rows.map(x=>`<a class="row" href="${esc(safeLink(x.link))}" target="_blank" rel="noopener noreferrer"><span><b>${esc(x.title)}</b><br><span class="muted">${esc(x.source)} · ${esc(x.published||(x.seen_at?'Indexed '+x.seen_at+'; publication time unavailable':'Publication time unavailable'))} · ${esc(x.status||'UNKNOWN')}</span></span><span>↗</span></a>`).join(''):'<div class="empty">No source reports available. Try refreshing later.</div>'}

function gmgnMetric(label,value,format=money){return `<span><small>${esc(label)}</small><br><b>${format(value)}</b></span>`}
function gmgnRows(rows,fresh=false){return rows?.length?rows.map(x=>`<article class="panel"><div class="row"><span><span class="badge">${fresh?'NEW':'RANK '+esc(x.rank??'—')}</span><h3>${esc(x.symbol||'Unknown')} · ${esc(x.name||'Unnamed token')}</h3><div class="muted">${esc(String(x.chain||'').toUpperCase())} · ${esc(x.platform||x.exchange||'Platform unavailable')} · GMGN provider query</div></span><a href="${esc(safeLink(x.link))}" target="_blank" rel="noopener noreferrer">Open on GMGN ↗</a></div><div class="grid3">${gmgnMetric('Price USD',x.price,tokenPrice)}${gmgnMetric('Market cap USD',x.market_cap)}${gmgnMetric('Liquidity USD',x.liquidity)}${gmgnMetric(fresh?'1h volume USD':'Interval volume USD',x.volume)}${gmgnMetric('Holders',x.holders)}${gmgnMetric(fresh?'1m swaps':'Interval swaps',x.swaps)}</div><p class="muted">Price change ${pct(x.price_change)} · Rug indicator ${ratioPct(x.rug_ratio)} · Top 10 concentration ${ratioPct(x.top10_rate)} · Smart-money wallets ${money(x.smart_money)}</p></article>`).join(''):'<div class="empty">No GMGN observations returned for this selection.</div>'}
function renderTrending(){layout('Trending & Fresh Coins','Read-only GMGN rankings and newly created tokens. Popularity is activity reported by GMGN, not a recommendation or safety guarantee.',`<section class="panel"><div class="searchbar"><label>Chain <select class="input" id="gmgnChain" data-change-command="loadGmgn()"><option value="sol">Solana</option><option value="bsc">BNB Chain</option><option value="base">Base</option><option value="eth">Ethereum</option></select></label><label>Trending window <select class="input" id="gmgnInterval" data-change-command="loadGmgn()"><option value="1m">1 minute</option><option value="5m" selected>5 minutes</option><option value="1h">1 hour</option><option value="6h">6 hours</option><option value="24h">24 hours</option></select></label><button class="btn" data-command="loadGmgn()">Refresh GMGN</button></div><p class="notice">Fresh tokens are high risk. Check liquidity, holder concentration, contract permissions and independent sources before acting. Missing fields (—) mean the provider did not supply a valid value. A 0% rug indicator is not a safety verdict.</p></section><div id="gmgnStatus" role="status" class="muted" style="margin:14px 0">Loading GMGN…</div><div class="grid2"><section><h2>Popular now</h2><div id="gmgnTrending"></div></section><section><h2>Newly created</h2><div id="gmgnFresh"></div></section></div>`);loadGmgn()}
let gmgnRequest=0;
function gmgnResult(result,label,fresh=false){
 const value=result.status==='fulfilled'?result.value:null;
 if(!value||!Array.isArray(value.data))return {html:'<p>'+label+' data is temporarily unavailable.</p>',summary:label+': unavailable.'};
 const stale=value.status==='STALE',ok=value.status==='PROVIDER_QUERY';
 const summary=label+': '+(ok?'retrieved':stale?'stale cached results':String(value.status||'unavailable').toLowerCase())+(value.retrieved_at?' · Received '+value.retrieved_at:'')+'.';
 return {html:'<p class="muted">'+esc(summary)+(value.message?' '+esc(value.message):'')+'</p>'+((ok||stale)?gmgnRows(value.data,fresh):'<p>No current observations available.</p>'),summary};
}
async function loadGmgn(){
 const status=document.getElementById('gmgnStatus'),chain=document.getElementById('gmgnChain')?.value||'sol',interval=document.getElementById('gmgnInterval')?.value||'5m';if(!status)return;
 const request=++gmgnRequest;status.textContent='Checking GMGN '+chain.toUpperCase()+' data…';
 document.getElementById('gmgnTrending').textContent='Loading selected rankings…';document.getElementById('gmgnFresh').textContent='Loading selected fresh tokens…';
 try{
  const results=await Promise.allSettled([api('/api/gmgn/trending?chain='+encodeURIComponent(chain)+'&interval='+encodeURIComponent(interval)),api('/api/gmgn/fresh?chain='+encodeURIComponent(chain))]);
  if(request!==gmgnRequest||status!==document.getElementById('gmgnStatus'))return;
  const trending=gmgnResult(results[0],'Trending'),fresh=gmgnResult(results[1],'Fresh',true);
  document.getElementById('gmgnTrending').innerHTML=trending.html;document.getElementById('gmgnFresh').innerHTML=fresh.html;
  status.textContent=chain.toUpperCase()+' · '+interval+' trending window · '+trending.summary+' '+fresh.summary+' Rankings can change quickly; refresh to query again.';
 }catch{if(request===gmgnRequest&&status===document.getElementById('gmgnStatus'))status.textContent='GMGN data is temporarily unavailable.'}
}
function searchSources(){const q=document.getElementById('q').value.trim();if(!q)return;const words=q.toLowerCase().match(/[a-z0-9]{3,}/g)||[];const matches=newsData.filter(x=>words.some(w=>x.title.toLowerCase().includes(w))).slice(0,6);document.getElementById('chat').insertAdjacentHTML('beforeend',`<div class="msg user">${esc(q)}</div><div class="msg bot"><b>Source search · no AI interpretation</b>${newsCards(matches)}${marketData.filter(x=>words.some(w=>x.symbol.toLowerCase().includes(w))).map(x=>`<p>${esc(x.symbol)} ${money(x.price)} ${esc(x.quote)} · ${esc(x.status)} · ${esc(x.updated)}</p>`).join('')}</div>`)}
let aiBusy=false;
let aiHistory=[];
async function sendAI(){if(aiBusy)return;const q=document.getElementById('q').value.trim();const consent=document.getElementById('aiConsent').checked;if(!q)return;if(!consent){alert('Confirm sharing the question, or use source search.');return}const el=document.getElementById('chat');const button=document.getElementById('aiSend');aiBusy=true;button.disabled=true;button.textContent='Thinking…';el.insertAdjacentHTML('beforeend',`<div class="msg user">${esc(q)}</div>`);try{const x=await postJSON('/api/ai',{question:q,consent,history:aiHistory.slice(-4)});if(el!==document.getElementById('chat'))return;aiHistory.push({role:'user',content:q.slice(0,1500)},{role:'assistant',content:x.answer.slice(0,1500)});aiHistory=aiHistory.slice(-4);if(document.getElementById('q').value.trim()===q)document.getElementById('q').value='';el.insertAdjacentHTML('beforeend',`<div class="msg bot"><b>${x.mode==='GENERAL'?'GENERAL ANSWER':'SOURCE-LINKED ANSWER'} · ${esc(x.provider)}</b><p style="white-space:pre-wrap">${esc(x.answer)}</p><p>${esc(x.limitations)}</p>${x.sources.map(r=>`<p><a href="${esc(safeLink(r.source_url||r.link))}" target="_blank" rel="noopener noreferrer">${esc(r.id)} · ${esc(r.title||r.symbol||r.source)}</a><br><small>Observed ${esc(r.updated||r.published||'Date unavailable')} · Retrieved ${esc(r.retrieved_at)}</small></p>`).join('')}</div>`)}catch(e){if(el===document.getElementById('chat'))el.insertAdjacentHTML('beforeend',`<div class="msg bot">${esc(e.message)}</div>`)}finally{aiBusy=false;button.disabled=false;button.textContent='Ask AI';el.scrollTop=el.scrollHeight}}

function renderCrypto(){layout('Crypto Intelligence','Crypto ticker updates stream while connected. Snapshots remain available as a fallback. Token security is a separate check.',`<div class="notice">⚠ Security status is <b>UNKNOWN</b> until a security provider returns evidence. VANTIX never turns missing data into a clean bill of health.</div><div class="grid2"><div class="panel"><h3>CRYPTO MARKET</h3>${marketRows(x=>['BTC','ETH','BNB','SOL','DOGE','XRP','ADA'].includes(x.symbol))}</div><div class="panel"><h3>EXCHANGE COMPARISON</h3><p class="muted">Binance and Bybit public streams. Main prices prefer a fresh Binance quote, then Bybit. Exchanges can disagree; these are not blended prices.</p><div id="exchangeComparison"></div><h3>TOKEN PAIRS</h3><label>Chain <select class="input" id="pairChain"><option value="bsc">BNB Chain</option><option value="solana">Solana</option><option value="ethereum">Ethereum</option></select></label><label>Token address <input class="input" id="pairToken"></label><button class="btn" data-command="loadTokenPairs()">Find trading pairs</button><div id="pairResults" role="status"></div><h3>CRYPTO ACTIONS</h3><button class="btn" data-command="go('/shield')">Open Shield</button> <button class="btn" data-command="go('/radar')">Open Radar</button></div></div>`)}
function renderNews(){layout('News & Intelligence','Official releases, earthquake reports and publisher links indexed by GDELT. Coverage is incomplete; indexed headlines are not independently verified.',`<div class="toolbar">${[['all','All sources'],['policy','Central banks'],['energy','Energy'],['world','World events']].map(([k,t])=>`<button class="pill" data-command="filterNews('${k}')">${t}</button>`).join('')}</div><div class="panel" id="newsResults">${newsList(40)}</div>`)}
function filterNews(topic){document.getElementById('newsResults').innerHTML=newsCards(newsData.filter(x=>topic==='all'||x.category===topic))}
function renderFeed(){layout('VANTIX Feed','A verified conversation layer for market news, new projects, breaking events and what is moving the world.',`<div class="notice"><b>Verified-only participation.</b> Anyone can read the feed. Only accounts with a verified email can publish posts or comments. Email verification does not verify the accuracy of a post. Check original sources before relying on a claim.</div><div class="grid2"><div class="panel"><h3>POST TO VANTIX FEED</h3><div id="authBox"></div><label>Post type <select class="input" id="postLabel"><option>Community commentary</option><option>AI Interpretation</option><option>Rumour</option><option>Prediction</option></select></label><textarea class="input" id="postBody" rows="4" placeholder="What is happening? Share a market event, new project, breaking story or analysis..."></textarea><div class="searchbar" style="margin-top:8px"><input class="input" id="postSource" placeholder="Source URL (optional)"><button class="btn" data-command="createPost()">Publish</button></div></div><div class="panel"><h3>SOCIAL SOURCES</h3><div id="socialFeed"><div class="empty">Loading social sources…</div></div></div></div><div class="panel" style="margin-top:14px"><h3>COMMUNITY FEED</h3><div id="feedUpdateStatus" class="muted" role="status">Checking for conversations…</div><button id="showFeedUpdates" class="pill" style="display:none" data-command="applyFeedUpdates()">Show new conversations</button><div id="communityFeed"><div class="empty">Loading…</div></div></div>`);feedSnapshot=null;pendingFeed=null;loadAuth();loadFeed();loadSocial()}
async function loadAuth(){const box=document.getElementById('authBox');try{const x=await api('/api/auth/me',{headers:authHeaders()});if(box!==document.getElementById('authBox'))return;if(x.authenticated){box.innerHTML=`<div class="notice">${x.user.verified?'Email verified':'Email unverified'}: ${esc(x.user.email)} <button class="pill" data-command="logoutUser()">Sign out</button></div>`}else{box.innerHTML='<div class="searchbar"><input class="input" id="authEmail" type="email" autocomplete="email" placeholder="Email"><input class="input" id="authPassword" type="password" autocomplete="current-password" placeholder="Password (8+ chars)"><button class="btn" data-command="registerUser()">Register</button><button class="btn" data-command="loginUser()">Sign in</button></div><button class="pill" data-command="requestEmail(&quot;reset-request&quot;)">Forgot password</button><button class="pill" data-command="requestEmail(&quot;resend&quot;)">Resend verification</button><div id="authMsg" role="status" class="muted" style="margin:8px 0"></div>'}}catch{if(box===document.getElementById('authBox'))box.innerHTML='<p>Account service unavailable.</p><button class="pill" data-command="loadAuth()">Retry</button>'}}
let authBusy=false;
async function submitAuth(action){if(authBusy)return;const message=document.getElementById('authMsg');const email=document.getElementById('authEmail').value;const password=document.getElementById('authPassword').value;authBusy=true;message.textContent='Please wait…';try{const x=await api('/api/auth/'+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});if(message!==document.getElementById('authMsg'))return;if(x.authenticated){storageRemove('vantix_token');render()}else{message.textContent=x.message;if(x.dev_verification_url){const a=document.createElement('a');a.href=safeLink(x.dev_verification_url);a.textContent=' Open local test verification';a.target='_blank';a.rel='noopener';message.append(a)}}}catch(error){if(message===document.getElementById('authMsg'))message.textContent=error.message}finally{authBusy=false}}
function registerUser(){return submitAuth('register')}
function loginUser(){return submitAuth('login')}
async function logoutUser(){aiHistory=[];try{await api('/api/auth/logout',{method:'POST',headers:{'Content-Type':'application/json'}});storageRemove('vantix_token');render()}catch(error){alert('Sign-out could not reach the server. Your session is still active. Try again.')}}

function authHeaders(){return {}}
let postBusy=false;
async function createPost(){if(postBusy)return;const input=document.getElementById('postBody');const source=document.getElementById('postSource');const body=input.value.trim();if(!body||body.length>1000){alert('Use 1–1000 characters.');return}postBusy=true;try{await api('/api/feed/post',{method:'POST',headers:{'Content-Type':'application/json',...authHeaders()},body:JSON.stringify({body,label:document.getElementById('postLabel').value,source_url:source.value.trim(),source_label:source.value.trim()?'Source':''})});if(input===document.getElementById('postBody')){input.value='';source.value='';await loadFeed()}}catch(error){alert(error.message)}finally{postBusy=false}}

let feedSnapshot=null,pendingFeed=null,feedBusy=false;
function paintFeed(x){const el=document.getElementById('communityFeed');if(!el)return;
const drafts=Array.from(el.querySelectorAll('input')).map(i=>[i.id,i.value]);
const active=document.activeElement;const focusId=active?.id;const start=active?.selectionStart;const end=active?.selectionEnd;
el.innerHTML=x.data.length?x.data.map(p=>`<div class="panel" style="margin:8px 0"><div class="muted">${esc(p.display_name)} · Email verified · ${esc(p.label)} · ${new Date(p.created_at).toLocaleString()}</div><div style="margin:8px 0;line-height:1.5">${esc(p.body)}</div>${p.source_url?`<a href="${esc(safeLink(p.source_url))}" target="_blank" rel="noopener" style="color:#5fdfff">${esc(p.source_label||'Open source')}</a>`:''}<div class="toolbar"><button class="pill" data-command="reactPost(${p.id},${!p.reacted})">${p.reacted?'Liked':'Like'} · ${Number(p.reactions)||0}</button><button class="pill" data-command="reportContent('post',${p.id})">Report</button></div><div class="rows" style="margin-top:10px">${p.comments_list.map(c=>`<div class="row"><span><b>${esc(c.display_name)}</b> · ${esc(c.body)} <button class="pill" data-command="reportContent('comment',${c.id})">Report</button></span><small>${new Date(c.created_at).toLocaleString()}</small></div>`).join('')}</div><div class="searchbar" style="margin-top:8px"><input class="input" id="comment-${p.id}" placeholder="Comment on this post"><button class="pill" data-command="commentPost(${p.id})">Comment</button></div></div>`).join(''):'<div class="empty">No community posts yet. Be the first verified member to post.</div>';
for(const[id,value]of drafts){const field=document.getElementById(id);if(field)field.value=value}
const focused=document.getElementById(focusId);if(focused){focused.focus();if(start!=null)focused.setSelectionRange(start,end)}
feedSnapshot=JSON.stringify(x.data);pendingFeed=null;
const button=document.getElementById('showFeedUpdates');if(button)button.style.display='none';
}
function applyFeedUpdates(){if(pendingFeed)paintFeed(pendingFeed)}
async function loadFeed(background=false){
if(feedBusy||!document.getElementById('communityFeed'))return;feedBusy=true;
const target=document.getElementById('communityFeed');
try{const response=await fetch('/api/feed',{cache:'no-store'});if(!response.ok)throw Error('Feed unavailable');const x=await response.json();if(!Array.isArray(x.data))throw Error('Invalid feed');if(target!==document.getElementById('communityFeed'))return;
if(JSON.stringify(x.data)!==feedSnapshot){if(background&&feedSnapshot!==null){pendingFeed=x;document.getElementById('showFeedUpdates').style.display='inline-block'}else paintFeed(x)}
document.getElementById('feedUpdateStatus').textContent='Last checked '+new Date().toLocaleTimeString()+' · Updates checked every 10 seconds';
}catch(error){if(target===document.getElementById('communityFeed')){document.getElementById('feedUpdateStatus').textContent='Connection unavailable. Retrying every 10 seconds.';if(feedSnapshot===null)target.innerHTML='<div class="empty">Conversations could not be loaded.</div>'}}
finally{feedBusy=false}
}
setInterval(()=>{if(!document.hidden)loadFeed(true)},10000);

const commentBusy=new Set();
async function commentPost(id){if(commentBusy.has(id))return;const input=document.getElementById('comment-'+id);if(!input.value.trim()||input.value.length>500){alert('Use 1–500 characters.');return}commentBusy.add(id);try{await api('/api/feed/comment',{method:'POST',headers:{'Content-Type':'application/json',...authHeaders()},body:JSON.stringify({post_id:id,body:input.value})});if(input===document.getElementById('comment-'+id)){input.value='';await loadFeed()}}catch(error){alert(error.message)}finally{commentBusy.delete(id)}}
function loadSocial(){const el=document.getElementById('socialFeed');if(el)el.innerHTML='<div class="empty">External social feeds are disabled in this free-only build. Read and post community conversations below.</div>'}

function renderShield(){layout('VANTIX Shield','Token-risk intelligence. Never confuse an unavailable check with a clean result.',`<div class="panel"><div class="searchbar"><label>Chain <select class="input" id="securityChain"><option value="56">BNB Chain</option><option value="1">Ethereum</option></select></label><input class="input" id="token" placeholder="Paste token contract address"><button class="btn" data-command="checkShield()">Check</button></div><div id="shieldResult" style="margin-top:15px"><div class="empty">No token checked.</div></div></div>`)}
async function checkShield(){const t=document.getElementById('token').value.trim();if(!t)return;const el=document.getElementById('shieldResult');el.textContent='Checking availability…';try{const j=await api('/api/shield?chain='+document.getElementById('securityChain').value+'&token='+encodeURIComponent(t));if(el===document.getElementById('shieldResult'))el.innerHTML=`<div class="panel"><span class="badge warn">${esc(j.status)}</span><p>${esc(j.message)}</p><p>Received ${esc(j.retrieved_at||'Never')}</p>${(j.data||[]).map(r=>`<div class="row"><b>${esc(r.title)}</b><span>${esc(r.value)}</span></div>`).join('')}</div>`}catch{if(el===document.getElementById('shieldResult'))el.textContent='UNKNOWN — security service unavailable.'}}

const cfg={
'/stocks':['Stocks','Equities intelligence and company analysis.','US EQUITIES','INDEXES','EARNINGS',['/research','/radar','/alerts']],'/forex':['Forex','Currency markets and macro drivers.','G10','EM FX','CENTRAL BANKS',['/economy','/news','/alerts']],'/commodities':['Commodities','Energy, metals and agricultural market intelligence.','GOLD','OIL','INDUSTRIAL METALS',['/markets','/news','/radar']],'/economy':['Economy','Macro indicators and economic narratives.','INFLATION','RATES','GDP',['/forex','/research','/news']],'/radar':['Market Radar','Unusual moves, volume, narrative and news signals.','PRICE SPIKES','VOLUME','NEWS SHOCKS',['/news','/markets','/ask']],'/watchlist':['Watchlist','Save assets locally and open them from one workspace.','FAVOURITES','PRICE ALERTS','AI MONITORING',['/alerts','/ask','/portfolio']],'/alerts':['Alerts','Locally saved rules only. Alerts are not evaluated and notifications are not sent.','PRICE','NEWS','RISK',['/watchlist','/shield','/radar']],'/research':['Research','Structured research workspace for market questions.','COMPANY','SECTOR','MACRO',['/sectors','/economy','/ask']],'/sectors':['Sector Analysis','Compare sector momentum, catalysts and risk.','TECH','FINANCE','ENERGY',['/stocks','/commodities','/research']]};
function generic(path){
const c=cfg[path];layout(c[0],c[1],'');
if(path==='/forex')page.innerHTML+=`<div class="panel"><h2>Daily reference exchange rates</h2>${marketRows(x=>x.symbol.includes('/'))}</div>`;
else if(path==='/economy'||path==='/sectors')renderIndicators(path);
else if(path==='/stocks'||path==='/research')renderFilings();
else if(path==='/commodities')page.innerHTML+=`<div class="panel"><h2>Energy releases</h2><p class="muted">Published analysis, not live commodity quotes. Gold, silver and oil spot prices are not connected.</p>${newsCards(newsData.filter(x=>x.category==='energy'))}<p><a href="https://www.worldbank.org/en/research/commodity-markets" target="_blank" rel="noopener">World Bank commodity price reports ↗</a></p></div>`;
else if(path==='/radar'){const movers=marketData.filter(x=>x.change!=null).sort((a,b)=>Math.abs(b.change)-Math.abs(a.change));page.innerHTML+=`<div class="panel"><h2>Largest 24-hour moves in tracked assets</h2><p class="muted">Calculated from seven tracked USDT assets using available exchange feeds, not the entire market. Each row identifies its exchange; prices and changes can differ between exchanges. Volume is 24-hour quote volume; it is not proof of unusual activity. Causes have not been established.</p>${movers.length?movers.map(x=>`<div class="row"><span><b>${esc(x.symbol)}</b><br><small>${esc(x.source)} · ${esc(x.updated)} · ${esc(x.status)}</small></span><span>${pct(x.change)}<br><small>Volume ${Number(x.volume).toLocaleString()} USDT</small></span></div>`).join(''):'<div class="empty">Price observations unavailable.</div>'}</div>`}
else if(path==='/watchlist')renderWatchExtra();
else if(path==='/alerts')renderAlertExtra();
}
function sourceStatus(sources){return sources.map(x=>`<div class="row"><span>${esc(x.source)}<br><small>Checked ${esc(x.checked_at||'Not checked')}<br>Last received ${esc(x.retrieved_at||'Never')}</small></span><span class="badge">${esc(x.status||'UNKNOWN')}</span></div>`).join('')}
function renderIndicators(path){const sector=path==='/sectors';page.innerHTML+=`<div class="panel"><h2>${sector?'Economic sector composition':'Economic indicators'}</h2><p class="muted">Annual World Bank observations; reporting years can differ. ${sector?'These figures describe the economy, not stock-sector investment returns.':''}</p><label>Country <select class="input" id="countrySelect" data-change-command="loadIndicators('${path}')">${[['GBR','United Kingdom'],['USA','United States'],['CHN','China'],['DEU','Germany'],['JPN','Japan'],['IND','India'],['WLD','World']].map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label><div id="indicatorResults" aria-live="polite">Loading observations…</div></div>`;loadIndicators(path)}
let indicatorRequest=0;
async function loadIndicators(path){const id=++indicatorRequest;const target=document.getElementById('indicatorResults');const country=document.getElementById('countrySelect').value;try{const r=await fetch('/api'+path+'?country='+country);if(!r.ok)throw Error();const x=await r.json();if(id!==indicatorRequest||target!==document.getElementById('indicatorResults'))return;target.innerHTML=`<p class="muted">${esc(x.source||'World Bank')} · ${esc(x.status||'UNAVAILABLE')} · Checked ${esc(x.checked_at||'Not checked')}</p>`+(x.data?.length?x.data.map(row=>`<div class="row"><span><b>${esc(row.title)}</b><br><small>${esc(row.country)} · Reporting year ${esc(row.updated)}</small><br><a href="${esc(safeLink(row.link))}" target="_blank" rel="noopener">Source ↗</a></span><b>${Number(row.value).toFixed(2)}%</b></div>`).join(''):`<div class="empty">${esc(x.message||'No observations returned.')}</div>`)}catch{if(target===document.getElementById('indicatorResults'))target.innerHTML='<div class="empty">Economic source unavailable. No figures have been substituted.</div>'}}
function renderFilings(){page.innerHTML+=`<section class="panel"><h2>Company filings</h2><p class="muted">Search official SEC submissions by numeric CIK. Filing dates are shown as reported; these are not share prices.</p><div class="searchbar"><label>SEC company CIK <input class="input" id="companyCik" inputmode="numeric" placeholder="e.g. 320193"></label><button class="btn" data-command="loadFilings()">Find filings</button><a href="https://www.sec.gov/edgar/search/" target="_blank" rel="noopener">Find a company’s CIK ↗</a></div><div id="filingResults" aria-live="polite"></div></section>`}
async function loadFilings(){const el=document.getElementById('filingResults');const cik=document.getElementById('companyCik').value.trim();if(!/^\d{1,10}$/.test(cik)){el.textContent='Enter a numeric CIK of up to 10 digits.';return}el.textContent='Looking up SEC filings…';try{const r=await fetch('/api/filings?cik='+encodeURIComponent(cik));const x=await r.json();if(el!==document.getElementById('filingResults'))return;el.innerHTML=`<p class="muted">${esc(x.status||'UNAVAILABLE')} · ${esc(x.checked_at||'Not checked')}</p>`+(x.data?.length?newsCards(x.data):`<p>${esc(x.message||'No filings returned.')}</p>`)}catch{el.textContent='SEC filings could not be retrieved.'}}

function moduleInfo(x){let d=document.getElementById('moduleDetail');if(d)d.innerHTML='<b>'+esc(x)+'</b> selected. Connect the relevant licensed provider to populate this workspace with live evidence.'}
function renderWatchExtra(){let symbols=saved('vantix_watch');page.innerHTML+=`<div class="panel" style="margin-top:14px"><h3>SAVED ASSETS</h3><div class="searchbar"><input class="input" id="watchInput" placeholder="Symbol e.g. BTC"><button class="btn" data-command="addWatch()">Add</button></div><div id="watchList" class="rows" style="margin-top:10px">${symbols.length?symbols.map((s,i)=>`<div class="row"><b>${esc(s)}</b><button class="pill" data-command="removeWatchAt(${i})">Remove</button></div>`).join(''):'<div class="empty">No saved assets yet.</div>'}</div></div>`}
function addWatch(){let v=document.getElementById('watchInput').value.trim().toUpperCase();if(!validSymbol(v)){alert('Use a symbol of 1–24 letters, numbers, dots, slashes, hyphens or underscores.');return}let a=saved('vantix_watch');if(!a.includes(v))a.push(v);storageSet('vantix_watch',JSON.stringify(a));render()}
function removeWatchAt(i){const items=saved('vantix_watch');items.splice(i,1);storageSet('vantix_watch',JSON.stringify(items));render()}
function removeWatch(v){let a=saved('vantix_watch').filter(x=>x!==v);storageSet('vantix_watch',JSON.stringify(a));render()}
function renderAlertExtra(){let a=saved('vantix_alerts');page.innerHTML+=`<div class="panel" style="margin-top:14px"><h3>LOCAL ALERT RULES</h3><div class="searchbar"><input class="input" id="alertSymbol" placeholder="Symbol"><input class="input" id="alertPrice" type="number" placeholder="Price"><button class="btn" data-command="addAlert()">Add</button></div><div class="rows" style="margin-top:10px">${a.length?a.map((x,i)=>`<div class="row"><span><b>${esc(x.symbol)}</b> ≥ ${esc(x.price)}</span><button class="pill" data-command="removeAlert(${i})">Remove</button></div>`).join(''):'<div class="empty">No alerts configured.</div>'}</div></div>`}
function addAlert(){let s=document.getElementById('alertSymbol').value.trim().toUpperCase(),p=Number(document.getElementById('alertPrice').value);if(!validSymbol(s)||!Number.isFinite(p)||p<=0){alert('Enter a valid symbol and a positive finite price.');return}let a=saved('vantix_alerts');a.push({symbol:s,price:p});storageSet('vantix_alerts',JSON.stringify(a));render()}
function removeAlert(i){let a=saved('vantix_alerts');a.splice(i,1);storageSet('vantix_alerts',JSON.stringify(a));render()}
function renderPortfolio(){let holdings=saved('vantix_portfolio');layout('Portfolio Tracker','Local portfolio workspace. Valuations use USDT crypto snapshots when symbols match; USDT is not the same as USD.',`<div class="panel"><h3>ADD HOLDING</h3><div class="searchbar"><input class="input" id="portSymbol" placeholder="BTC"><input class="input" id="portQty" type="number" placeholder="Quantity"><button class="btn" data-command="addHolding()">Add</button></div></div><div class="panel" style="margin-top:14px"><h3>HOLDINGS</h3>${holdings.length?`<table class="table"><tr><th>Asset</th><th>Quantity</th><th>Price (USDT)</th><th>Value (USDT)</th><th>Status / observed</th><th></th></tr>${holdings.map((h,i)=>{let x=marketData.find(m=>m.symbol===h.symbol&&m.quote==='USDT');let v=x?x.price*h.qty:null;return `<tr><td><b>${esc(h.symbol)}</b></td><td>${esc(h.qty)}</td><td>${money(x?.price)}</td><td>${money(v)}</td><td>${esc(x?.status||'UNAVAILABLE')}<br>${esc(x?.updated||'No quote')}</td><td><button class="pill" data-command="removeHolding(${i})">Remove</button></td></tr>`}).join('')}</table>`:'<div class="empty">No holdings yet.</div>'}</div>`)}
function addHolding(){let s=document.getElementById('portSymbol').value.trim().toUpperCase(),q=Number(document.getElementById('portQty').value);if(!validSymbol(s)||!Number.isFinite(q)||q<=0){alert('Enter a valid symbol and a positive finite quantity.');return}let a=saved('vantix_portfolio');a.push({symbol:s,qty:q});storageSet('vantix_portfolio',JSON.stringify(a));render()}
function removeHolding(i){let a=saved('vantix_portfolio');a.splice(i,1);storageSet('vantix_portfolio',JSON.stringify(a));render()}
function render(){let p=location.pathname.replace(/\/$/,'')||'/';document.querySelectorAll('[data-route]').forEach(a=>a.classList.toggle('active',a.dataset.route===p));if(p==='/')renderHome();else if(p==='/ask'||p==='/copilot')renderAsk();else if(p==='/markets')renderMarkets();else if(p==='/crypto')renderCrypto();else if(p==='/trending')renderTrending();else if(p==='/news')renderNews();else if(p==='/feed')renderFeed();else if(p==='/shield')renderShield();else if(['/watchlist','/portfolio','/alerts'].includes(p))renderSaved(p.slice(1));else if(p==='/account')renderAccount();else if(p==='/admin')renderAdmin();else if(p==='/reset-password')renderReset();else if(p==='/privacy'||p==='/terms')renderPolicy(p);else if(cfg[p])generic(p);else renderHome();mountMarketChart()}

// Public read-only ticker stream. LIVE requires fresh provider events, not just an open socket.
const STREAM_SYMBOLS=['BTC','ETH','BNB','SOL','DOGE','XRP','ADA'];
let bybitStatus='Connecting';
let bybitSocket=null,bybitRetry=null,bybitFailures=0,bybitOpenedAt=0,lastBybitEvent=0;
let cryptoSocket=null,streamRetry=null,streamFailures=0,streamOpenedAt=0,lastStreamEvent=0;
const liveQuotes=new Map();
function freshLive(row,now=Date.now()){return row&&row.status==='LIVE'&&(row.provider==='bybit'?bybitSocket:cryptoSocket)?.readyState===1&&now-row.receivedAt<15000&&now-row.eventAt<15000&&now>=row.eventAt-5000}
function preferredLive(symbol){return [liveQuotes.get('binance/'+symbol),liveQuotes.get('bybit/'+symbol)].find(r=>freshLive(r))}
function mergeLiveQuotes(rows){const merged=rows.map(r=>preferredLive(r.symbol)||r);for(const symbol of STREAM_SYMBOLS){const r=preferredLive(symbol);if(r&&!merged.some(x=>x.symbol===symbol))merged.push(r)}return merged}
function acceptTicker(raw,now=Date.now(),provider='binance'){
 if(!['binance','bybit'].includes(provider))return false;
 if(!raw||raw.e!=='24hrTicker'||typeof raw.s!=='string'||!raw.s.endsWith('USDT'))return false;
 const symbol=raw.s.slice(0,-4),price=Number(raw.c),change=Number(raw.P),volume=Number(raw.q),eventAt=Number(raw.E),closeAt=Number(raw.C);
 if(!STREAM_SYMBOLS.includes(symbol)||[raw.c,raw.P,raw.q,raw.E,raw.C].some(v=>v==null||v==='')||![price,change,volume,eventAt,closeAt].every(Number.isFinite)||price<=0||volume<0||now-eventAt>15000||eventAt-now>5000||closeAt>eventAt+5000||eventAt-closeAt>15000)return false;
 const previous=liveQuotes.get(provider+'/'+symbol);if(previous&&eventAt<=previous.eventAt)return false;
 const row={symbol,price,change,volume,quote:'USDT',provider,source:provider==='bybit'?'Bybit stream':'Binance stream',source_url:provider==='bybit'?'https://www.bybit.com/en/trade/spot/'+symbol+'/USDT':'https://www.binance.com/en/trade/'+symbol+'_USDT',status:'LIVE',updated:new Date(closeAt).toISOString(),eventAt,receivedAt:now};
 liveQuotes.set(provider+'/'+symbol,row);if(provider==='bybit'){lastBybitEvent=now;bybitFailures=0}else{lastStreamEvent=now;streamFailures=0}marketData=mergeLiveQuotes(marketData);return true;
}
function updateCryptoStatus(){const count=STREAM_SYMBOLS.filter(s=>preferredLive(s)).length;const el=document.getElementById('dataStatus');if(el)el.textContent=count===7?'CRYPTO LIVE · FX REFERENCE':count?'CRYPTO LIVE '+count+'/7 · FX REFERENCE':marketData.length?'SNAPSHOTS / REFERENCE':'CONNECTING TO MARKET DATA'}
function expireLiveQuotes(){const now=Date.now();marketData=mergeLiveQuotes(marketData).map(r=>r.status==='LIVE'&&!freshLive(r,now)?{...r,status:'STALE'}:r);updateCryptoStatus()}
function paintLiveQuotes(){expireLiveQuotes();paintExchangeComparison();const path=location.pathname;
 // Update only price panels; inputs, drafts and focus are preserved.
 document.querySelectorAll('[data-market-filter]').forEach(el=>{const mode=el.dataset.marketFilter;el.innerHTML=marketRowsContent(mode==='crypto'?x=>!x.symbol.includes('/'):mode==='fx'?x=>x.symbol.includes('/'):()=>true)});
 if(path==='/radar'&&!page.querySelector('input,textarea,select'))render();
}
function scheduleStream(){if(streamRetry||document.hidden)return;const delay=Math.min(30000,1000*2**Math.min(streamFailures++,5));streamRetry=setTimeout(()=>{streamRetry=null;connectCryptoStream()},delay)}
function disconnectCrypto(){const ws=cryptoSocket;cryptoSocket=null;if(ws){ws.onclose=null;ws.close()}expireLiveQuotes();paintLiveQuotes()}
function connectCryptoStream(){if(typeof WebSocket==='undefined'||document.hidden||cryptoSocket)return;
 const streams=STREAM_SYMBOLS.map(s=>s.toLowerCase()+'usdt@ticker').join('/');
 try{const ws=new WebSocket('wss://data-stream.binance.vision/stream?streams='+streams);cryptoSocket=ws;streamOpenedAt=Date.now();lastStreamEvent=0;
 ws.onmessage=e=>{if(ws!==cryptoSocket)return;try{const value=JSON.parse(e.data);acceptTicker(value.data||value)}catch{}};
 ws.onerror=()=>{if(ws===cryptoSocket)ws.close()};
 ws.onclose=()=>{if(ws!==cryptoSocket)return;cryptoSocket=null;paintLiveQuotes();scheduleStream();loadData()};
 }catch{cryptoSocket=null;scheduleStream()}}
setInterval(()=>{if(document.hidden)return;paintLiveQuotes();if(cryptoSocket&&Date.now()-(lastStreamEvent||streamOpenedAt)>20000){disconnectCrypto();scheduleStream();loadData()}},1000);
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(streamRetry){clearTimeout(streamRetry);streamRetry=null}disconnectCrypto()}else{connectCryptoStream();loadData()}});
setTimeout(connectCryptoStream,0);
function paintExchangeComparison(){const el=document.getElementById('exchangeComparison');if(!el)return;el.innerHTML='<table class="table"><tr><th>Asset</th><th>Binance · USDT</th><th>Bybit · USDT</th></tr>'+STREAM_SYMBOLS.map(symbol=>'<tr><td>'+symbol+'</td>'+['binance','bybit'].map(provider=>{const r=liveQuotes.get(provider+'/'+symbol);return '<td>'+(r?money(r.price)+'<br><small>'+(freshLive(r)?'LIVE':'STALE')+' · '+esc(r.updated)+'</small>':esc(provider==='bybit'?bybitStatus:'No streaming quote'))+'</td>'}).join('')+'</tr>').join('')+'</table>'}
function acceptBybitMessage(value,now=Date.now()){if(value?.type!=='snapshot'||typeof value.topic!=='string')return false;const row=value.data;if(!row||value.topic!=='tickers.'+row.symbol||row.price24hPcnt==null||row.price24hPcnt==='')return false;return acceptTicker({e:'24hrTicker',s:row.symbol,c:row.lastPrice,P:Number(row.price24hPcnt)*100,q:row.turnover24h,E:value.ts,C:value.ts},now,'bybit')}
function scheduleBybit(){if(bybitRetry||document.hidden)return;const delay=Math.min(30000,1000*2**Math.min(bybitFailures++,5));bybitRetry=setTimeout(()=>{bybitRetry=null;connectBybit()},delay)}
function disconnectBybit(){const ws=bybitSocket;bybitSocket=null;if(ws){ws.onclose=null;ws.close()}paintLiveQuotes()}
function connectBybit(){if(typeof WebSocket==='undefined'||document.hidden||bybitSocket)return;try{const ws=new WebSocket('wss://stream.bybit.com/v5/public/spot');bybitSocket=ws;bybitStatus='Connecting';bybitOpenedAt=Date.now();lastBybitEvent=0;ws.onopen=()=>{if(ws===bybitSocket){bybitStatus='Awaiting ticker';ws.send(JSON.stringify({op:'subscribe',args:STREAM_SYMBOLS.map(s=>'tickers.'+s+'USDT')}))}};ws.onmessage=e=>{if(ws!==bybitSocket)return;try{const value=JSON.parse(e.data);if(value.op==='subscribe'&&value.success===false)bybitStatus='Subscription rejected';else if(acceptBybitMessage(value))bybitStatus='Connected'}catch{}};ws.onerror=()=>{if(ws===bybitSocket)ws.close()};ws.onclose=()=>{if(ws!==bybitSocket)return;bybitSocket=null;bybitStatus='Unavailable · reconnecting';paintLiveQuotes();scheduleBybit();loadData()}}catch{bybitSocket=null;bybitStatus='Unavailable · reconnecting';scheduleBybit()}}
setInterval(()=>{if(bybitSocket?.readyState===1){try{bybitSocket.send(JSON.stringify({op:'ping'}))}catch{bybitSocket.close()}}if(!document.hidden&&bybitSocket&&Date.now()-(lastBybitEvent||bybitOpenedAt)>30000){disconnectBybit();scheduleBybit();loadData()}},20000);
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(bybitRetry){clearTimeout(bybitRetry);bybitRetry=null}disconnectBybit()}else connectBybit()});
setTimeout(connectBybit,0);

// Explicit function allowlist and literal arguments only. No eval or Function constructor.
function dispatchCommand(command){
 const match=/^([A-Za-z]+)\((.*)\)$/.exec(command||'');if(!match)return;
 const actions={addAlert,addHolding,addSaved,addWatch,analyticsOff,analyticsOn,applyFeedUpdates,checkShield,commentPost,createPost,downloadNextAccounts,filterNews,go,loadGmgn,loadIndicators,loadAuth,loadData,loadFilings,loadOperations,loadTokenPairs,loginUser,logoutUser,moderate,moderateUserAction,reactPost,registerUser,removeAlert,removeHolding,removeSaved,removeWatchAt,reportContent,requestEmail,resetPassword,saveProfile,searchSources,sendAI};if(!Object.prototype.hasOwnProperty.call(actions,match[1]))return;
 const raw=match[2].trim();let args=[];
 if(raw){const parts=raw.split(',').map(x=>x.trim());for(const part of parts){
  if(/^'[^'\\]*'$/.test(part)||/^"[^"\\]*"$/.test(part))args.push(part.slice(1,-1));
  else if(/^-?\d+$/.test(part)&&Number.isSafeInteger(Number(part)))args.push(Number(part));
  else if(part==='true'||part==='false')args.push(part==='true');else return;
 }}
 return actions[match[1]](...args);
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-command]');if(el)dispatchCommand(el.dataset.command)});
document.addEventListener('change',e=>{if(e.target.dataset.changeCommand)dispatchCommand(e.target.dataset.changeCommand)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='q'){e.preventDefault();sendAI();return}if(e.key==='Enter'&&e.target.dataset.keyRoute)go(e.target.dataset.keyRoute)});

document.addEventListener('click',e=>{const asset=e.target.closest('[data-asset]');if(asset){assetAction(asset.dataset.asset);return}let a=e.target.closest('a[data-route]');if(a){e.preventDefault();go(a.dataset.route)}});document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-asset]')){e.preventDefault();assetAction(e.target.dataset.asset)}});window.onpopstate=render;document.getElementById('globalSearch').onclick=()=>go('/ask');render();
</script></body></html>
