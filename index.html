const chartCatalog={
 crypto:[['BINANCE:BTCUSDT','Bitcoin'],['BINANCE:ETHUSDT','Ethereum'],['BINANCE:SOLUSDT','Solana'],['BINANCE:BNBUSDT','BNB'],['BINANCE:XRPUSDT','XRP'],['BINANCE:ADAUSDT','Cardano'],['BINANCE:DOGEUSDT','Dogecoin'],['BINANCE:AVAXUSDT','Avalanche'],['BINANCE:LINKUSDT','Chainlink'],['BINANCE:DOTUSDT','Polkadot'],['BINANCE:LTCUSDT','Litecoin'],['BINANCE:TRXUSDT','TRON']],
 stocks:[['NASDAQ:AAPL','Apple'],['NASDAQ:MSFT','Microsoft'],['NASDAQ:NVDA','NVIDIA'],['NASDAQ:AMZN','Amazon'],['NASDAQ:GOOGL','Alphabet'],['NASDAQ:TSLA','Tesla'],['NYSE:JPM','JPMorgan'],['NYSE:BRK.B','Berkshire Hathaway'],['AMEX:SPY','S&P 500 ETF'],['NASDAQ:QQQ','Nasdaq 100 ETF']],
 forex:[['FX:EURUSD','EUR / USD'],['FX:GBPUSD','GBP / USD'],['FX:USDJPY','USD / JPY'],['FX:USDCHF','USD / CHF'],['FX:AUDUSD','AUD / USD'],['FX:USDCAD','USD / CAD'],['FX:NZDUSD','NZD / USD'],['FX:EURGBP','EUR / GBP']],
 commodities:[['TVC:GOLD','Gold'],['TVC:SILVER','Silver'],['TVC:UKOIL','Brent oil'],['TVC:USOIL','WTI oil'],['NYMEX:NG1!','Natural gas'],['CBOT:ZC1!','Corn'],['CBOT:ZW1!','Wheat'],['COMEX:HG1!','Copper']]
};
const chartChoices={'/markets':Object.values(chartCatalog).flat().map(x=>x[0]),'/crypto':chartCatalog.crypto.map(x=>x[0]),'/stocks':chartCatalog.stocks.map(x=>x[0]),'/forex':chartCatalog.forex.map(x=>x[0]),'/commodities':chartCatalog.commodities.map(x=>x[0])};
const chartDefaults={'/markets':'BINANCE:BTCUSDT','/crypto':'BINANCE:BTCUSDT','/stocks':'NASDAQ:AAPL','/forex':'FX:EURUSD','/commodities':'TVC:GOLD'};
const chartOpen={'/markets':['BINANCE:BTCUSDT'],'/crypto':['BINANCE:BTCUSDT'],'/stocks':['NASDAQ:AAPL'],'/forex':['FX:EURUSD'],'/commodities':['TVC:GOLD']};
const chartIntervals=['5','15','60','240','D','W'];let chartInterval='60',chartStyle='1';
function setChartSymbol(symbol){const choices=chartChoices[location.pathname]||[];if(!choices.includes(symbol))return;chartDefaults[location.pathname]=symbol;chartOpen[location.pathname]=[symbol];render()}
function applyChartSelection(){const symbol=document.getElementById('chartAsset')?.value;if((chartChoices[location.pathname]||[]).includes(symbol)){chartDefaults[location.pathname]=symbol;chartOpen[location.pathname]=[symbol];render()}}
function setChartInterval(value){if(!chartIntervals.includes(value))return;chartInterval=value;render()}
function applyChartInterval(){setChartInterval(document.getElementById('chartInterval')?.value)}
function addChart(){const symbol=document.getElementById('chartAsset')?.value,open=chartOpen[location.pathname]||[];if(!(chartChoices[location.pathname]||[]).includes(symbol)||open.includes(symbol))return;if(open.length>=4){alert('You can compare up to four charts at once.');return}chartOpen[location.pathname]=open.concat(symbol);render()}
function removeChart(index){const open=chartOpen[location.pathname]||[];if(!Number.isSafeInteger(index)||index<0||index>=open.length)return;open.splice(index,1);chartOpen[location.pathname]=open;render()}
function marketChartOptions(){const allowed=new Set(chartChoices[location.pathname]||[]);return Object.entries(chartCatalog).map(([group,rows])=>{const options=rows.filter(x=>allowed.has(x[0])).map(([symbol,label])=>`<option value="${symbol}" ${symbol===chartDefaults[location.pathname]?'selected':''}>${label} · ${symbol}</option>`).join('');return options?`<optgroup label="${group[0].toUpperCase()+group.slice(1)}">${options}</optgroup>`:''}).join('')}
function mountTradingView(host,symbol){
 const container=document.createElement('div');container.className='tradingview-widget-container';container.style.height='100%';host.appendChild(container);
 const widget=document.createElement('div');widget.className='tradingview-widget-container__widget';widget.style.height='100%';container.appendChild(widget);
 const script=document.createElement('script');script.src='https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js';script.async=true;
 script.textContent=JSON.stringify({autosize:true,symbol,interval:chartInterval,timezone:'Etc/UTC',theme:'dark',style:chartStyle,locale:'en',allow_symbol_change:true,calendar:false,hide_side_toolbar:false,support_host:'https://www.tradingview.com'});
 script.onerror=()=>{if(host.isConnected)host.textContent='Chart service unavailable. Try another instrument or retry shortly.'};container.appendChild(script);
}
function chartRoute(symbol){for(const [group,rows] of Object.entries(chartCatalog)){if(rows.some(row=>row[0]===symbol))return group==='crypto'?'/crypto':'/'+group}return null}
function openChartSymbol(symbol){const route=chartRoute(symbol);if(!route)return;chartDefaults[route]=symbol;chartOpen[route]=[symbol];if(location.pathname===route)render();else go(route);setTimeout(()=>document.querySelector('.chartWorkspace')?.scrollIntoView({behavior:'smooth',block:'start'}),30)}
function instrumentBrowser(group){const rows=chartCatalog[group]||[];return `<section class="panel"><div class="memberline"><div><h2>${group==='stocks'?'Stocks':group==='crypto'?'Coins':group==='forex'?'Currency pairs':'Commodities'}</h2><p class="muted">Choose an instrument to open its chart inside VANTIX.</p></div></div><div class="instrumentGrid">${rows.map(([symbol,label])=>`<button class="instrumentPick" data-command="openChartSymbol('${symbol}')"><span><b>${esc(label)}</b><small>${esc(symbol)}</small></span><span>View chart →</span></button>`).join('')}</div></section>`}
function mountDexChart(host,chain,pair){const chains={solana:'solana',bsc:'bsc',ethereum:'ethereum',base:'base'};if(!host||!chains[chain]||!/^[A-Za-z0-9_-]{6,128}$/.test(pair)){if(host)host.innerHTML='<div class="empty">A chart is unavailable for this pair.</div>';return}host.innerHTML=`<iframe class="pairChartFrame" title="Live ${esc(chain)} pair chart" src="https://dexscreener.com/${chains[chain]}/${esc(pair)}?embed=1&theme=dark&trades=0&info=0" loading="eager" referrerpolicy="no-referrer" sandbox="allow-scripts allow-same-origin"></iframe>`}
function mountMarketChart(){
 if(!chartDefaults[location.pathname])return;const open=chartOpen[location.pathname]||[];
 const labels=new Map(Object.values(chartCatalog).flat());const section=document.createElement('section');section.className='panel chartWorkspace';
 section.innerHTML=`<div class="chartToolbar"><label>FIND AN INSTRUMENT<input class="input compactInput" id="chartSearch" placeholder="Type a name or symbol" aria-label="Filter chart instruments"><select class="input compactInput" id="chartAsset">${marketChartOptions()}</select></label><label>TIMEFRAME<select class="input compactInput" id="chartInterval" data-change-command="applyChartInterval()">${[['5','5 minutes'],['15','15 minutes'],['60','1 hour'],['240','4 hours'],['D','1 day'],['W','1 week']].map(([v,l])=>`<option value="${v}" ${v===chartInterval?'selected':''}>${l}</option>`).join('')}</select></label><button class="pill" data-command="applyChartSelection()">View chart</button><button class="btn" data-command="addChart()">+ Compare</button></div><div class="toolbar" style="margin-top:10px"><label>Chart style <select class="input compactInput" id="chartStyle" data-change-command="applyChartStyle()"><option value="1" ${chartStyle==='1'?'selected':''}>Candles</option><option value="2" ${chartStyle==='2'?'selected':''}>Line</option></select></label></div><p class="chartNote">Search inside any chart for more TradingView instruments. Compare up to four charts. Availability and delays depend on the exchange.</p>${open.length?`<div class="chartGrid">${open.map((symbol,i)=>`<article class="chartCard"><div class="chartCardHead"><span><b>${labels.get(symbol)||symbol}</b><br><small>${symbol}</small></span>${open.length>1?`<button class="pill" data-command="removeChart(${i})" aria-label="Close ${labels.get(symbol)||symbol} chart">Close</button>`:''}</div><div class="chartHost" data-chart-symbol="${symbol}"></div><div class="toolbar chartQuickActions"><button class="pill" data-command="showAssetTools('${symbol}','watchlist')">☆ Watchlist</button>${chartRoute(symbol)==='/crypto'?`<button class="pill" data-command="showAssetTools('${symbol}','alerts')">Price alert</button>`:''}<button class="pill" data-command="showAssetTools('${symbol}','news')">Related news</button></div></article>`).join('')}</div>`:'<div class="chartEmpty">Choose an instrument and add it to your workspace.</div>'}<p class="chartNote">Charts by <a href="https://www.tradingview.com/" target="_blank" rel="noopener noreferrer">TradingView</a>. Chart prices may differ from VANTIX feeds.</p>`;
 const header=page.querySelector('.pageHeader');if(header)header.after(section);else page.prepend(section);
 section.querySelectorAll('[data-chart-symbol]').forEach(host=>mountTradingView(host,host.dataset.chartSymbol));
}


function applyChartStyle(){const value=document.getElementById('chartStyle')?.value;if(!['1','2'].includes(value))return;chartStyle=value;document.querySelectorAll('.chartHost[data-chart-symbol]').forEach(host=>{host.innerHTML='';mountTradingView(host,host.dataset.chartSymbol)})}
function filterChartInstruments(){const select=document.getElementById('chartAsset');if(!select)return;const query=(document.getElementById('chartSearch')?.value||'').trim().toLowerCase();const rows=Object.values(chartCatalog).flat().filter(([symbol,label])=>(chartChoices[location.pathname]||[]).includes(symbol)&&(!query||(symbol+' '+label).toLowerCase().includes(query)));const old=select.value;select.innerHTML=rows.length?rows.map(([symbol,label])=>`<option value="${symbol}" ${symbol===old?'selected':''}>${esc(label)} · ${esc(symbol)}</option>`).join(''):'<option value="">No matching instrument</option>'}
function knownInstrument(symbol){return Object.values(chartCatalog).flat().find(row=>row[0]===symbol)}
function savedChartSymbol(symbol){if(!knownInstrument(symbol))return null;return chartRoute(symbol)==='/crypto'?symbol.split(':')[1].replace(/USDT$/,''):symbol.split(':')[1]}
function savedInstrument(symbol){const aliases={'USD/GBP':'FX:GBPUSD','USD/EUR':'FX:EURUSD','USD/JPY':'FX:USDJPY','USD/CHF':'FX:USDCHF','USD/CAD':'FX:USDCAD','USD/AUD':'FX:AUDUSD'};return aliases[symbol]||Object.values(chartCatalog).flat().find(([key])=>key===symbol||savedChartSymbol(key)===symbol)?.[0]||null}
function openSavedChart(symbol){const chart=savedInstrument(symbol);if(chart)openChartSymbol(chart)}
let activeAssetTool=null,assetToolBusy=false;
function marketToolMarkup(title,body){const dialog=document.getElementById('marketToolDialog');if(!dialog)return;dialog.innerHTML=`<div class="coinDialogHead"><h2>${esc(title)}</h2><button class="pill" data-command="closeMarketTool()">Close</button></div><div class="coinDialogBody">${body}</div>`;if(!dialog.open){if(dialog.showModal)dialog.showModal();else dialog.setAttribute('open','')}}
function closeMarketTool(){activeAssetTool=null;document.getElementById('marketToolDialog')?.close()}
function assetNews(symbol){const row=knownInstrument(symbol);if(!row)return [];const short=savedChartSymbol(symbol),terms=[row[1].toLowerCase(),short.toLowerCase()];return newsData.filter(x=>{const text=String(x.title||'').toLowerCase();return terms.some(term=>term.length>3?text.includes(term):text.split(/[^a-z0-9]+/).includes(term))}).slice(0,12)}
function showAssetTools(symbol,kind){const row=knownInstrument(symbol);if(!row||!['news','watchlist','alerts'].includes(kind))return;if(kind==='alerts'&&chartRoute(symbol)!=='/crypto')return;activeAssetTool={symbol,kind};if(kind==='news'){marketToolMarkup(row[1]+' news',`<p class="muted">Headlines matching this asset. Match does not establish the cause of a price move.</p><div id="assetNewsResults">${newsCards(assetNews(symbol))}</div><button class="pill" data-command="showGlobalMarketNews()">Global market impact</button>`);return}const savedSymbol=savedChartSymbol(symbol);marketToolMarkup((kind==='alerts'?'Price alert · ':'Watchlist · ')+row[1],`<p>${esc(savedSymbol)}</p>${kind==='alerts'?'<label>Notify at or above (USDT)<input class="input" id="quickAlertPrice" type="number" min="0" step="any" placeholder="Enter threshold"></label><p class="muted">Checks run on the server while it is awake. Alerts are saved here while you are away; checks pause if hosting sleeps. No email or push delivery.</p>':'<p class="muted">Save to your account for quick access.</p>'}<button class="btn" id="quickSaveButton" data-command="saveAssetTool()">Save ${kind==='alerts'?'alert':'to Watchlist'}</button><p id="quickSaveStatus" role="status"></p>`)}
function showGlobalMarketNews(){marketToolMarkup('Global market impact',marketImpactNews(20))}
async function saveAssetTool(){if(assetToolBusy||!activeAssetTool||!['watchlist','alerts'].includes(activeAssetTool.kind))return;const task={...activeAssetTool},el=document.getElementById('quickSaveStatus'),button=document.getElementById('quickSaveButton'),value=task.kind==='alerts'?Number(document.getElementById('quickAlertPrice')?.value):null;if(task.kind==='alerts'&&(!Number.isFinite(value)||value<=0||value>1e15)){el.textContent='Enter a positive finite threshold below 1 quadrillion.';return}assetToolBusy=true;button.disabled=true;try{await postJSON('/api/saved/add',{kind:task.kind,symbol:savedChartSymbol(task.symbol),value});if(el===document.getElementById('quickSaveStatus')){el.textContent=task.kind==='alerts'?'Alert saved. View it on your Alerts page.':'Saved to your Watchlist.';button.textContent='Saved'}}catch(error){if(el===document.getElementById('quickSaveStatus')){el.textContent=error.message;el.insertAdjacentHTML('beforeend',' <a href="/account" data-route="/account">Open account</a>');button.disabled=false}}finally{assetToolBusy=false}}

function gmgnFilterRows(rows,fresh=false){
 const query=(document.getElementById('gmgnSearch')?.value||'').trim().toLowerCase(),minLiquidity=Math.max(0,Number(document.getElementById('gmgnMinLiquidity')?.value||0)),minMarketCap=Math.max(0,Number(document.getElementById('gmgnMinMarketCap')?.value||0)),riskText=document.getElementById('gmgnMaxRisk')?.value||'',maxRisk=riskText===''?null:Math.min(1,Math.max(0,Number(riskText)/100)),sort=document.getElementById('gmgnSort')?.value||'rank';
 const filtered=rows.filter(x=>(!query||[x.symbol,x.name,x.address].some(v=>String(v||'').toLowerCase().includes(query)))&&(!minLiquidity||(typeof x.liquidity==='number'&&x.liquidity>=minLiquidity))&&(!minMarketCap||(typeof x.market_cap==='number'&&x.market_cap>=minMarketCap))&&(maxRisk==null||(typeof x.rug_ratio==='number'&&x.rug_ratio<=maxRisk)));
 return filtered.sort((a,b)=>sort==='rank'?(fresh?(b.created_at||0)-(a.created_at||0):(a.rank??9999)-(b.rank??9999)):(b[sort]??-1)-(a[sort]??-1));
}
function applyGmgnFilters(){for(const [kind,fresh] of [['trending',false],['fresh',true]]){const target=document.getElementById(kind==='trending'?'gmgnTrending':'gmgnFresh'),count=document.getElementById(kind==='trending'?'gmgnTrendingCount':'gmgnFreshCount');if(!target)continue;if(!gmgnUsable[kind]){target.innerHTML='<div class="empty">'+esc(gmgnUnavailable[kind])+'</div>';if(count)count.textContent='';continue}const rows=gmgnFilterRows(gmgnData[kind],fresh);target.innerHTML=gmgnRows(rows,fresh);if(count)count.textContent='Showing '+rows.length+' of '+gmgnData[kind].length}}
function resetGmgnFilters(){for(const id of ['gmgnSearch','gmgnMinLiquidity','gmgnMinMarketCap','gmgnMaxRisk']){const el=document.getElementById(id);if(el)el.value=''}const sort=document.getElementById('gmgnSort');if(sort)sort.value='rank';applyGmgnFilters()}
function gmgnResult(result,label,fresh=false){
 const value=result.status==='fulfilled'?result.value:null;
 if(!value||!Array.isArray(value.data))return {html:'<p>'+label+' data is temporarily unavailable.</p>',summary:label+': unavailable.',data:[],usable:false};
 const stale=value.status==='STALE',ok=value.status==='PROVIDER_QUERY';
 const summary=label+': '+(ok?'retrieved':stale?'stale cached results':String(value.status||'unavailable').toLowerCase())+(value.retrieved_at?' · Received '+value.retrieved_at:'')+'.';
 return {html:'<p class="muted">'+esc(summary)+(value.message?' '+esc(value.message):'')+'</p>'+((ok||stale)?gmgnRows(value.data,fresh):'<p>No current observations available.</p>'),summary,data:value.data,usable:ok||stale,message:value.message};
}
async function loadGmgn(){
 const status=document.getElementById('gmgnStatus'),chain=document.getElementById('gmgnChain')?.value||'sol',interval=document.getElementById('gmgnInterval')?.value||'5m';if(!status)return;
 const request=++gmgnRequest;status.textContent='Checking GMGN '+chain.toUpperCase()+' data…';
 document.getElementById('gmgnTrending').textContent='Loading selected rankings…';document.getElementById('gmgnFresh').textContent='Loading selected fresh tokens…';
 try{
  const results=await Promise.allSettled([api('/api/gmgn/trending?chain='+encodeURIComponent(chain)+'&interval='+encodeURIComponent(interval)),api('/api/gmgn/fresh?chain='+encodeURIComponent(chain))]);
  if(request!==gmgnRequest||status!==document.getElementById('gmgnStatus'))return;
  const trending=gmgnResult(results[0],'Trending'),fresh=gmgnResult(results[1],'Fresh',true);
  gmgnData={trending:trending.data,fresh:fresh.data};gmgnUsable={trending:trending.usable,fresh:fresh.usable};gmgnUnavailable={trending:trending.message||'Trending data is unavailable.',fresh:fresh.message||'Fresh coin data is unavailable.'};applyGmgnFilters();
  status.textContent=chain.toUpperCase()+' · '+interval+' trending window · '+trending.summary+' '+fresh.summary+' Rankings can change quickly; refresh to query again.';
 }catch{if(request===gmgnRequest&&status===document.getElementById('gmgnStatus'))status.textContent='GMGN data is temporarily unavailable.'}
}

function paintChat(){const el=document.getElementById('chatMessages');if(!el)return;const near=el.scrollHeight-el.scrollTop-el.clientHeight<80;el.innerHTML=chatRows.map(m=>`<div class="row"><span><b>${m.sender_id===socialUser?'You':esc(m.display_name)}</b><br><span style="white-space:pre-wrap">${esc(m.body)}</span><br><small>${esc(new Date(m.created_at).toLocaleString())}</small></span><button class="pill" data-command="${m.sender_id===socialUser?'deleteChatMessage':'reportChatMessage'}(${m.id})">${m.sender_id===socialUser?'Delete':'Report'}</button></div>`).join('')||'<p>No messages yet. Start the conversation.</p>';if(near)el.scrollTop=el.scrollHeight}
async function loadChatMessages(older=false){if(chatBusy||!chatSelection||!document.getElementById('chatMessages'))return;chatBusy=true;const epoch=chatEpoch,selection={...chatSelection};try{const params=new URLSearchParams(selection);if(older&&chatRows.length)params.set('before',chatRows[0].id);const x=await api('/api/chat/messages?'+params);if(epoch!==chatEpoch||!document.getElementById('chatMessages'))return;socialUser=x.user_id;const info=x.conversation;document.getElementById('chatTitle').textContent=info.name;document.getElementById('chatControls').innerHTML=selection.peer_id?`<p class="muted">Private between these two accounts. Reported messages can be reviewed by the site owner.</p><button class="pill" data-command="blockChatMember(${selection.peer_id},${!info.blocked_by_you})">${info.blocked_by_you?'Unblock member':'Block member'}</button>`:'<p class="muted">Group history is visible to all members who join.</p>';document.getElementById('chatSend').disabled=!!info.blocked;document.getElementById('chatBody').disabled=!!info.blocked;
const before=JSON.stringify(chatRows);if(older){chatRows=[...x.data,...chatRows];document.getElementById('olderChat').hidden=!x.has_more}else{const start=x.data[0]?.id;chatRows=[...chatRows.filter(m=>start&&m.id<start),...x.data];if(before==='[]')document.getElementById('olderChat').hidden=!x.has_more}chatRows=Array.from(new Map(chatRows.map(m=>[m.id,m])).values()).sort((a,b)=>a.id-b.id);if(before!==JSON.stringify(chatRows))paintChat();document.getElementById('chatStatus').textContent=info.blocked?'Messaging blocked.':'Connected · updates every 5 seconds';if(!older&&x.data.length&&document.hasFocus()&&!document.hidden)await postJSON('/api/chat/read',{...selection,through:x.data.at(-1).id})
}catch(e){if(epoch===chatEpoch){const status=document.getElementById('chatStatus');if(status)status.textContent=e.message}}finally{chatBusy=false}}
function loadOlderChat(){loadChatMessages(true)}
async function sendChatMessage(){const input=document.getElementById('chatBody');if(chatSending||!chatSelection||!input)return;const body=input.value.trim();if(!body||body.length>2000)return;const epoch=chatEpoch,selection={...chatSelection};if(!chatNonce||chatNonce.body!==body||chatNonce.epoch!==epoch)chatNonce={body,epoch,id:crypto.randomUUID()};chatSending=true;document.getElementById('chatSend').disabled=true;try{await postJSON('/api/chat/send',{...selection,body,client_id:chatNonce.id});if(epoch!==chatEpoch)return;input.value='';chatNonce=null;await loadChatMessages();loadChatInbox()}catch(e){if(epoch===chatEpoch)document.getElementById('chatStatus').textContent=e.message}finally{chatSending=false;if(epoch===chatEpoch&&document.getElementById('chatSend'))document.getElementById('chatSend').disabled=false}}
async function blockChatMember(peer_id,active){try{await postJSON('/api/chat/block',{peer_id,active});loadChatMessages()}catch(e){socialError(e)}}
async function deleteChatMessage(message_id){try{await postJSON('/api/chat/delete',{message_id});chatRows=chatRows.filter(m=>m.id!==message_id);paintChat()}catch(e){socialError(e)}}
async function reportChatMessage(message_id){const reason=prompt('Reason for reporting (5–500 characters). The reported message will be shared with the site owner.');if(!reason)return;try{await postJSON('/api/chat/report',{message_id,reason});document.getElementById('chatStatus').textContent='Report sent for review.'}catch(e){socialError(e)}}

let feedSnapshot=null,pendingFeed=null,feedBusy=false,feedSort='latest',feedRoom='all',feedData=[];
function paintFeed(x){const el=document.getElementById('communityFeed');if(!el)return;
feedData=x.data;
const drafts=Array.from(el.querySelectorAll('input')).map(i=>[i.id,i.value]);
const active=document.activeElement;const focusId=active?.id;const start=active?.selectionStart;const end=active?.selectionEnd;
const visible=x.data.filter(p=>feedRoom==='all'||p.label===feedRoom);el.innerHTML=visible.length?visible.map(p=>`<article class="panel" style="margin:10px 0"><div class="memberline"><button class="pill" data-command="visitMember(${p.author_id})">${esc(p.display_name)}</button><span class="badge">${esc(p.label)}</span><span class="muted">${new Date(p.created_at).toLocaleString()}</span>${p.can_follow?`<button class="pill ${p.following?'active':''}" data-command="followMember(${p.author_id},${!p.following})">${p.following?'Following':'Follow'}</button>`:''}</div><div style="margin:11px 0;line-height:1.6">${esc(p.body)}</div>${p.source_url?`<a href="${esc(safeLink(p.source_url))}" target="_blank" rel="noopener">${esc(p.source_label||'Open source')}</a>`:''}<div class="toolbar"><button class="pill" data-command="reactPost(${p.id},${!p.reacted})">${p.reacted?'Liked':'Like'} · ${Number(p.reactions)||0}</button><span class="pill">Replies · ${Number(p.comments)||0}</span><button class="pill" data-command="reportContent('post',${p.id})">Report</button></div><div class="rows" style="margin-top:10px">${p.comments_list.map(c=>`<div class="row"><span><b>${esc(c.display_name)}</b> · ${esc(c.body)} <button class="pill" data-command="reportContent('comment',${c.id})">Report</button></span><small>${new Date(c.created_at).toLocaleString()}</small></div>`).join('')}</div><div class="searchbar" style="margin-top:8px"><input class="input" id="comment-${p.id}" placeholder="Reply in this room"><button class="pill" data-command="commentPost(${p.id})">Reply</button></div></article>`).join(''):'<div class="empty">No messages in this room yet. Start the conversation above.</div>';
for(const[id,value]of drafts){const field=document.getElementById(id);if(field)field.value=value}
const focused=document.getElementById(focusId);if(focused){focused.focus();if(start!=null)focused.setSelectionRange(start,end)}
feedSnapshot=JSON.stringify(x.data);pendingFeed=null;
const button=document.getElementById('showFeedUpdates');if(button)button.style.display='none';
}
function applyFeedUpdates(){if(pendingFeed)paintFeed(pendingFeed)}
async function loadFeed(background=false){
if(feedBusy||!document.getElementById('communityFeed')||document.getElementById('publicCommunity')?.hidden)return;feedBusy=true;
const target=document.getElementById('communityFeed');
try{const response=await fetch('/api/feed?sort='+encodeURIComponent(feedSort),{cache:'no-store'});if(!response.ok)throw Error('Feed unavailable');const x=await response.json();if(!Array.isArray(x.data))throw Error('Invalid feed');if(target!==document.getElementById('communityFeed'))return;
if(JSON.stringify(x.data)!==feedSnapshot){if(background&&feedSnapshot!==null){pendingFeed=x;document.getElementById('showFeedUpdates').style.display='inline-block'}else paintFeed(x)}
document.getElementById('feedUpdateStatus').textContent='Live · checked '+new Date().toLocaleTimeString();
}catch(error){if(target===document.getElementById('communityFeed')){document.getElementById('feedUpdateStatus').textContent='Connection unavailable. Retrying…';if(feedSnapshot===null)target.innerHTML='<div class="empty">Messages could not be loaded.</div>'}}
finally{feedBusy=false}
}
setInterval(()=>{if(!document.hidden)loadFeed(true)},3000);

function setFeedSort(value){feedSort=value;feedSnapshot=null;for(const mode of ['latest','trending','following'])document.getElementById('feed-'+mode)?.classList.toggle('active',mode===value);loadFeed()}
function setFeedRoom(value){const allowed=['all','Global Markets','Crypto','Stocks','Macro & Politics','Weather & Commodities'];if(!allowed.includes(value))return;feedRoom=value;for(const room of allowed){const id='room-'+room.replaceAll(' ','-').replace('&','and');document.getElementById(id)?.classList.toggle('active',room===value)}paintFeed({data:feedData})}
async function followMember(user_id,active){try{await postJSON('/api/community/follow',{user_id,active});feedSnapshot=null;await Promise.all([loadFeed(),loadCommunity()])}catch(e){alert(e.message)}}
async function loadCommunity(){const el=document.getElementById('leaderboard');if(!el)return;try{const x=await api('/api/community');if(el!==document.getElementById('leaderboard'))return;el.innerHTML=x.data.length?x.data.slice(0,10).map(m=>`<div class="leader"><span class="rank">#${Number(m.rank)||'—'}</span><span><b>${esc(m.display_name)}</b><br><small>${esc(m.badge)} · ${Number(m.followers)} followers</small></span><span><b>${Number(m.points)}</b><br><small>points</small></span></div>`).join(''):'<div class="empty">No ranked members yet.</div>'}catch(e){if(el===document.getElementById('leaderboard'))el.textContent=e.message}}

const commentBusy=new Set();
async function commentPost(id){if(commentBusy.has(id))return;const input=document.getElementById('comment-'+id);if(!input.value.trim()||input.value.length>500){alert('Use 1–500 characters.');return}commentBusy.add(id);try{await api('/api/feed/comment',{method:'POST',headers:{'Content-Type':'application/json',...authHeaders()},body:JSON.stringify({post_id:id,body:input.value})});if(input===document.getElementById('comment-'+id)){input.value='';await loadFeed()}}catch(error){alert(error.message)}finally{commentBusy.delete(id)}}

function renderShield(){const asset=storageGet('vantix_shield_asset');storageRemove('vantix_shield_asset');layout('VANTIX Shield','Check provider-reported contract signals on Ethereum or BNB Chain.',`<div class="panel">${asset?`<div class="notice">Investigating ${esc(asset)} from Market Radar. Paste its token contract address to continue.</div>`:''}<div class="searchbar"><label>Chain <select class="input" id="securityChain"><option value="56">BNB Chain</option><option value="1">Ethereum</option></select></label><input class="input" id="token" placeholder="Paste token contract address"><button class="btn" data-command="checkShield()">Check contract</button></div><div id="shieldResult" style="margin-top:15px"><div class="empty">Enter a contract address to review available risk signals.</div></div></div>`)}
async function checkShield(){const t=document.getElementById('token').value.trim();if(!t)return;const el=document.getElementById('shieldResult');el.textContent='Checking contract…';try{const j=await api('/api/shield?chain='+document.getElementById('securityChain').value+'&token='+encodeURIComponent(t));if(el!==document.getElementById('shieldResult'))return;const rows=j.data||[],risks=rows.filter(r=>(r.field==='is_open_source'&&r.value==='No')||(r.field!=='is_open_source'&&r.value==='Yes')),level=!rows.length?'UNKNOWN':risks.some(r=>r.field==='is_honeypot')?'HIGH RISK':risks.length?'REVIEW':'NO FLAGS REPORTED',tone=level==='HIGH RISK'?'block':level==='REVIEW'||level==='UNKNOWN'?'warn':'';el.innerHTML=`<div class="panel"><div class="memberline"><span class="badge ${tone}">${level}</span><b>${risks.length} flagged signal${risks.length===1?'':'s'}</b><span class="muted">Checked ${esc(j.retrieved_at||'just now')}</span></div><div class="riskGrid">${rows.map(r=>{const risky=(r.field==='is_open_source'&&r.value==='No')||(r.field!=='is_open_source'&&r.value==='Yes');return `<div class="riskItem ${risky?'yes':r.value==='No'?'no':''}"><small>${esc(r.title)}</small><b>${esc(r.value)}</b></div>`}).join('')}</div>${rows[0]?.link?`<a href="${esc(safeLink(rows[0].link))}" target="_blank" rel="noopener">Open provider report ↗</a>`:''}<p class="muted">Provider signals are evidence, not a guarantee. Unknown fields remain unknown.</p><button class="pill" data-command="askShieldContract('${esc(t)}')">Ask VANTIX about this contract</button></div>`}catch{if(el===document.getElementById('shieldResult'))el.innerHTML='<div class="empty">Risk provider unavailable. No result has been inferred.</div>'}}
function askShieldContract(token){if(!/^[A-Za-z0-9]{20,128}$/.test(token))return;go('/ask');setTimeout(()=>{const q=document.getElementById('q');if(q){q.value='Explain the available risk evidence for token contract '+token;q.focus()}},30)}

function radarMetrics(){const rows=marketData.filter(x=>STREAM_SYMBOLS.includes(x.symbol)&&Number.isFinite(x.change)&&Number.isFinite(x.volume));if(!rows.length)return[];const changes=[...rows].sort((a,b)=>Math.abs(a.change)-Math.abs(b.change)),volumes=[...rows].sort((a,b)=>a.volume-b.volume),median=volumes[Math.floor(volumes.length/2)]?.volume||0,n=Math.max(1,rows.length-1);return rows.map(x=>{const changeRank=changes.indexOf(x)/n,volumeRank=volumes.indexOf(x)/n;return {...x,score:Math.round((changeRank*.65+volumeRank*.35)*100),relativeVolume:median>0?x.volume/median:null}})}
function radarRow(x,open=false){return `<details class="radarRow" data-radar-symbol="${esc(x.symbol)}" ${open?'open':''}><summary><span><b>${esc(x.symbol)}</b><br><small>${esc(x.source)} · ${esc(marketStatus(x.status))}</small></span><span><small>Unusualness</small><br><span class="score">${x.score}</span></span><span><small>24h move</small><br><b class="${x.change>=0?'up':'down'}">${pct(x.change)}</b></span><span><small>Relative volume</small><br><b>${x.relativeVolume==null?'—':x.relativeVolume.toFixed(1)+'×'}</b></span><span class="radarExpand">View details <b>+</b></span></summary><div class="radarDetail"><p>Price ${money(x.price)} ${esc(x.quote||'')} · Volume ${Number(x.volume).toLocaleString()} ${esc(x.quote||'')} · Observed ${esc(x.updated||'Time unavailable')}</p><p class="muted">Score ranks current price movement and volume against the other tracked assets. Relative volume compares with the tracked median, not the asset’s history.</p><div class="toolbar"><button class="btn" data-command="assetAction('${x.symbol}')">Open live chart</button><button class="pill" data-command="openRadarShield('${x.symbol}')">Check contract in Shield</button><button class="pill" data-command="saveRadarAsset('${x.symbol}')">Add to Watchlist</button></div></div></details>`}
function applyRadarFilters(){const target=document.getElementById('radarResults');if(!target)return;const opened=new Set([...target.querySelectorAll('details[open][data-radar-symbol]')].map(x=>x.dataset.radarSymbol)),query=(document.getElementById('radarSearch')?.value||'').trim().toUpperCase(),min=Number(document.getElementById('radarMin')?.value||0),sort=document.getElementById('radarSort')?.value||'score';const rows=radarMetrics().filter(x=>(!query||x.symbol.includes(query))&&x.score>=min).sort((a,b)=>sort==='change'?Math.abs(b.change)-Math.abs(a.change):sort==='volume'?(b.relativeVolume||0)-(a.relativeVolume||0):b.score-a.score);target.innerHTML=rows.length?rows.map(x=>radarRow(x,opened.has(x.symbol))).join(''):'<div class="empty">No tracked assets match these filters.</div>';const count=document.getElementById('radarCount');if(count)count.textContent=rows.length+' assets'}
function renderRadarWorkspace(){page.innerHTML+=`<section class="panel"><div class="memberline"><div><h2>Unusual market activity</h2><p class="muted">Comparative signals across currently tracked crypto assets.</p></div><span id="radarCount" class="badge" style="margin-left:auto"></span></div><div class="radarFilters"><label>SEARCH<input class="input compactInput" id="radarSearch" data-radar-filter placeholder="BTC, SOL, LINK…"></label><label>MINIMUM SCORE<select class="input compactInput" id="radarMin" data-radar-filter><option value="0">All scores</option><option value="50">50+</option><option value="70">70+</option></select></label><label>SORT BY<select class="input compactInput" id="radarSort" data-radar-filter><option value="score">Unusualness</option><option value="change">Price move</option><option value="volume">Relative volume</option></select></label></div><div class="radarRows" id="radarResults"></div><p id="radarSaveStatus" class="muted" role="status"></p></section>`;applyRadarFilters()}

// Public read-only ticker stream. LIVE requires fresh provider events, not just an open socket.
const STREAM_SYMBOLS=['BTC','ETH','BNB','SOL','DOGE','XRP','ADA','AVAX','LINK','DOT','LTC','TRX'];
let bybitStatus='Connecting';
let bybitSocket=null,bybitRetry=null,bybitFailures=0,bybitOpenedAt=0,lastBybitEvent=0;
const COINBASE_SYMBOLS=STREAM_SYMBOLS.filter(s=>s!=='BNB');
let coinbaseStatus='Connecting',coinbaseSocket=null,coinbaseRetry=null,coinbaseFailures=0,coinbaseOpenedAt=0,lastCoinbaseEvent=0;
let cryptoSocket=null,streamRetry=null,streamFailures=0,streamOpenedAt=0,lastStreamEvent=0;
const liveQuotes=new Map();
function providerSocket(provider){return provider==='bybit'?bybitSocket:provider==='coinbase'?coinbaseSocket:cryptoSocket}
function freshLive(row,now=Date.now()){return row&&row.status==='LIVE'&&providerSocket(row.provider)?.readyState===1&&now-row.receivedAt<15000&&now-row.eventAt<15000&&now>=row.eventAt-5000}
function preferredLive(symbol){return [liveQuotes.get('binance/'+symbol),liveQuotes.get('bybit/'+symbol)].find(r=>freshLive(r))}
function mergeLiveQuotes(rows){const merged=rows.map(r=>preferredLive(r.symbol)||r);for(const symbol of STREAM_SYMBOLS){const r=preferredLive(symbol);if(r&&!merged.some(x=>x.symbol===symbol))merged.push(r)}return merged}
function acceptTicker(raw,now=Date.now(),provider='binance'){
 if(!['binance','bybit'].includes(provider))return false;
 if(!raw||raw.e!=='24hrTicker'||typeof raw.s!=='string'||!raw.s.endsWith('USDT'))return false;
 const symbol=raw.s.slice(0,-4),price=Number(raw.c),change=Number(raw.P),volume=Number(raw.q),eventAt=Number(raw.E),closeAt=Number(raw.C);
 if(!STREAM_SYMBOLS.includes(symbol)||[raw.c,raw.P,raw.q,raw.E,raw.C].some(v=>v==null||v==='')||![price,change,volume,eventAt,closeAt].every(Number.isFinite)||price<=0||volume<0||now-eventAt>15000||eventAt-now>5000||closeAt>eventAt+5000||eventAt-closeAt>15000)return false;
 const previous=liveQuotes.get(provider+'/'+symbol);if(previous&&eventAt<=previous.eventAt)return false;
 const row={symbol,price,change,volume,quote:'USDT',provider,source:provider==='bybit'?'Bybit stream':'Binance stream',source_url:provider==='bybit'?'https://www.bybit.com/en/trade/spot/'+symbol+'/USDT':'https://www.binance.com/en/trade/'+symbol+'_USDT',status:'LIVE',updated:new Date(closeAt).toISOString(),eventAt,receivedAt:now};
 liveQuotes.set(provider+'/'+symbol,row);if(provider==='bybit'){lastBybitEvent=now;bybitFailures=0}else{lastStreamEvent=now;streamFailures=0}marketData=mergeLiveQuotes(marketData);return true;
}
function updateCryptoStatus(){const count=STREAM_SYMBOLS.filter(s=>preferredLive(s)).length;const el=document.getElementById('dataStatus');if(el)el.textContent=count===STREAM_SYMBOLS.length?'CRYPTO LIVE · FX REFERENCE':count?'CRYPTO LIVE '+count+'/'+STREAM_SYMBOLS.length+' · FX REFERENCE':marketData.length?'LATEST DATA · CONNECTING LIVE':'CONNECTING TO LIVE MARKETS'}
function expireLiveQuotes(){const now=Date.now();marketData=mergeLiveQuotes(marketData).map(r=>r.status==='LIVE'&&!freshLive(r,now)?{...r,status:'STALE'}:r);updateCryptoStatus()}
function paintLiveQuotes(){expireLiveQuotes();paintExchangeComparison();const path=location.pathname;
 // Update only price panels; inputs, drafts and focus are preserved.
 document.querySelectorAll('[data-market-filter]').forEach(el=>{const mode=el.dataset.marketFilter;el.innerHTML=marketRowsContent(mode==='crypto'?x=>!x.symbol.includes('/'):mode==='fx'?x=>x.symbol.includes('/'):()=>true)});
 if(path==='/radar')applyRadarFilters();
}
function scheduleStream(){if(streamRetry||document.hidden)return;const delay=Math.min(30000,1000*2**Math.min(streamFailures++,5));streamRetry=setTimeout(()=>{streamRetry=null;connectCryptoStream()},delay)}
function disconnectCrypto(){const ws=cryptoSocket;cryptoSocket=null;if(ws){ws.onclose=null;ws.close()}expireLiveQuotes();paintLiveQuotes()}
function connectCryptoStream(){if(typeof WebSocket==='undefined'||document.hidden||cryptoSocket)return;
 const streams=STREAM_SYMBOLS.map(s=>s.toLowerCase()+'usdt@ticker').join('/');
 try{const ws=new WebSocket('wss://data-stream.binance.vision/stream?streams='+streams);cryptoSocket=ws;streamOpenedAt=Date.now();lastStreamEvent=0;
 ws.onmessage=e=>{if(ws!==cryptoSocket)return;try{const value=JSON.parse(e.data);acceptTicker(value.data||value)}catch{}};
 ws.onerror=()=>{if(ws===cryptoSocket)ws.close()};
 ws.onclose=()=>{if(ws!==cryptoSocket)return;cryptoSocket=null;paintLiveQuotes();scheduleStream();loadData()};
 }catch{cryptoSocket=null;scheduleStream()}}
setInterval(()=>{if(document.hidden)return;paintLiveQuotes();if(cryptoSocket&&Date.now()-(lastStreamEvent||streamOpenedAt)>20000){disconnectCrypto();scheduleStream();loadData()}},1000);
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(streamRetry){clearTimeout(streamRetry);streamRetry=null}disconnectCrypto()}else{connectCryptoStream();loadData()}});
setTimeout(connectCryptoStream,0);
function exchangeEmpty(provider,symbol){if(provider==='bybit')return bybitStatus;if(provider==='coinbase')return COINBASE_SYMBOLS.includes(symbol)?coinbaseStatus:'Pair unavailable';return 'No streaming quote'}
function paintExchangeComparison(){const el=document.getElementById('exchangeComparison');if(!el)return;el.innerHTML='<table class="table"><tr><th>Asset</th><th>Binance · USDT</th><th>Bybit · USDT</th><th>Coinbase · USD</th></tr>'+STREAM_SYMBOLS.map(symbol=>'<tr><td>'+symbol+'</td>'+['binance','bybit','coinbase'].map(provider=>{const r=liveQuotes.get(provider+'/'+symbol);return '<td>'+(r?money(r.price)+'<br><small>'+(freshLive(r)?'LIVE':'STALE')+' · '+esc(r.updated)+'</small>':esc(exchangeEmpty(provider,symbol)))+'</td>'}).join('')+'</tr>').join('')+'</table>'}
function acceptBybitMessage(value,now=Date.now()){if(value?.type!=='snapshot'||typeof value.topic!=='string')return false;const row=value.data;if(!row||value.topic!=='tickers.'+row.symbol||row.price24hPcnt==null||row.price24hPcnt==='')return false;return acceptTicker({e:'24hrTicker',s:row.symbol,c:row.lastPrice,P:Number(row.price24hPcnt)*100,q:row.turnover24h,E:value.ts,C:value.ts},now,'bybit')}
function scheduleBybit(){if(bybitRetry||document.hidden)return;const delay=Math.min(30000,1000*2**Math.min(bybitFailures++,5));bybitRetry=setTimeout(()=>{bybitRetry=null;connectBybit()},delay)}
function disconnectBybit(){const ws=bybitSocket;bybitSocket=null;if(ws){ws.onclose=null;ws.close()}paintLiveQuotes()}
function connectBybit(){if(typeof WebSocket==='undefined'||document.hidden||bybitSocket)return;try{const ws=new WebSocket('wss://stream.bybit.com/v5/public/spot');bybitSocket=ws;bybitStatus='Connecting';bybitOpenedAt=Date.now();lastBybitEvent=0;ws.onopen=()=>{if(ws===bybitSocket){bybitStatus='Awaiting ticker';paintExchangeComparison();ws.send(JSON.stringify({op:'subscribe',args:STREAM_SYMBOLS.map(s=>'tickers.'+s+'USDT')}))}};ws.onmessage=e=>{if(ws!==bybitSocket)return;try{const value=JSON.parse(e.data);if(value.op==='subscribe'&&value.success===false)bybitStatus='Subscription rejected';else if(acceptBybitMessage(value)){bybitStatus='Connected';paintExchangeComparison()}}catch{}};ws.onerror=()=>{if(ws===bybitSocket)ws.close()};ws.onclose=()=>{if(ws!==bybitSocket)return;bybitSocket=null;bybitStatus='Unavailable · reconnecting';paintLiveQuotes();scheduleBybit();loadData()}}catch{bybitSocket=null;bybitStatus='Unavailable · reconnecting';scheduleBybit()}}
setInterval(()=>{if(bybitSocket?.readyState===1){try{bybitSocket.send(JSON.stringify({op:'ping'}))}catch{bybitSocket.close()}}if(!document.hidden&&bybitSocket&&Date.now()-(lastBybitEvent||bybitOpenedAt)>30000){disconnectBybit();scheduleBybit();loadData()}},20000);
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(bybitRetry){clearTimeout(bybitRetry);bybitRetry=null}disconnectBybit()}else connectBybit()});
setTimeout(connectBybit,0);
function acceptCoinbaseMessage(value,now=Date.now()){
 if(value?.type!=='ticker'||typeof value.product_id!=='string'||!value.product_id.endsWith('-USD'))return false;
 const symbol=value.product_id.slice(0,-4),price=Number(value.price),open=Number(value.open_24h),baseVolume=Number(value.volume_24h),eventAt=Date.parse(value.time);
 if(!COINBASE_SYMBOLS.includes(symbol)||[value.price,value.open_24h,value.volume_24h,value.time].some(v=>v==null||v==='')||![price,open,baseVolume,eventAt].every(Number.isFinite)||price<=0||open<=0||baseVolume<0||now-eventAt>15000||eventAt-now>5000)return false;
 const previous=liveQuotes.get('coinbase/'+symbol);if(previous&&eventAt<=previous.eventAt)return false;
 liveQuotes.set('coinbase/'+symbol,{symbol,price,change:(price/open-1)*100,volume:baseVolume*price,quote:'USD',provider:'coinbase',source:'Coinbase Exchange stream',source_url:'https://exchange.coinbase.com/trade/'+symbol+'-USD',status:'LIVE',updated:new Date(eventAt).toISOString(),eventAt,receivedAt:now});
 lastCoinbaseEvent=now;coinbaseFailures=0;coinbaseStatus='Connected';return true;
}
function scheduleCoinbase(){if(coinbaseRetry||document.hidden)return;const delay=Math.min(30000,1000*2**Math.min(coinbaseFailures++,5));coinbaseRetry=setTimeout(()=>{coinbaseRetry=null;connectCoinbase()},delay)}
function disconnectCoinbase(){const ws=coinbaseSocket;coinbaseSocket=null;if(ws){ws.onclose=null;ws.close()}paintLiveQuotes()}
function connectCoinbase(){if(typeof WebSocket==='undefined'||document.hidden||coinbaseSocket)return;try{
 const ws=new WebSocket('wss://ws-feed.exchange.coinbase.com');coinbaseSocket=ws;coinbaseStatus='Connecting';coinbaseOpenedAt=Date.now();lastCoinbaseEvent=0;
 ws.onopen=()=>{if(ws===coinbaseSocket){coinbaseStatus='Awaiting ticker';paintExchangeComparison();ws.send(JSON.stringify({type:'subscribe',product_ids:COINBASE_SYMBOLS.map(s=>s+'-USD'),channels:['ticker']}))}};
 ws.onmessage=e=>{if(ws!==coinbaseSocket)return;try{const value=JSON.parse(e.data);if(value.type==='error'){coinbaseStatus='Subscription rejected';paintExchangeComparison()}else if(acceptCoinbaseMessage(value))paintExchangeComparison()}catch{}};
 ws.onerror=()=>{if(ws===coinbaseSocket)ws.close()};ws.onclose=()=>{if(ws!==coinbaseSocket)return;coinbaseSocket=null;coinbaseStatus='Unavailable · reconnecting';paintLiveQuotes();scheduleCoinbase()};
 }catch{coinbaseSocket=null;coinbaseStatus='Unavailable · reconnecting';scheduleCoinbase()}}
setInterval(()=>{if(!document.hidden&&coinbaseSocket&&Date.now()-(lastCoinbaseEvent||coinbaseOpenedAt)>30000){disconnectCoinbase();coinbaseStatus='Unavailable · reconnecting';scheduleCoinbase()}},10000);
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(coinbaseRetry){clearTimeout(coinbaseRetry);coinbaseRetry=null}disconnectCoinbase()}else connectCoinbase()});
setTimeout(connectCoinbase,0);

function dispatchCommand(command){
 const match=/^([A-Za-z]+)\((.*)\)$/.exec(command||'');if(!match)return;
 const actions={visitMember,showCommunity,loadChatGroups,createChatGroup,joinChatGroup,loadChatInbox,loadChatPeople,followChatMember,openMemberProfile,saveSocialProfile,openConversation,loadOlderChat,sendChatMessage,blockChatMember,deleteChatMessage,reportChatMessage,markAlertsRead,applyChartStyle,showAssetTools,showGlobalMarketNews,saveAssetTool,closeMarketTool,openNewsPreview,openSavedChart,addAlert,addChart,addHolding,addSaved,addWatch,analyticsOff,analyticsOn,applyChartInterval,applyChartSelection,applyFeedUpdates,applyGmgnFilters,assetAction,askShieldContract,askTrendingCoin,checkShield,closeCoinDetail,closeGlobalSearch,closePairChart,commentPost,createPost,downloadNextAccounts,filterNews,followMember,go,loadCommunity,loadFlows,loadGmgn,loadIndicators,loadAuth,loadData,loadFilings,loadOperations,loadTokenPairs,loginUser,logoutUser,moderate,moderateUserAction,openChartSymbol,openRadarShield,openSearchAsset,openSearchPage,reactPost,registerUser,removeAlert,removeChart,removeHolding,removeSaved,removeWatchAt,reportContent,requestEmail,resetGmgnFilters,resetPassword,saveProfile,saveRadarAsset,searchSources,sendAI,setChartInterval,setChartSymbol,setFeedRoom,setFeedSort,showPairChart};if(!Object.prototype.hasOwnProperty.call(actions,match[1]))return;
 const raw=match[2].trim();let args=[];
 if(raw){const parts=raw.split(',').map(x=>x.trim());for(const part of parts){
  if(/^'[^'\\]*'$/.test(part)||/^"[^"\\]*"$/.test(part))args.push(part.slice(1,-1));
  else if(/^-?\d+$/.test(part)&&Number.isSafeInteger(Number(part)))args.push(Number(part));
  else if(part==='true'||part==='false')args.push(part==='true');else return;
 }}
 return actions[match[1]](...args);
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-command]');if(el)dispatchCommand(el.dataset.command)});
document.addEventListener('change',e=>{if(e.target.dataset.changeCommand)dispatchCommand(e.target.dataset.changeCommand);else if(e.target.matches('[data-gmgn-filter]'))applyGmgnFilters()});
document.addEventListener('input',e=>{if(e.target.id==='chartSearch')filterChartInstruments();else if(e.target.id==='newsSearch')filterNews(newsTopic);else if(e.target.id==='globalSearchInput')runGlobalSearch();else if(e.target.matches('[data-gmgn-filter]'))applyGmgnFilters();else if(e.target.matches('[data-radar-filter]'))applyRadarFilters()});
document.addEventListener('change',e=>{if(e.target.matches('[data-radar-filter]'))applyRadarFilters()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.getElementById('globalSearchResults').hidden){closeGlobalSearch();return}if(e.key==='Enter'&&e.target.id==='q'){e.preventDefault();sendAI();return}if(e.key==='Enter'&&e.target.dataset.keyRoute)go(e.target.dataset.keyRoute)});

document.addEventListener('click',e=>{const coin=e.target.closest('[data-coin-kind]');if(coin&&!e.target.closest('a,button')){showCoinDetail(coin.dataset.coinKind,Number(coin.dataset.coinIndex));return}const asset=e.target.closest('[data-asset]');if(asset){assetAction(asset.dataset.asset);return}let a=e.target.closest('a[data-route]');if(a){e.preventDefault();go(a.dataset.route)}});document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-coin-kind]')){e.preventDefault();showCoinDetail(e.target.dataset.coinKind,Number(e.target.dataset.coinIndex));return}if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-asset]')){e.preventDefault();assetAction(e.target.dataset.asset)}});window.onpopstate=render;render();
if(typeof navigator!=='undefined'&&'serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('/sw.js').catch(()=>{});
