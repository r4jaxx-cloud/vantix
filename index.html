const chartCatalog={

function removeChart(index){const open=chartOpen[location.pathname]||[];if(!Number.isSafeInteger(index)||index<0||index>=open.length)return;open.splice(index,1);chartOpen[location.pathname]=open;render()}

function mountTradingView(host,symbol){
 const container=document.createElement('div');container.className='tradingview-widget-container';container.style.height='100%';host.appendChild(container);

 const script=document.createElement('script');script.src='https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js';script.async=true;

function mountMarketChart(){
 if(!chartDefaults[location.pathname])return;const open=chartOpen[location.pathname]||[];
 const labels=new Map(Object.values(chartCatalog).flat());const section=document.createElement('section');section.className='panel chartWorkspace';
 section.innerHTML=`<div class="chartToolbar"><label>FIND AN INSTRUMENT<select class="input compactInput" id="chartAsset">${marketChartOptions()}</select></label><label>TIMEFRAME<select class="input compactInput" id="chartInterval" data-change-command="applyChartInterval()">${[['5','5 minutes'],['15','15 minutes'],['60','1 hour'],['240','4 hours'],['D','1 day'],['W','1 week']].map(([v,l])=>`<option value="${v}" ${v===chartInterval?'selected':''}>${l}</option>`).join('')}</select></label><button class="pill" data-command="applyChartSelection()">View chart</button><button class="btn" data-command="addChart()">+ Compare</button></div><p class="chartNote">Search inside any chart for more TradingView instruments. Compare up to four charts. Availability and delays depend on the exchange.</p>${open.length?`<div class="chartGrid">${open.map((symbol,i)=>`<article class="chartCard"><div class="chartCardHead"><span><b>${labels.get(symbol)||symbol}</b><br><small>${symbol}</small></span>${open.length>1?`<button class="pill" data-command="removeChart(${i})" aria-label="Close ${labels.get(symbol)||symbol} chart">Close</button>`:''}</div><div class="chartHost" data-chart-symbol="${symbol}"></div></article>`).join('')}</div>`:'<div class="chartEmpty">Choose an instrument and add it to your workspace.</div>'}<p class="chartNote">Charts by <a href="https://www.tradingview.com/" target="_blank" rel="noopener noreferrer">TradingView</a>. Chart prices may differ from VANTIX feeds.</p>`;

const navGroups=[['Overview',[['/','⌂','Home'],['/ask','⌕','Ask VANTIX']]],['Markets',[['/markets','↗','Markets'],['/crypto','₿','Crypto'],['/trending','↑','Trending Coins'],['/stocks','▥','Stocks'],['/forex','○','Forex'],['/commodities','◆','Commodities'],['/economy','◎','Economy']]],['Intelligence',[['/news','▤','News'],['/feed','◌','VANTIX Feed'],['/radar','↟','Market Radar'],['/shield','◇','VANTIX Shield'],['/research','⌕','Research'],['/sectors','▦','Sector Analysis']]],['Your workspace',[['/watchlist','☆','Watchlist'],['/alerts','♢','Alerts'],['/portfolio','▣','Portfolio Tracker'],['/account','○','Account'],['/admin','⚙','Owner']]]];
const routes=navGroups.flatMap(group=>group[1]);const nav=document.getElementById('nav');nav.innerHTML=navGroups.map(group=>`<div class="navGroup"><div class="section">${group[0]}</div>${group[1].map(r=>`<a href="${r[0]}" data-route="${r[0]}"><i>${r[1]}</i>${r[2]}</a>`).join('')}</div>`).join('');
let marketData=[],newsData=[];const page=document.getElementById('page');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money=x=>typeof x!=='number'||!Number.isFinite(x)?'—':x.toLocaleString(undefined,{maximumFractionDigits:x>=1000?2:4});
const tokenPrice=x=>typeof x!=='number'||!Number.isFinite(x)?'—':x!==0&&Math.abs(x)<0.0001?x.toExponential(4):x.toLocaleString(undefined,{maximumSignificantDigits:8});
const ratioPct=x=>typeof x!=='number'||!Number.isFinite(x)||x<0||x>1?'Unknown':(x*100).toFixed(2)+'%';
const pct=x=>typeof x!=='number'||!Number.isFinite(x)?'—':(x>=0?'+':'')+x.toFixed(2)+'%';
function storageGet(key){try{return localStorage.getItem(key)}catch{return null}}
function storageSet(key,value){try{localStorage.setItem(key,value);return true}catch{alert('This browser cannot save data. Enable site storage to keep your changes.');return false}}
function storageRemove(key){try{localStorage.removeItem(key)}catch{}}
function saved(key){try{const rows=JSON.parse(storageGet(key)||'[]');if(!Array.isArray(rows))return [];return rows.filter(x=>key==='vantix_watch'?typeof x==='string'&&/^[A-Z0-9/._-]{1,24}$/.test(x):x&&typeof x.symbol==='string'&&/^[A-Z0-9/._-]{1,24}$/.test(x.symbol)&&typeof x[key==='vantix_portfolio'?'qty':'price']==='number'&&Number.isFinite(x[key==='vantix_portfolio'?'qty':'price'])&&x[key==='vantix_portfolio'?'qty':'price']>0).slice(0,500)}catch{return []}}

async function api(path,options={}){const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),45000);try{const r=await fetch(path,{...options,signal:controller.signal});const data=await r.json();if(!r.ok)throw Error(data.message||data.answer||data.error||'Request failed. Please try again.');return data}finally{clearTimeout(timer)}}
let marketSources=[],newsSources=[],dataBusy=false;
async function loadData(){if(dataBusy)return;dataBusy=true;try{
const responses=await Promise.allSettled([api('/api/market'),api('/api/news')]);
if(responses[0].status==='fulfilled'){marketData=mergeLiveQuotes(responses[0].value.data||[]);marketSources=responses[0].value.sources||[]}else{marketData=marketData.map(x=>freshLive(x)?x:{...x,status:'STALE'});marketSources=marketSources.map(x=>({...x,status:x.data?.length?'STALE':'UNAVAILABLE'}))}
if(responses[1].status==='fulfilled'){newsData=responses[1].value.data||[];newsSources=responses[1].value.sources||[]}else{newsData=newsData.map(x=>({...x,status:'STALE'}));newsSources=newsSources.map(x=>({...x,status:x.data?.length?'STALE':'UNAVAILABLE'}))}

function layout(title,sub,body){const current=document.getElementById('currentPage');if(current)current.textContent=title;page.innerHTML=`<header class="pageHeader"><h1>${title}</h1><div class="muted">${sub}</div></header>${body}`}
function toggleGlobalSearch(){const panel=document.getElementById('globalSearchPanel'),button=document.getElementById('globalSearch');const opening=panel.hidden;panel.hidden=!opening;button.setAttribute('aria-expanded',String(opening));if(opening){runGlobalSearch();setTimeout(()=>document.getElementById('globalSearchInput')?.focus(),0)}}
function closeGlobalSearch(focus=true){const panel=document.getElementById('globalSearchPanel'),button=document.getElementById('globalSearch');if(!panel)return;panel.hidden=true;button?.setAttribute('aria-expanded','false');if(focus)button?.focus()}
function openSearchPage(path){if(!routes.some(r=>r[0]===path)||path==='/ask')return;go(path)}
function openSearchAsset(symbol){if(!chartChoices['/markets'].includes(symbol))return;chartDefaults['/markets']=symbol;chartOpen['/markets']=[symbol];go('/markets')}
function runGlobalSearch(){
 const input=document.getElementById('globalSearchInput'),target=document.getElementById('globalSearchResults');if(!input||!target)return;const query=input.value.trim().toLowerCase();
 if(!query){target.innerHTML='<div class="empty" style="grid-column:1/-1">Search markets, companies, currencies, commodities, site pages, and available news sources.</div>';return}
 const instruments=Object.entries(chartCatalog).flatMap(([group,rows])=>rows.map(([symbol,label])=>({group,symbol,label}))).filter(x=>[x.symbol,x.label,x.group].some(v=>v.toLowerCase().includes(query))).slice(0,8);
 const pageMatches=routes.filter(r=>r[0]!=='/ask'&&[r[0],r[2]].some(v=>v.toLowerCase().includes(query))).slice(0,4);
 const headlines=newsData.filter(x=>[x.title,x.source,x.category].some(v=>String(v||'').toLowerCase().includes(query))).slice(0,8);
 const results=[];
 for(const x of instruments){const quote=marketData.find(row=>row.symbol===x.symbol.split(':').pop().replace(/USDT$/,'')||row.symbol===x.symbol);results.push(`<button class="searchResult" data-command="openSearchAsset('${x.symbol}')"><span><b>${esc(x.label)}</b><small>${esc(x.symbol)}${quote?' · '+money(quote.price)+' '+esc(quote.quote||''):''}</small></span><span class="searchResultType">${esc(x.group)}</span></button>`)}
 for(const r of pageMatches)results.push(`<button class="searchResult" data-command="openSearchPage('${r[0]}')"><span><b>${esc(r[2])}</b><small>Open this VANTIX section</small></span><span class="searchResultType">Page</span></button>`);
 for(const x of headlines)results.push(`<a class="searchResult" href="${esc(safeLink(x.link))}" target="_blank" rel="noopener noreferrer"><span><b>${esc(x.title)}</b><small>${esc(x.source)} · ${esc(x.published||x.seen_at||'Time unavailable')}</small></span><span class="searchResultType">News ↗</span></a>`);
 target.innerHTML=results.join('')||'<div class="empty" style="grid-column:1/-1">No matching market or source record is currently available.</div>';
}
function marketRowsContent(filter){let rows=marketData.filter(filter||(()=>true));return rows.length?`<div class="rows">${rows.map(x=>`<div class="row click" data-asset="${esc(x.symbol)}" role="button" tabindex="0"><span><b>${esc(x.symbol)}</b><br><span class="muted">${esc(x.source||'provider')} · ${esc(x.status||'UNKNOWN')}<br>${esc(x.updated||'Timestamp unavailable')}</span></span><span style="text-align:right"><b>${x.symbol.includes('/')?esc(x.price)+' '+esc(x.symbol.split('/')[1]):money(x.price)}</b><br><span class="${x.change>=0?'up':'down'}">${pct(x.change)}</span><br><small>${esc(x.quote||'')} · ${x.change==null?'Reference rate':'24h change'}</small></span></div>`).join('')}</div>`:'<div class="empty">No provider data returned.</div>'}
function marketRows(filter){const sample=STREAM_SYMBOLS.map(symbol=>({symbol})).concat([{symbol:'USD/GBP'}]);const matches=sample.filter(filter||(()=>true));const mode=matches.some(x=>x.symbol.includes('/'))?(matches.length===1?'fx':'all'):'crypto';return `<div data-market-filter="${mode}">${marketRowsContent(filter)}</div>`}

function renderHome(){const current=document.getElementById('currentPage');if(current)current.textContent='Overview';page.innerHTML=`<section class="homeHero"><div class="homeEyebrow">World & market intelligence</div><h1>See what moves the world.</h1><p>Track global markets, review source-linked reporting, and turn a crowded information stream into a clear research workspace.</p><div class="toolbar"><button class="btn" data-command="go('/markets')">Open market workspace</button><button class="pill" data-command="go('/news')">Read latest news</button><button class="pill" data-command="go('/ask')">Ask VANTIX</button></div></section><div class="sectionHeading"><div><h2>Market pulse</h2><p>Recent observations from connected providers</p></div><button class="pill" data-command="go('/markets')">View all markets →</button></div><div class="marketStrip">${homeMarketTiles()}</div><div class="grid2"><section class="panel"><h2>Latest intelligence</h2><p class="muted">Original sources with publication times.</p>${newsList(7)}</section><section class="panel"><h2>Tracked markets</h2>${marketRows()}<div class="notice">Crypto is marked LIVE only while fresh updates arrive. FX uses daily reference rates.</div></section></div><div class="grid3" style="margin-top:14px"><section class="panel"><h2>Community Feed</h2><p>Discuss events and analysis with source links.</p><button class="pill" data-command="go('/feed')">Open Feed</button></section><section class="panel"><h2>Market Radar</h2><p>Review ranked 24-hour price moves across tracked assets.</p><button class="pill" data-command="go('/radar')">View Radar</button></section><section class="panel"><h2>Token Shield</h2><p>Check provider-reported token flags before drawing conclusions.</p><button class="pill" data-command="go('/shield')">Open Shield</button></section></div>`}

function gmgnMetric(label,value,format=money){return `<span><small>${esc(label)}</small><b>${format(value)}</b></span>`}
function gmgnAge(value){if(typeof value!=='number'||!Number.isFinite(value))return 'Age unknown';const seconds=Math.max(0,Date.now()/1000-value);return seconds<60?'Under 1m old':seconds<3600?Math.floor(seconds/60)+'m old':seconds<86400?Math.floor(seconds/3600)+'h old':Math.floor(seconds/86400)+'d old'}
function gmgnRows(rows,fresh=false){return rows?.length?`<div class="gmgnGrid">${rows.map(x=>{const risk=x.rug_ratio==null?'warn':x.rug_ratio>0.5?'block':x.rug_ratio>0.2?'warn':'';return `<article class="gmgnCard"><div class="gmgnHead"><div class="gmgnMark">${esc((x.symbol||'?').slice(0,2).toUpperCase())}</div><div class="gmgnName"><b>${esc(x.symbol||'Unknown')}</b><small>${esc(x.name||'Unnamed token')}</small></div><span class="badge">${fresh?'NEW':'#'+esc(x.rank??'—')}</span></div><div class="muted" style="margin-top:7px">${esc(String(x.chain||'').toUpperCase())} · ${esc(x.platform||x.exchange||'Platform unknown')} · ${gmgnAge(x.created_at)}</div><div class="gmgnStats">${gmgnMetric('Price',x.price,tokenPrice)}${gmgnMetric('Market cap',x.market_cap)}${gmgnMetric('Liquidity',x.liquidity)}${gmgnMetric(fresh?'1h volume':'Volume',x.volume)}${gmgnMetric('Holders',x.holders)}${gmgnMetric(fresh?'1m swaps':'Swaps',x.swaps)}</div><div class="gmgnFoot"><span class="badge ${risk}">Risk ${ratioPct(x.rug_ratio)}</span><span class="badge">Top 10 ${ratioPct(x.top10_rate)}</span><span class="badge">Smart ${money(x.smart_money)}</span><span class="${x.price_change>=0?'up':'down'}">${pct(x.price_change)}</span></div><p style="margin:10px 0 0"><a href="${esc(safeLink(x.link))}" target="_blank" rel="noopener noreferrer">View on GMGN ↗</a></p></article>`}).join('')}</div>`:'<div class="empty">No coins match these filters.</div>'}
function renderTrending(){layout('Trending Coins','Find active and newly created coins using read-only GMGN data.',`<section class="panel"><div class="searchbar"><label>Chain filter <select class="input compactInput" id="gmgnChain" data-change-command="loadGmgn()"><option value="sol">Solana</option><option value="bsc">BNB Chain</option><option value="base">Base</option><option value="eth">Ethereum</option></select></label><label>Window <select class="input compactInput" id="gmgnInterval" data-change-command="loadGmgn()"><option value="1m">1 minute</option><option value="5m" selected>5 minutes</option><option value="1h">1 hour</option><option value="6h">6 hours</option><option value="24h">24 hours</option></select></label><button class="btn" data-command="loadGmgn()">Refresh data</button></div><div class="gmgnFilters" style="margin-top:12px"><label>Search <input class="input compactInput" id="gmgnSearch" data-gmgn-filter placeholder="Symbol, name or address"></label><label>Min liquidity <input class="input compactInput" id="gmgnMinLiquidity" data-gmgn-filter type="number" min="0" placeholder="Any"></label><label>Min market cap <input class="input compactInput" id="gmgnMinMarketCap" data-gmgn-filter type="number" min="0" placeholder="Any"></label><label>Max risk % <input class="input compactInput" id="gmgnMaxRisk" data-gmgn-filter type="number" min="0" max="100" placeholder="Any"></label><label>Sort <select class="input compactInput" id="gmgnSort" data-gmgn-filter><option value="rank">Rank / newest</option><option value="volume">Volume</option><option value="liquidity">Liquidity</option><option value="market_cap">Market cap</option><option value="holders">Holders</option><option value="smart_money">Smart money</option></select></label></div><button class="pill" style="margin-top:9px" data-command="resetGmgnFilters()">Reset filters</button><p class="notice" style="margin-top:10px">Fresh coins are high risk. Missing data stays unknown. A low risk indicator is not a safety guarantee.</p></section><div id="gmgnStatus" role="status" class="muted" style="margin:14px 0">Loading GMGN…</div><div class="gmgnColumns"><section class="gmgnSection"><div class="gmgnSectionTitle"><h2>Popular</h2><p class="muted" id="gmgnTrendingCount"></p></div><div id="gmgnTrending"></div></section><section class="gmgnSection"><div class="gmgnSectionTitle"><h2>New Pairs</h2><p class="muted" id="gmgnFreshCount"></p></div><div id="gmgnFresh"></div></section></div>`);loadGmgn()}
let gmgnRequest=0,gmgnData={trending:[],fresh:[]},gmgnUsable={trending:false,fresh:false},gmgnUnavailable={trending:'Trending data is unavailable.',fresh:'Fresh coin data is unavailable.'};
function gmgnFilterRows(rows,fresh=false){
 const query=(document.getElementById('gmgnSearch')?.value||'').trim().toLowerCase(),minLiquidity=Math.max(0,Number(document.getElementById('gmgnMinLiquidity')?.value||0)),minMarketCap=Math.max(0,Number(document.getElementById('gmgnMinMarketCap')?.value||0)),riskText=document.getElementById('gmgnMaxRisk')?.value||'',maxRisk=riskText===''?null:Math.min(1,Math.max(0,Number(riskText)/100)),sort=document.getElementById('gmgnSort')?.value||'rank';
 const filtered=rows.filter(x=>(!query||[x.symbol,x.name,x.address].some(v=>String(v||'').toLowerCase().includes(query)))&&(!minLiquidity||(typeof x.liquidity==='number'&&x.liquidity>=minLiquidity))&&(!minMarketCap||(typeof x.market_cap==='number'&&x.market_cap>=minMarketCap))&&(maxRisk==null||(typeof x.rug_ratio==='number'&&x.rug_ratio<=maxRisk)));
 return filtered.sort((a,b)=>sort==='rank'?(fresh?(b.created_at||0)-(a.created_at||0):(a.rank??9999)-(b.rank??9999)):(b[sort]??-1)-(a[sort]??-1));
}
function applyGmgnFilters(){for(const [kind,fresh] of [['trending',false],['fresh',true]]){const target=document.getElementById(kind==='trending'?'gmgnTrending':'gmgnFresh'),count=document.getElementById(kind==='trending'?'gmgnTrendingCount':'gmgnFreshCount');if(!target)continue;if(!gmgnUsable[kind]){target.innerHTML='<div class="empty">'+esc(gmgnUnavailable[kind])+'</div>';if(count)count.textContent='';continue}const rows=gmgnFilterRows(gmgnData[kind],fresh);target.innerHTML=gmgnRows(rows,fresh);if(count)count.textContent='Showing '+rows.length+' of '+gmgnData[kind].length}}
function resetGmgnFilters(){for(const id of ['gmgnSearch','gmgnMinLiquidity','gmgnMinMarketCap','gmgnMaxRisk']){const el=document.getElementById(id);if(el)el.value=''}const sort=document.getElementById('gmgnSort');if(sort)sort.value='rank';applyGmgnFilters()}
function gmgnResult(result,label,fresh=false){
 const value=result.status==='fulfilled'?result.value:null;
 if(!value||!Array.isArray(value.data))return {html:'<p>'+label+' data is temporarily unavailable.</p>',summary:label+': unavailable.',data:[],usable:false};
 const stale=value.status==='STALE',ok=value.status==='PROVIDER_QUERY';
 const summary=label+': '+(ok?'retrieved':stale?'stale cached results':String(value.status||'unavailable').toLowerCase())+(value.retrieved_at?' · Received '+value.retrieved_at:'')+'.';
 return {html:'<p class="muted">'+esc(summary)+(value.message?' '+esc(value.message):'')+'</p>'+((ok||stale)?gmgnRows(value.data,fresh):'<p>No current observations available.</p>'),summary,data:value.data,usable:ok||stale,message:value.message};
}
async function loadGmgn(){
 const status=document.getElementById('gmgnStatus'),chain=document.getElementById('gmgnChain')?.value||'sol',interval=document.getElementById('gmgnInterval')?.value||'5m';if(!status)return;
 const request=++gmgnRequest;status.textContent='Checking GMGN '+chain.toUpperCase()+' data…';
 document.getElementById('gmgnTrending').textContent='Loading selected rankings…';document.getElementById('gmgnFresh').textContent='Loading selected fresh tokens…';
 try{
  const results=await Promise.allSettled([api('/api/gmgn/trending?chain='+encodeURIComponent(chain)+'&interval='+encodeURIComponent(interval)),api('/api/gmgn/fresh?chain='+encodeURIComponent(chain))]);
  if(request!==gmgnRequest||status!==document.getElementById('gmgnStatus'))return;
  const trending=gmgnResult(results[0],'Trending'),fresh=gmgnResult(results[1],'Fresh',true);
  gmgnData={trending:trending.data,fresh:fresh.data};gmgnUsable={trending:trending.usable,fresh:fresh.usable};gmgnUnavailable={trending:trending.message||'Trending data is unavailable.',fresh:fresh.message||'Fresh coin data is unavailable.'};applyGmgnFilters();
  status.textContent=chain.toUpperCase()+' · '+interval+' trending window · '+trending.summary+' '+fresh.summary+' Rankings can change quickly; refresh to query again.';
 }catch{if(request===gmgnRequest&&status===document.getElementById('gmgnStatus'))status.textContent='GMGN data is temporarily unavailable.'}
}
function searchSources(){const q=document.getElementById('q').value.trim();if(!q)return;const words=q.toLowerCase().match(/[a-z0-9]{3,}/g)||[];const matches=newsData.filter(x=>words.some(w=>x.title.toLowerCase().includes(w))).slice(0,6);document.getElementById('chat').insertAdjacentHTML('beforeend',`<div class="msg user">${esc(q)}</div><div class="msg bot"><b>Source search · no AI interpretation</b>${newsCards(matches)}${marketData.filter(x=>words.some(w=>x.symbol.toLowerCase().includes(w))).map(x=>`<p>${esc(x.symbol)} ${money(x.price)} ${esc(x.quote)} · ${esc(x.status)} · ${esc(x.updated)}</p>`).join('')}</div>`)}

async function sendAI(){if(aiBusy)return;const q=document.getElementById('q').value.trim();const consent=document.getElementById('aiConsent').checked;if(!q)return;if(!consent){alert('Confirm sharing the question, or use source search.');return}const el=document.getElementById('chat');const button=document.getElementById('aiSend');aiBusy=true;button.disabled=true;button.textContent='Thinking…';el.insertAdjacentHTML('beforeend',`<div class="msg user">${esc(q)}</div>`);try{const x=await postJSON('/api/ai',{question:q,consent,history:aiHistory.slice(-4)});if(el!==document.getElementById('chat'))return;aiHistory.push({role:'user',content:q.slice(0,1500)},{role:'assistant',content:x.answer.slice(0,1500)});aiHistory=aiHistory.slice(-4);if(document.getElementById('q').value.trim()===q)document.getElementById('q').value='';const label=x.mode==='GENERAL'?'GENERAL ANSWER':x.mode==='SOURCE_FALLBACK'?'SOURCE FALLBACK':'SOURCE-LINKED ANSWER';el.insertAdjacentHTML('beforeend',`<div class="msg bot"><b>${label} · ${esc(x.provider)}</b><p style="white-space:pre-wrap">${esc(x.answer)}</p><p>${esc(x.limitations)}</p>${x.sources.map(r=>`<p><a href="${esc(safeLink(r.source_url||r.link))}" target="_blank" rel="noopener noreferrer">${esc(r.id)} · ${esc(r.title||r.symbol||r.source)}</a><br><small>Observed ${esc(r.updated||r.published||'Date unavailable')} · Retrieved ${esc(r.retrieved_at)}</small></p>`).join('')}</div>`)}catch(e){if(el===document.getElementById('chat'))el.insertAdjacentHTML('beforeend',`<div class="msg bot">${esc(e.message)}</div>`)}finally{aiBusy=false;button.disabled=false;button.textContent='Ask AI';el.scrollTop=el.scrollHeight}}

let feedSnapshot=null,pendingFeed=null,feedBusy=false,feedSort='latest';
function paintFeed(x){const el=document.getElementById('communityFeed');if(!el)return;
const drafts=Array.from(el.querySelectorAll('input')).map(i=>[i.id,i.value]);
const active=document.activeElement;const focusId=active?.id;const start=active?.selectionStart;const end=active?.selectionEnd;
el.innerHTML=x.data.length?x.data.map(p=>`<article class="panel" style="margin:10px 0"><div class="memberline"><b>${esc(p.display_name)}</b><span class="badge">Email verified</span><span class="muted">${esc(p.label)} · ${Number(p.followers)||0} followers · ${new Date(p.created_at).toLocaleString()}</span>${p.can_follow?`<button class="pill ${p.following?'active':''}" data-command="followMember(${p.author_id},${!p.following})">${p.following?'Following':'Follow'}</button>`:''}</div><div style="margin:11px 0;line-height:1.6">${esc(p.body)}</div>${p.source_url?`<a href="${esc(safeLink(p.source_url))}" target="_blank" rel="noopener" style="color:#5fdfff">${esc(p.source_label||'Open source')}</a>`:''}<div class="toolbar"><button class="pill" data-command="reactPost(${p.id},${!p.reacted})">${p.reacted?'Liked':'Like'} · ${Number(p.reactions)||0}</button><span class="pill">Comments · ${Number(p.comments)||0}</span><button class="pill" data-command="reportContent('post',${p.id})">Report</button></div><div class="rows" style="margin-top:10px">${p.comments_list.map(c=>`<div class="row"><span><b>${esc(c.display_name)}</b> · ${esc(c.body)} <button class="pill" data-command="reportContent('comment',${c.id})">Report</button></span><small>${new Date(c.created_at).toLocaleString()}</small></div>`).join('')}</div><div class="searchbar" style="margin-top:8px"><input class="input" id="comment-${p.id}" placeholder="Comment on this post"><button class="pill" data-command="commentPost(${p.id})">Comment</button></div></article>`).join(''):'<div class="empty">No posts in this view yet.</div>';
for(const[id,value]of drafts){const field=document.getElementById(id);if(field)field.value=value}
const focused=document.getElementById(focusId);if(focused){focused.focus();if(start!=null)focused.setSelectionRange(start,end)}
feedSnapshot=JSON.stringify(x.data);pendingFeed=null;
const button=document.getElementById('showFeedUpdates');if(button)button.style.display='none';
}
function applyFeedUpdates(){if(pendingFeed)paintFeed(pendingFeed)}
async function loadFeed(background=false){
if(feedBusy||!document.getElementById('communityFeed'))return;feedBusy=true;
const target=document.getElementById('communityFeed');
try{const response=await fetch('/api/feed?sort='+encodeURIComponent(feedSort),{cache:'no-store'});if(!response.ok)throw Error('Feed unavailable');const x=await response.json();if(!Array.isArray(x.data))throw Error('Invalid feed');if(target!==document.getElementById('communityFeed'))return;
if(JSON.stringify(x.data)!==feedSnapshot){if(background&&feedSnapshot!==null){pendingFeed=x;document.getElementById('showFeedUpdates').style.display='inline-block'}else paintFeed(x)}
document.getElementById('feedUpdateStatus').textContent='Last checked '+new Date().toLocaleTimeString()+' · Updates checked every 10 seconds';
}catch(error){if(target===document.getElementById('communityFeed')){document.getElementById('feedUpdateStatus').textContent='Connection unavailable. Retrying every 10 seconds.';if(feedSnapshot===null)target.innerHTML='<div class="empty">Conversations could not be loaded.</div>'}}
finally{feedBusy=false}
}

function generic(path){
const c=cfg[path];layout(c[0],c[1],'');
if(path==='/forex')page.innerHTML+=`<div class="panel"><h2>Daily reference exchange rates</h2>${marketRows(x=>x.symbol.includes('/'))}</div>`;
else if(path==='/economy'||path==='/sectors')renderIndicators(path);
else if(path==='/stocks'){page.innerHTML+=`<div class="notice">Use the chart buttons for major US shares and the S&amp;P 500 ETF. Chart timing and exchange delays are shown by TradingView; VANTIX does not relabel chart data as its own live quote.</div>`;renderFilings()}
else if(path==='/research')renderFilings();
else if(path==='/commodities')page.innerHTML+=`<div class="panel"><h2>Metals and energy</h2><p class="muted">Use the chart buttons for gold, silver, Brent, WTI and natural gas. The news below is published analysis, not a price feed.</p>${newsCards(newsData.filter(x=>x.category==='energy'))}<p><a href="https://www.worldbank.org/en/research/commodity-markets" target="_blank" rel="noopener">World Bank commodity price reports ↗</a></p></div>`;
else if(path==='/radar'){const movers=marketData.filter(x=>x.change!=null).sort((a,b)=>Math.abs(b.change)-Math.abs(a.change));page.innerHTML+=`<div class="panel"><h2>Largest 24-hour moves in tracked assets</h2><p class="muted">Calculated from seven tracked USDT assets using available exchange feeds, not the entire market. Each row identifies its exchange; prices and changes can differ between exchanges. Volume is 24-hour quote volume; it is not proof of unusual activity. Causes have not been established.</p>${movers.length?movers.map(x=>`<div class="row"><span><b>${esc(x.symbol)}</b><br><small>${esc(x.source)} · ${esc(x.updated)} · ${esc(x.status)}</small></span><span>${pct(x.change)}<br><small>Volume ${Number(x.volume).toLocaleString()} USDT</small></span></div>`).join(''):'<div class="empty">Price observations unavailable.</div>'}</div>`}
else if(path==='/watchlist')renderWatchExtra();
else if(path==='/alerts')renderAlertExtra();
}
function sourceStatus(sources){return sources.map(x=>`<div class="row"><span>${esc(x.source)}<br><small>Checked ${esc(x.checked_at||'Not checked')}<br>Last received ${esc(x.retrieved_at||'Never')}</small></span><span class="badge">${esc(x.status||'UNKNOWN')}</span></div>`).join('')}
function renderIndicators(path){const sector=path==='/sectors';page.innerHTML+=`<div class="panel"><h2>${sector?'Economic sector composition':'Economic indicators'}</h2><p class="muted">Annual World Bank observations; reporting years can differ. ${sector?'These figures describe the economy, not stock-sector investment returns.':''}</p><label>Country <select class="input" id="countrySelect" data-change-command="loadIndicators('${path}')">${[['GBR','United Kingdom'],['USA','United States'],['CHN','China'],['DEU','Germany'],['JPN','Japan'],['IND','India'],['WLD','World']].map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label><div id="indicatorResults" aria-live="polite">Loading observations…</div></div>`;loadIndicators(path)}
let indicatorRequest=0;
async function loadIndicators(path){const id=++indicatorRequest;const target=document.getElementById('indicatorResults');const country=document.getElementById('countrySelect').value;try{const r=await fetch('/api'+path+'?country='+country);if(!r.ok)throw Error();const x=await r.json();if(id!==indicatorRequest||target!==document.getElementById('indicatorResults'))return;target.innerHTML=`<p class="muted">${esc(x.source||'World Bank')} · ${esc(x.status||'UNAVAILABLE')} · Checked ${esc(x.checked_at||'Not checked')}</p>`+(x.data?.length?x.data.map(row=>`<div class="row"><span><b>${esc(row.title)}</b><br><small>${esc(row.country)} · Reporting year ${esc(row.updated)}</small><br><a href="${esc(safeLink(row.link))}" target="_blank" rel="noopener">Source ↗</a></span><b>${Number(row.value).toFixed(2)}%</b></div>`).join(''):`<div class="empty">${esc(x.message||'No observations returned.')}</div>`)}catch{if(target===document.getElementById('indicatorResults'))target.innerHTML='<div class="empty">Economic source unavailable. No figures have been substituted.</div>'}}
function renderFilings(){page.innerHTML+=`<section class="panel"><h2>Company filings</h2><p class="muted">Search official SEC submissions by numeric CIK. Filing dates are shown as reported; these are not share prices.</p><div class="searchbar"><label>SEC company CIK <input class="input" id="companyCik" inputmode="numeric" placeholder="e.g. 320193"></label><button class="btn" data-command="loadFilings()">Find filings</button><a href="https://www.sec.gov/edgar/search/" target="_blank" rel="noopener">Find a company’s CIK ↗</a></div><div id="filingResults" aria-live="polite"></div></section>`}
async function loadFilings(){const el=document.getElementById('filingResults');const cik=document.getElementById('companyCik').value.trim();if(!/^\d{1,10}$/.test(cik)){el.textContent='Enter a numeric CIK of up to 10 digits.';return}el.textContent='Looking up SEC filings…';try{const r=await fetch('/api/filings?cik='+encodeURIComponent(cik));const x=await r.json();if(el!==document.getElementById('filingResults'))return;el.innerHTML=`<p class="muted">${esc(x.status||'UNAVAILABLE')} · ${esc(x.checked_at||'Not checked')}</p>`+(x.data?.length?newsCards(x.data):`<p>${esc(x.message||'No filings returned.')}</p>`)}catch{el.textContent='SEC filings could not be retrieved.'}}

function removeWatchAt(i){const items=saved('vantix_watch');items.splice(i,1);storageSet('vantix_watch',JSON.stringify(items));render()}
function removeWatch(v){let a=saved('vantix_watch').filter(x=>x!==v);storageSet('vantix_watch',JSON.stringify(a));render()}
function renderAlertExtra(){let a=saved('vantix_alerts');page.innerHTML+=`<div class="panel" style="margin-top:14px"><h3>LOCAL ALERT RULES</h3><div class="searchbar"><input class="input" id="alertSymbol" placeholder="Symbol"><input class="input" id="alertPrice" type="number" placeholder="Price"><button class="btn" data-command="addAlert()">Add</button></div><div class="rows" style="margin-top:10px">${a.length?a.map((x,i)=>`<div class="row"><span><b>${esc(x.symbol)}</b> ≥ ${esc(x.price)}</span><button class="pill" data-command="removeAlert(${i})">Remove</button></div>`).join(''):'<div class="empty">No alerts configured.</div>'}</div></div>`}

function removeAlert(i){let a=saved('vantix_alerts');a.splice(i,1);storageSet('vantix_alerts',JSON.stringify(a));render()}
function renderPortfolio(){let holdings=saved('vantix_portfolio');layout('Portfolio Tracker','Local portfolio workspace. Valuations use USDT crypto snapshots when symbols match; USDT is not the same as USD.',`<div class="panel"><h3>ADD HOLDING</h3><div class="searchbar"><input class="input" id="portSymbol" placeholder="BTC"><input class="input" id="portQty" type="number" placeholder="Quantity"><button class="btn" data-command="addHolding()">Add</button></div></div><div class="panel" style="margin-top:14px"><h3>HOLDINGS</h3>${holdings.length?`<table class="table"><tr><th>Asset</th><th>Quantity</th><th>Price (USDT)</th><th>Value (USDT)</th><th>Status / observed</th><th></th></tr>${holdings.map((h,i)=>{let x=marketData.find(m=>m.symbol===h.symbol&&m.quote==='USDT');let v=x?x.price*h.qty:null;return `<tr><td><b>${esc(h.symbol)}</b></td><td>${esc(h.qty)}</td><td>${money(x?.price)}</td><td>${money(v)}</td><td>${esc(x?.status||'UNAVAILABLE')}<br>${esc(x?.updated||'No quote')}</td><td><button class="pill" data-command="removeHolding(${i})">Remove</button></td></tr>`}).join('')}</table>`:'<div class="empty">No holdings yet.</div>'}</div>`)}
function addHolding(){let s=document.getElementById('portSymbol').value.trim().toUpperCase(),q=Number(document.getElementById('portQty').value);if(!validSymbol(s)||!Number.isFinite(q)||q<=0){alert('Enter a valid symbol and a positive finite quantity.');return}let a=saved('vantix_portfolio');a.push({symbol:s,qty:q});storageSet('vantix_portfolio',JSON.stringify(a));render()}
function removeHolding(i){let a=saved('vantix_portfolio');a.splice(i,1);storageSet('vantix_portfolio',JSON.stringify(a));render()}
function render(){let p=location.pathname.replace(/\/$/,'')||'/';if(p==='/copilot'){history.replaceState({},'','/ask');p='/ask'}document.querySelectorAll('[data-route]').forEach(a=>a.classList.toggle('active',a.dataset.route===p));if(p==='/')renderHome();else if(p==='/ask')renderAsk();else if(p==='/markets')renderMarkets();else if(p==='/crypto')renderCrypto();else if(p==='/trending')renderTrending();else if(p==='/news')renderNews();else if(p==='/feed')renderFeed();else if(p==='/shield')renderShield();else if(['/watchlist','/portfolio','/alerts'].includes(p))renderSaved(p.slice(1));else if(p==='/account')renderAccount();else if(p==='/admin')renderAdmin();else if(p==='/reset-password')renderReset();else if(p==='/privacy'||p==='/terms')renderPolicy(p);else if(cfg[p])generic(p);else renderHome();mountMarketChart()}

function renderReset(){layout('Reset password','Use the link from your reset email.',`<section class="panel"><label>New password <input type="password" autocomplete="new-password" id="resetPassword" class="input" minlength="8" maxlength="256"></label><button class="btn" data-command="resetPassword()">Change password</button><p id="resetStatus" role="status"></p><a href="/account" data-route="/account">Return to sign-in</a></section>`)}

function renderSaved(kind){const title={watchlist:'Watchlist',portfolio:'Portfolio Tracker',alerts:'Price Alerts'}[kind];layout(title,kind==='alerts'?'Checks tracked crypto thresholds while this page is open. No background or email alert delivery.':'Saved to your account. Quote coverage is limited to the displayed providers.',`<section class="panel"><div id="authBox"></div><label>Asset symbol <input class="input" id="savedSymbol" maxlength="24" placeholder="BTC"></label>${kind!=='watchlist'?`<label>${kind==='portfolio'?'Quantity':'Threshold in USDT'} <input class="input" id="savedValue" type="number" min="0" step="any"></label>`:''}<button class="btn" data-command="addSaved('${kind}')">Add</button><p id="savedStatus" role="status"></p><div id="savedRows">Loading saved items…</div>${kind==='alerts'?'<h2>Notifications</h2><div id="notifications"></div>':''}</section>`);loadAuth();loadSaved(kind);if(kind==='alerts')loadNotifications()}
async function loadSaved(kind){const el=document.getElementById('savedRows');try{const x=await api('/api/saved?kind='+kind);if(el!==document.getElementById('savedRows'))return;el.innerHTML=x.data.length?x.data.map(r=>{const q=marketData.find(x=>x.symbol===r.symbol&&x.quote==='USDT');return `<div class="row"><span><b>${esc(r.symbol)}</b>${r.value!=null?' · '+esc(r.value)+(kind==='alerts'?' USDT threshold':' units'):''}<br><small>${q?money(q.price)+' USDT · '+esc(q.status)+' · '+esc(q.updated):'Quote unavailable'}${kind==='portfolio'&&q?'<br>Indicative holding value: '+money(q.price*r.value)+' USDT':''}</small></span><button class="pill" data-command="removeSaved(${r.id},'${kind}')">Remove</button></div>`}).join(''):'<p>No saved items yet.</p>'}catch(e){if(el===document.getElementById('savedRows'))el.textContent=e.message}}

async function addSaved(kind){if(savedBusy)return;savedBusy=true;const el=document.getElementById('savedStatus');try{await postJSON('/api/saved/add',{kind,symbol:document.getElementById('savedSymbol').value,value:kind==='watchlist'?null:document.getElementById('savedValue').value});el.textContent='Saved.';await loadSaved(kind)}catch(e){el.textContent=e.message}finally{savedBusy=false}}

async function loadNotifications(){const el=document.getElementById('notifications');if(!el)return;try{const x=await api('/api/notifications');if(el!==document.getElementById('notifications'))return;el.innerHTML=x.data.length?x.data.map(r=>`<p>${esc(r.message)}<br><small>${esc(r.source)} · ${esc(r.observed_at)}</small></p>`).join(''):'No threshold notifications.'}catch(e){el.textContent=e.message}}

p id="ownerContact"></p></section>`);api('/api/capabilities').then(x=>{const el=document.getElementById('ownerContact');if(el)el.textContent=x.support_email?'Account, deletion and privacy requests: '+x.support_email:'Site-owner contact is not configured in this local build.'}).catch(()=>{})}

setTimeout(()=>{storageRemove('vantix_token');api('/api/capabilities').then(x=>{const live=document.querySelector('.live');if(live)live.title=(x.ai_configured?'AI connected':'Source search available')+' · Source availability varies'}).catch(()=>{});recordPage()},0);

// Public read-only ticker stream. LIVE requires fresh provider events, not just an open socket.
const STREAM_SYMBOLS=['BTC','ETH','BNB','SOL','DOGE','XRP','ADA'];
let bybitStatus='Connecting';
let bybitSocket=null,bybitRetry=null,bybitFailures=0,bybitOpenedAt=0,lastBybitEvent=0;
const COINBASE_SYMBOLS=STREAM_SYMBOLS.filter(s=>s!=='BNB');
let coinbaseStatus='Connecting',coinbaseSocket=null,coinbaseRetry=null,coinbaseFailures=0,coinbaseOpenedAt=0,lastCoinbaseEvent=0;
let cryptoSocket=null,streamRetry=null,streamFailures=0,streamOpenedAt=0,lastStreamEvent=0;
const liveQuotes=new Map();
function providerSocket(provider){return provider==='bybit'?bybitSocket:provider==='coinbase'?coinbaseSocket:cryptoSocket}
function freshLive(row,now=Date.now()){return row&&row.status==='LIVE'&&providerSocket(row.provider)?.readyState===1&&now-row.receivedAt<15000&&now-row.eventAt<15000&&now>=row.eventAt-5000}
function preferredLive(symbol){return [liveQuotes.get('binance/'+symbol),liveQuotes.get('bybit/'+symbol)].find(r=>freshLive(r))}
function mergeLiveQuotes(rows){const merged=rows.map(r=>preferredLive(r.symbol)||r);for(const symbol of STREAM_SYMBOLS){const r=preferredLive(symbol);if(r&&!merged.some(x=>x.symbol===symbol))merged.push(r)}return merged}
function acceptTicker(raw,now=Date.now(),provider='binance'){
 if(!['binance','bybit'].includes(provider))return false;
 if(!raw||raw.e!=='24hrTicker'||typeof raw.s!=='string'||!raw.s.endsWith('USDT'))return false;
 const symbol=raw.s.slice(0,-4),price=Number(raw.c),change=Number(raw.P),volume=Number(raw.q),eventAt=Number(raw.E),closeAt=Number(raw.C);
 if(!STREAM_SYMBOLS.includes(symbol)||[raw.c,raw.P,raw.q,raw.E,raw.C].some(v=>v==null||v==='')||![price,change,volume,eventAt,closeAt].every(Number.isFinite)||price<=0||volume<0||now-eventAt>15000||eventAt-now>5000||closeAt>eventAt+5000||eventAt-closeAt>15000)return false;
 const previous=liveQuotes.get(provider+'/'+symbol);if(previous&&eventAt<=previous.eventAt)return false;
 const row={symbol,price,change,volume,quote:'USDT',provider,source:provider==='bybit'?'Bybit stream':'Binance stream',source_url:provider==='bybit'?'https://www.bybit.com/en/trade/spot/'+symbol+'/USDT':'https://www.binance.com/en/trade/'+symbol+'_USDT',status:'LIVE',updated:new Date(closeAt).toISOString(),eventAt,receivedAt:now};
 liveQuotes.set(provider+'/'+symbol,row);if(provider==='bybit'){lastBybitEvent=now;bybitFailures=0}else{lastStreamEvent=now;streamFailures=0}marketData=mergeLiveQuotes(marketData);return true;
}
function updateCryptoStatus(){const count=STREAM_SYMBOLS.filter(s=>preferredLive(s)).length;const el=document.getElementById('dataStatus');if(el)el.textContent=count===7?'CRYPTO LIVE · FX REFERENCE':count?'CRYPTO LIVE '+count+'/7 · FX REFERENCE':marketData.length?'SNAPSHOTS / REFERENCE':'CONNECTING TO MARKET DATA'}
function expireLiveQuotes(){const now=Date.now();marketData=mergeLiveQuotes(marketData).map(r=>r.status==='LIVE'&&!freshLive(r,now)?{...r,status:'STALE'}:r);updateCryptoStatus()}
function paintLiveQuotes(){expireLiveQuotes();paintExchangeComparison();const path=location.pathname;
 // Update only price panels; inputs, drafts and focus are preserved.
 document.querySelectorAll('[data-market-filter]').forEach(el=>{const mode=el.dataset.marketFilter;el.innerHTML=marketRowsContent(mode==='crypto'?x=>!x.symbol.includes('/'):mode==='fx'?x=>x.symbol.includes('/'):()=>true)});
 if(path==='/radar'&&!page.querySelector('input,textarea,select'))render();
}
function scheduleStream(){if(streamRetry||document.hidden)return;const delay=Math.min(30000,1000*2**Math.min(streamFailures++,5));streamRetry=setTimeout(()=>{streamRetry=null;connectCryptoStream()},delay)}
function disconnectCrypto(){const ws=cryptoSocket;cryptoSocket=null;if(ws){ws.onclose=null;ws.close()}expireLiveQuotes();paintLiveQuotes()}
function connectCryptoStream(){if(typeof WebSocket==='undefined'||document.hidden||cryptoSocket)return;
 const streams=STREAM_SYMBOLS.map(s=>s.toLowerCase()+'usdt@ticker').join('/');
 try{const ws=new WebSocket('wss://data-stream.binance.vision/stream?streams='+streams);cryptoSocket=ws;streamOpenedAt=Date.now();lastStreamEvent=0;
 ws.onmessage=e=>{if(ws!==cryptoSocket)return;try{const value=JSON.parse(e.data);acceptTicker(value.data||value)}catch{}};
 ws.onerror=()=>{if(ws===cryptoSocket)ws.close()};
 ws.onclose=()=>{if(ws!==cryptoSocket)return;cryptoSocket=null;paintLiveQuotes();scheduleStream();loadData()};
 }catch{cryptoSocket=null;scheduleStream()}}
setInterval(()=>{if(document.hidden)return;paintLiveQuotes();if(cryptoSocket&&Date.now()-(lastStreamEvent||streamOpenedAt)>20000){disconnectCrypto();scheduleStream();loadData()}},1000);
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(streamRetry){clearTimeout(streamRetry);streamRetry=null}disconnectCrypto()}else{connectCryptoStream();loadData()}});
setTimeout(connectCryptoStream,0);
function exchangeEmpty(provider,symbol){if(provider==='bybit')return bybitStatus;if(provider==='coinbase')return COINBASE_SYMBOLS.includes(symbol)?coinbaseStatus:'Pair unavailable';return 'No streaming quote'}
function paintExchangeComparison(){const el=document.getElementById('exchangeComparison');if(!el)return;el.innerHTML='<table class="table"><tr><th>Asset</th><th>Binance · USDT</th><th>Bybit · USDT</th><th>Coinbase · USD</th></tr>'+STREAM_SYMBOLS.map(symbol=>'<tr><td>'+symbol+'</td>'+['binance','bybit','coinbase'].map(provider=>{const r=liveQuotes.get(provider+'/'+symbol);return '<td>'+(r?money(r.price)+'<br><small>'+(freshLive(r)?'LIVE':'STALE')+' · '+esc(r.updated)+'</small>':esc(exchangeEmpty(provider,symbol)))+'</td>'}).join('')+'</tr>').join('')+'</table>'}
function acceptBybitMessage(value,now=Date.now()){if(value?.type!=='snapshot'||typeof value.topic!=='string')return false;const row=value.data;if(!row||value.topic!=='tickers.'+row.symbol||row.price24hPcnt==null||row.price24hPcnt==='')return false;return acceptTicker({e:'24hrTicker',s:row.symbol,c:row.lastPrice,P:Number(row.price24hPcnt)*100,q:row.turnover24h,E:value.ts,C:value.ts},now,'bybit')}
function scheduleBybit(){if(bybitRetry||document.hidden)return;const delay=Math.min(30000,1000*2**Math.min(bybitFailures++,5));bybitRetry=setTimeout(()=>{bybitRetry=null;connectBybit()},delay)}
function disconnectBybit(){const ws=bybitSocket;bybitSocket=null;if(ws){ws.onclose=null;ws.close()}paintLiveQuotes()}
function connectBybit(){if(typeof WebSocket==='undefined'||document.hidden||bybitSocket)return;try{const ws=new WebSocket('wss://stream.bybit.com/v5/public/spot');bybitSocket=ws;bybitStatus='Connecting';bybitOpenedAt=Date.now();lastBybitEvent=0;ws.onopen=()=>{if(ws===bybitSocket){bybitStatus='Awaiting ticker';paintExchangeComparison();ws.send(JSON.stringify({op:'subscribe',args:STREAM_SYMBOLS.map(s=>'tickers.'+s+'USDT')}))}};ws.onmessage=e=>{if(ws!==bybitSocket)return;try{const value=JSON.parse(e.data);if(value.op==='subscribe'&&value.success===false)bybitStatus='Subscription rejected';else if(acceptBybitMessage(value)){bybitStatus='Connected';paintExchangeComparison()}}catch{}};ws.onerror=()=>{if(ws===bybitSocket)ws.close()};ws.onclose=()=>{if(ws!==bybitSocket)return;bybitSocket=null;bybitStatus='Unavailable · reconnecting';paintLiveQuotes();scheduleBybit();loadData()}}catch{bybitSocket=null;bybitStatus='Unavailable · reconnecting';scheduleBybit()}}
setInterval(()=>{if(bybitSocket?.readyState===1){try{bybitSocket.send(JSON.stringify({op:'ping'}))}catch{bybitSocket.close()}}if(!document.hidden&&bybitSocket&&Date.now()-(lastBybitEvent||bybitOpenedAt)>30000){disconnectBybit();scheduleBybit();loadData()}},20000);
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(bybitRetry){clearTimeout(bybitRetry);bybitRetry=null}disconnectBybit()}else connectBybit()});
setTimeout(connectBybit,0);
function acceptCoinbaseMessage(value,now=Date.now()){
 if(value?.type!=='ticker'||typeof value.product_id!=='string'||!value.product_id.endsWith('-USD'))return false;
 const symbol=value.product_id.slice(0,-4),price=Number(value.price),open=Number(value.open_24h),baseVolume=Number(value.volume_24h),eventAt=Date.parse(value.time);
 if(!COINBASE_SYMBOLS.includes(symbol)||[value.price,value.open_24h,value.volume_24h,value.time].some(v=>v==null||v==='')||![price,open,baseVolume,eventAt].every(Number.isFinite)||price<=0||open<=0||baseVolume<0||now-eventAt>15000||eventAt-now>5000)return false;
 const previous=liveQuotes.get('coinbase/'+symbol);if(previous&&eventAt<=previous.eventAt)return false;
 liveQuotes.set('coinbase/'+symbol,{symbol,price,change:(price/open-1)*100,volume:baseVolume*price,quote:'USD',provider:'coinbase',source:'Coinbase Exchange stream',source_url:'https://exchange.coinbase.com/trade/'+symbol+'-USD',status:'LIVE',updated:new Date(eventAt).toISOString(),eventAt,receivedAt:now});
 lastCoinbaseEvent=now;coinbaseFailures=0;coinbaseStatus='Connected';return true;
}
function scheduleCoinbase(){if(coinbaseRetry||document.hidden)return;const delay=Math.min(30000,1000*2**Math.min(coinbaseFailures++,5));coinbaseRetry=setTimeout(()=>{coinbaseRetry=null;connectCoinbase()},delay)}
function disconnectCoinbase(){const ws=coinbaseSocket;coinbaseSocket=null;if(ws){ws.onclose=null;ws.close()}paintLiveQuotes()}
function connectCoinbase(){if(typeof WebSocket==='undefined'||document.hidden||coinbaseSocket)return;try{
 const ws=new WebSocket('wss://ws-feed.exchange.coinbase.com');coinbaseSocket=ws;coinbaseStatus='Connecting';coinbaseOpenedAt=Date.now();lastCoinbaseEvent=0;
 ws.onopen=()=>{if(ws===coinbaseSocket){coinbaseStatus='Awaiting ticker';paintExchangeComparison();ws.send(JSON.stringify({type:'subscribe',product_ids:COINBASE_SYMBOLS.map(s=>s+'-USD'),channels:['ticker']}))}};
 ws.onmessage=e=>{if(ws!==coinbaseSocket)return;try{const value=JSON.parse(e.data);if(value.type==='error'){coinbaseStatus='Subscription rejected';paintExchangeComparison()}else if(acceptCoinbaseMessage(value))paintExchangeComparison()}catch{}};
 ws.onerror=()=>{if(ws===coinbaseSocket)ws.close()};ws.onclose=()=>{if(ws!==coinbaseSocket)return;coinbaseSocket=null;coinbaseStatus='Unavailable · reconnecting';paintLiveQuotes();scheduleCoinbase()};
 }catch{coinbaseSocket=null;coinbaseStatus='Unavailable · reconnecting';scheduleCoinbase()}}
setInterval(()=>{if(!document.hidden&&coinbaseSocket&&Date.now()-(lastCoinbaseEvent||coinbaseOpenedAt)>30000){disconnectCoinbase();coinbaseStatus='Unavailable · reconnecting';scheduleCoinbase()}},10000);
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(coinbaseRetry){clearTimeout(coinbaseRetry);coinbaseRetry=null}disconnectCoinbase()}else connectCoinbase()});
setTimeout(connectCoinbase,0);

function analyticsOff(){storageRemove('vantix_analytics');storageRemove('vantix_visitor');alert('Optional analytics disabled.')}
function moderateUserAction(action){moderate(action,'user',Number(document.getElementById('moderateUser').value))}
// Explicit function allowlist and literal arguments only. No eval or Function constructor.
function dispatchCommand(command){
 const match=/^([A-Za-z]+)\((.*)\)$/.exec(command||'');if(!match)return;
 const actions={addAlert,addChart,addHolding,addSaved,addWatch,analyticsOff,analyticsOn,applyChartInterval,applyChartSelection,applyFeedUpdates,applyGmgnFilters,checkShield,closeGlobalSearch,commentPost,createPost,downloadNextAccounts,filterNews,followMember,go,loadCommunity,loadGmgn,loadIndicators,loadAuth,loadData,loadFilings,loadOperations,loadTokenPairs,loginUser,logoutUser,moderate,moderateUserAction,openSearchAsset,openSearchPage,reactPost,registerUser,removeAlert,removeChart,removeHolding,removeSaved,removeWatchAt,reportContent,requestEmail,resetGmgnFilters,resetPassword,saveProfile,searchSources,sendAI,setChartInterval,setChartSymbol,setFeedSort,toggleGlobalSearch};if(!Object.prototype.hasOwnProperty.call(actions,match[1]))return;
 const raw=match[2].trim();let args=[];
 if(raw){const parts=raw.split(',').map(x=>x.trim());for(const part of parts){
  if(/^'[^'\\]*'$/.test(part)||/^"[^"\\]*"$/.test(part))args.push(part.slice(1,-1));
  else if(/^-?\d+$/.test(part)&&Number.isSafeInteger(Number(part)))args.push(Number(part));
  else if(part==='true'||part==='false')args.push(part==='true');else return;
 }}
 return actions[match[1]](...args);
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-command]');if(el)dispatchCommand(el.dataset.command)});
document.addEventListener('change',e=>{if(e.target.dataset.changeCommand)dispatchCommand(e.target.dataset.changeCommand);else if(e.target.matches('[data-gmgn-filter]'))applyGmgnFilters()});
document.addEventListener('input',e=>{if(e.target.id==='globalSearchInput')runGlobalSearch();else if(e.target.matches('[data-gmgn-filter]'))applyGmgnFilters()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.getElementById('globalSearchPanel').hidden){closeGlobalSearch();return}if(e.key==='Enter'&&e.target.id==='q'){e.preventDefault();sendAI();return}if(e.key==='Enter'&&e.target.dataset.keyRoute)go(e.target.dataset.keyRoute)});

document.addEventListener('click',e=>{const asset=e.target.closest('[data-asset]');if(asset){assetAction(asset.dataset.asset);return}let a=e.target.closest('a[data-route]');if(a){e.preventDefault();go(a.dataset.route)}});document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-asset]')){e.preventDefault();assetAction(e.target.dataset.asset)}});window.onpopstate=render;render();
if(typeof navigator!=='undefined'&&'serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('/sw.js').catch(()=>{});
