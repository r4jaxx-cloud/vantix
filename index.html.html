adius:50%;background:var(--green);box-shadow:0 0 12px var(--green);margin-right:6px}.page{padding:20px;max-width:1500px;margin:auto}.hero{border:1px solid #164c79;border-radius:16px;padding:35px;background:linear-gradient(135deg,#071b31,#05101e 55%,#061b31);box-shadow:0 20px 60px #0008}.heroLogo{font-size:62px;font-weight:900;letter-spacing:9px;background:linear-gradient(90deg,#fff,#62dfff);color:transparent;background-clip:text}.hero p{color:#56cfff;letter-spacing:3px;font-size:11px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.panel,.card{background:linear-gradient(145deg,#071426,#06101e);border:1px solid #12365d;border-radius:13px;padding:16px}.card{cursor:pointer}.card:hover,.click:hover{border-color:#248dcc;transform:translateY(-1px)}.card small,.muted{color:var(--muted)}.price{font-size:21px;font-weight:800;margin:6px 0}.up{color:var(--green)}.down{color:var(--red)}h1{font-size:28px;margin:4px 0 6px}h2{font-size:20px;margin:8px 0}h3{font-size:11px;color:#58d8ff;letter-spacing:1.4px;margin:0 0 12px}.rows{display:grid}.row{display:flex;justify-content:space-between;gap:15px;padding:12px 0;border-bottom:1px solid #102a45;font-size:12px}.row:last-child{border:0}.badge{font-size:9px;padding:4px 7px;border-radius:5px;background:#073b32;color:#63ffd5}.badge.warn{background:#49380c;color:#ffd56a}.badge.block{background:#4b1620;color:#ff7f90}.big{font-size:38px;font-weight:900}.btn{border:1px solid #197db8;background:#07315a;color:white;border-radius:8px;padding:9px 13px;cursor:pointer}.btn:hover{background:#0b477b}.input{width:100%;background:#020b16;border:1px solid #164b73;color:white;border-radius:8px;padding:12px;outline:revert}.chat{height:430px;overflow:auto;padding:12px;background:#020a13;border:1px solid #12365d;border-radius:10px}.msg{max-width:82%;padding:11px 13px;border-radius:10px;margin:8px 0;font-size:13px;line-height:1.5}.user{background:#08345b;margin-left:auto}.bot{background:#0a1727;border:1px solid #143b60}.footer{padding:20px;text-align:center;color:#52738d;font-size:10px}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid #12304c}.searchbar{display:flex;gap:8px}.empty{padding:30px;text-align:center;color:#69869f;border:1px dashed #173c5b;border-radius:10px}.notice{padding:11px;border-radius:8px;background:#0a2035;border:1px solid #15486d;color:#9fc5df;font-size:11px;margin-bottom:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.pill{padding:6px 9px;border:1px solid #17466b;border-radius:999px;color:#9fc5df;background:#051323;font-size:10px;cursor:pointer}.danger{color:#ff8798}.ok{color:#63ffd5}@media(max-width:900px){.app{grid-template-columns:1fr}aside{height:auto;position:relative}.nav{display:flex;overflow:auto}.nav a{white-space:nowrap}.grid,.grid2,.grid3{grid-template-columns:1fr}.heroLogo{font-size:42px}.top{position:relative}}

@media(max-width:760px){.app{display:block}aside{position:relative;width:100%;height:auto;padding:12px}.nav{display:flex;overflow:auto;gap:4px}.nav a{flex-shrink:0}.nav .section,.tag{display:none}.logo{margin-bottom:12px}.grid2,.grid3{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.top{position:relative;height:auto;padding:12px;flex-wrap:wrap}.search{min-width:200px;font-size:14px}.page{padding:14px}.heroLogo{font-size:32px}.hero{padding:16px}.row{overflow-wrap:anywhere}.panel{min-width:0}}
.row,.table,.notice{font-size:14px}.badge{font-size:12px}.msg{font-size:16px}.live{color:var(--amber)}.search{height:auto;min-height:40px;flex-wrap:wrap}.row a{overflow-wrap:anywhere}</style></head><body><div class="app"><aside><div class="logo"><div class="mark"><b>V</b></div><span>VANTIX</span></div><div class="tag">WORLD & MARKET INTELLIGENCE</div><div class="nav" id="nav"></div></aside><div class="content"><div class="top"><div class="search" id="globalSearch" role="button" tabindex="0" onkeydown="if(event.key==='Enter')go('/ask')">⌕ &nbsp; <strong>Ask VANTIX</strong> search available sources</div><div class="live"><span id="dataStatus">CONNECTING</span></div></div><div class="previewNotice" id="serviceNotice">Checking service connections…</div><main class="page" id="page"></main><div class="footer">VANTIX • Financial intelligence, market data and AI analysis • Data availability depends on provider and licensing. <a href="/privacy" data-route="/privacy">Privacy</a> · <a href="/terms" data-route="/terms">Terms</a></div></div></div><script>
const routes=[['/','⌂','Home'],['/ask','⌕','Ask VANTIX'],['/markets','⌁','Markets'],['/crypto','₿','Crypto'],['/stocks','▥','Stocks'],['/forex','◉','Forex'],['/commodities','◆','Commodities'],['/economy','◎','Economy'],['/news','▤','News'],['/feed','◌','VANTIX Feed'],['/radar','⚡','Market Radar'],['/shield','♢','VANTIX Shield'],['/watchlist','☆','Watchlist'],['/alerts','♧','Alerts'],['/research','⌕','Research'],['/copilot','◈','Market Copilot'],['/sectors','◫','Sector Analysis'],['/portfolio','▣','Portfolio Tracker'],['/account','◎','Account'],['/admin','⚙','Owner']];
const nav=document.getElementById('nav');nav.innerHTML=routes.map((r,i)=>(i===13?'<div class="section">AI Tools</div>':'')+`<a href="${r[0]}" data-route="${r[0]}"><i>${r[1]}</i>${r[2]}</a>`).join('');
let marketData=[],newsData=[];const page=document.getElementById('page');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money=x=>typeof x!=='number'||!Number.isFinite(x)?'—':x.toLocaleString(undefined,{maximumFractionDigits:x>=1000?2:4});
const pct=x=>typeof x!=='number'||!Number.isFinite(x)?'—':(x>=0?'+':'')+x.toFixed(2)+'%';
function storageGet(key){try{return localStorage.getItem(key)}catch{return null}}
function storageSet(key,value){try{localStorage.setItem(key,value);return true}catch{alert('This browser cannot save data. Enable site storage to keep your changes.');return false}}
function storageRemove(key){try{localStorage.removeItem(key)}catch{}}
function saved(key){try{const rows=JSON.parse(storageGet(key)||'[]');if(!Array.isArray(rows))return [];return rows.filter(x=>key==='vantix_watch'?typeof x==='string'&&/^[A-Z0-9/._-]{1,24}$/.test(x):x&&typeof x.symbol==='string'&&/^[A-Z0-9/._-]{1,24}$/.test(x.symbol)&&typeof x[key==='vantix_portfolio'?'qty':'price']==='number'&&Number.isFinite(x[key==='vantix_portfolio'?'qty':'price'])&&x[key==='vantix_portfolio'?'qty':'price']>0).slice(0,500)}catch{return []}}
function validSymbol(s){return /^[A-Z0-9/._-]{1,24}$/.test(s)}
async function api(path,options={}){const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),45000);try{const r=await fetch(path,{...options,signal:controller.signal});const data=await r.json();if(!r.ok)throw Error(data.message||data.answer||data.error||'Request failed. Please try again.');return data}finally{clearTimeout(timer)}}
let marketSources=[],newsSources=[],dataBusy=false;
async function loadData(){if(dataBusy)return;dataBusy=true;try{
const responses=await Promise.allSettled([api('/api/market'),api('/api/news')]);
if(responses[0].status==='fulfilled'){marketData=responses[0].value.data||[];marketSources=responses[0].value.sources||[]}else{marketData=marketData.map(x=>({...x,status:'STALE'}));marketSources=marketSources.map(x=>({...x,status:x.data?.length?'STALE':'UNAVAILABLE'}))}
if(responses[1].status==='fulfilled'){newsData=responses[1].value.data||[];newsSources=responses[1].value.sources||[]}else{newsData=newsData.map(x=>({...x,status:'STALE'}));newsSources=newsSources.map(x=>({...x,status:x.data?.length?'STALE':'UNAVAILABLE'}))}
document.getElementById('dataStatus').textContent=marketData.length?'SNAPSHOTS / REFERENCE':'MARKET DATA UNAVAILABLE';
if(!page.querySelector('input,textarea,select'))render();else{refreshContext();}
}finally{dataBusy=false}}
setTimeout(loadData,0);
setInterval(()=>{if(!document.hidden)loadData()},60000);

function go(p){history.pushState({},'',p);render()}
function layout(title,sub,body){page.innerHTML=`<div style="margin-bottom:18px"><h1>${title}</h1><div class="muted">${sub}</div></div>${body}`}
function marketRows(filter){let rows=marketData.filter(filter||(()=>true));return rows.length?`<div class="rows">${rows.map(x=>`<div class="row click" data-asset="${esc(x.symbol)}" role="button" tabindex="0"><span><b>${esc(x.symbol)}</b><br><span class="muted">${esc(x.source||'provider')} · ${esc(x.status||'UNKNOWN')}<br>${esc(x.updated||'Timestamp unavailable')}</span></span><span style="text-align:right"><b>${x.symbol.includes('/')?esc(x.price)+' '+esc(x.symbol.split('/')[1]):money(x.price)}</b><br><span class="${x.change>=0?'up':'down'}">${pct(x.change)}</span><br><small>${esc(x.quote||'')} · ${x.change==null?'Reference rate':'24h change'}</small></span></div>`).join('')}</div>`:'<div class="empty">No provider data returned.</div>'}
function assetAction(symbol){go('/ask');setTimeout(()=>{let q=document.getElementById('q');if(q){q.value='Why is '+symbol+' moving right now?';q.focus()}},30)}
function renderHome(){layout('World & Markets','What is happening, what is moving, and what people are discussing.',`<div class="toolbar"><button class="btn" onclick="go('/news')">World news</button><button class="pill" onclick="go('/markets')">Explore markets</button><button class="pill" onclick="go('/feed')">Join the conversation</button><button class="pill" onclick="go('/ask')">Ask VANTIX</button></div><div class="grid2"><section class="panel"><h2>Latest world & market headlines</h2><p class="muted">Original sources and publication times. Coverage depends on available feeds.</p>${newsList(8)}</section><section class="panel"><h2>Market snapshot</h2>${marketRows()}<div class="notice">Snapshots and reference rates are not a complete view of global markets.</div></section></div><div class="grid3" style="margin-top:14px"><section class="panel"><h2>VANTIX Feed</h2><p>Discuss world events, companies and markets. Email verification identifies an account; it does not verify a claim.</p><button class="btn" onclick="go('/feed')">Open Feed</button></section><section class="panel"><h2>VANTIX RADAR</h2><p>Rank observed market moves and review source reports.</p><span class="badge">PRICE RANKING</span><p class="muted">View ranked 24-hour price moves across the tracked crypto pairs. Causes are not inferred.</p><button class="pill" onclick="go('/radar')">View workspace</button></section><section class="panel"><h2>VANTIX SHIELD</h2><p>Investigate a crypto contract before drawing conclusions.</p><span class="badge warn">UNKNOWN</span><p class="muted">Check provider-reported token flags on Ethereum and BNB Chain. Missing evidence stays UNKNOWN.</p><button class="pill" onclick="go('/shield')">Open SHIELD</button></section></div>`)}

function safeLink(value){try{const u=new URL(value);return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return ''}}
function newsCards(rows){return rows.length?rows.map(x=>`<a class="row" href="${esc(safeLink(x.link))}" target="_blank" rel="noopener noreferrer"><span><b>${esc(x.title)}</b><br><span class="muted">${esc(x.source)} · ${esc(x.published||(x.seen_at?'Indexed '+x.seen_at+'; publication time unavailable':'Publication time unavailable'))} · ${esc(x.status||'UNKNOWN')}</span></span><span>↗</span></a>`).join(''):'<div class="empty">No source reports available. Try refreshing later.</div>'}
function newsList(n=20){return newsCards(newsData.slice(0,n))}

function renderAsk(){layout('Ask VANTIX','Search public sources or request a source-linked AI interpretation.',`<div class="panel"><div class="chat" id="chat"><div class="msg bot">AI can be wrong. Check the linked observations and their dates. It cannot establish a cause from price movement alone.</div></div><label for="q">Your question</label><input class="input" id="q" maxlength="1500" placeholder="e.g. What does the latest inflation release say?"><p><label><input type="checkbox" id="aiConsent"> Send this question and matching public source records to the configured AI providers. Do not include private information.</label></p><div class="toolbar"><button class="btn" id="aiSend" onclick="sendAI()">Ask AI</button><button class="pill" onclick="searchSources()">Search sources without AI</button><a href="/account" data-route="/account">Sign in</a></div><div id="aiAvailability" role="status">Checking AI connections…</div></div>`);api('/api/capabilities').then(x=>{const el=document.getElementById('aiAvailability');if(el)el.textContent=x.ai_configured?'Configured providers: '+x.ai_providers.join(', ')+'. Availability and daily limits apply.':'No AI provider connected. Source search is available.'}).catch(()=>{const el=document.getElementById('aiAvailability');if(el)el.textContent='AI service unavailable.'})}
function searchSources(){const q=document.getElementById('q').value.trim();if(!q)return;const words=q.toLowerCase().match(/[a-z0-9]{3,}/g)||[];const matches=newsData.filter(x=>words.some(w=>x.title.toLowerCase().includes(w))).slice(0,6);document.getElementById('chat').insertAdjacentHTML('beforeend',`<div class="msg user">${esc(q)}</div><div class="msg bot"><b>Source search · no AI interpretation</b>${newsCards(matches)}${marketData.filter(x=>words.some(w=>x.symbol.toLowerCase().includes(w))).map(x=>`<p>${esc(x.symbol)} ${money(x.price)} ${esc(x.quote)} · ${esc(x.status)} · ${esc(x.updated)}</p>`).join('')}</div>`)}
let aiBusy=false;
async function sendAI(){if(aiBusy)return;const q=document.getElementById('q').value.trim();const consent=document.getElementById('aiConsent').checked;if(!q)return;if(!consent){alert('Confirm sharing the question, or use source search.');return}const el=document.getElementById('chat');const button=document.getElementById('aiSend');aiBusy=true;button.disabled=true;el.insertAdjacentHTML('beforeend',`<div class="msg user">${esc(q)}</div>`);try{const x=await postJSON('/api/ai',{question:q,consent});if(el!==document.getElementById('chat'))return;el.insertAdjacentHTML('beforeend',`<div class="msg bot"><b>AI INTERPRETATION · ${esc(x.provider)}</b><p style="white-space:pre-wrap">${esc(x.answer)}</p><p>${esc(x.limitations)}</p>${x.sources.map(r=>`<p><a href="${esc(safeLink(r.source_url||r.link))}" target="_blank" rel="noopener noreferrer">${esc(r.id)} · ${esc(r.title||r.symbol||r.source)}</a><br><small>Observed ${esc(r.updated||r.published||'Date unavailable')} · Retrieved ${esc(r.retrieved_at)}</small></p>`).join('')}</div>`)}catch(e){if(el===document.getElementById('chat'))el.insertAdjacentHTML('beforeend',`<div class="msg bot">${esc(e.message)}</div>`)}finally{aiBusy=false;button.disabled=false;el.scrollTop=el.scrollHeight}}

function renderMarkets(){layout('Markets','Provider snapshots and daily reference FX rates. Check each observation’s timestamp.',`<div class="toolbar"><button class="pill" onclick="go('/crypto')">Crypto</button><button class="pill" onclick="go('/forex')">FX</button><button class="pill" onclick="go('/radar')">Radar</button></div><div class="grid2"><div class="panel"><h3>CRYPTO</h3>${marketRows(x=>!x.symbol.includes('/'))}</div><div class="panel"><h3>FX REFERENCE</h3>${marketRows(x=>x.symbol.includes('/'))}</div></div>`)}
function renderCrypto(){layout('Crypto Intelligence','Market snapshots depend on provider availability. Token security is a separate evidence-based workflow.',`<div class="notice">⚠ Security status is <b>UNKNOWN</b> until a security provider returns evidence. VANTIX never turns missing data into a clean bill of health.</div><div class="grid2"><div class="panel"><h3>CRYPTO MARKET</h3>${marketRows(x=>['BTC','ETH','BNB','SOL','DOGE','XRP','ADA'].includes(x.symbol))}</div><div class="panel"><h3>TOKEN PAIRS</h3><label>Chain <select class="input" id="pairChain"><option value="bsc">BNB Chain</option><option value="solana">Solana</option><option value="ethereum">Ethereum</option></select></label><label>Token address <input class="input" id="pairToken"></label><button class="btn" onclick="loadTokenPairs()">Find trading pairs</button><div id="pairResults" role="status"></div><h3>CRYPTO ACTIONS</h3><button class="btn" onclick="go('/shield')">Open Shield</button> <button class="btn" onclick="go('/radar')">Open Radar</button></div></div>`)}
function renderNews(){layout('News & Intelligence','Official releases, earthquake reports and publisher links indexed by GDELT. Coverage is incomplete; indexed headlines are not independently verified.',`<div class="toolbar">${[['all','All sources'],['policy','Central banks'],['energy','Energy'],['world','World events']].map(([k,t])=>`<button class="pill" onclick="filterNews('${k}')">${t}</button>`).join('')}</div><div class="panel" id="newsResults">${newsList(40)}</div>`)}
function filterNews(topic){document.getElementById('newsResults').innerHTML=newsCards(newsData.filter(x=>topic==='all'||x.category===topic))}
function renderFeed(){layout('VANTIX Feed','A verified conversation layer for market news, new projects, breaking events and what is moving the world.',`<div class="notice"><b>Verified-only participation.</b> Anyone can read the feed. Only accounts with a verified email can publish posts or comments. Email verification does not verify the accuracy of a post. Check original sources before relying on a claim.</div><div class="grid2"><div class="panel"><h3>POST TO VANTIX FEED</h3><div id="authBox"></div><label>Post type <select class="input" id="postLabel"><option>Community commentary</option><option>AI Interpretation</option><option>Rumour</option><option>Prediction</option></select></label><textarea class="input" id="postBody" rows="4" placeholder="What is happening? Share a market event, new project, breaking story or analysis..."></textarea><div class="searchbar" style="margin-top:8px"><input class="input" id="postSource" placeholder="Source URL (optional)"><button class="btn" onclick="createPost()">Publish</button></div></div><div class="panel"><h3>SOCIAL SOURCES</h3><div id="socialFeed"><div class="empty">Loading social sources…</div></div></div></div><div class="panel" style="margin-top:14px"><h3>COMMUNITY FEED</h3><div id="feedUpdateStatus" class="muted" role="status">Checking for conversations…</div><button id="showFeedUpdates" class="pill" style="display:none" onclick="applyFeedUpdates()">Show new conversations</button><div id="communityFeed"><div class="empty">Loading…</div></div></div>`);feedSnapshot=null;pendingFeed=null;loadAuth();loadFeed();loadSocial()}
async function loadAuth(){const box=document.getElementById('authBox');try{const x=await api('/api/auth/me',{headers:authHeaders()});if(box!==document.getElementById('authBox'))return;if(x.authenticated){box.innerHTML=`<div class="notice">${x.user.verified?'Email verified':'Email unverified'}: ${esc(x.user.email)} <button class="pill" onclick="logoutUser()">Sign out</button></div>`}else{box.innerHTML='<div class="searchbar"><input class="input" id="authEmail" type="email" autocomplete="email" placeholder="Email"><input class="input" id="authPassword" type="password" autocomplete="current-password" placeholder="Password (8+ chars)"><button class="btn" onclick="registerUser()">Register</button><button class="btn" onclick="loginUser()">Sign in</button></div><button class="pill" onclick="requestEmail(&quot;reset-request&quot;)">Forgot password</button><button class="pill" onclick="requestEmail(&quot;resend&quot;)">Resend verification</button><div id="authMsg" role="status" class="muted" style="margin:8px 0"></div>'}}catch{if(box===document.getElementById('authBox'))box.innerHTML='<p>Account service unavailable.</p><button class="pill" onclick="loadAuth()">Retry</button>'}}
let authBusy=false;
async function submitAuth(action){if(authBusy)return;const message=document.getElementById('authMsg');const email=document.getElementById('authEmail').value;const password=document.getElementById('authPassword').value;authBusy=true;message.textContent='Please wait…';try{const x=await api('/api/auth/'+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});if(message!==document.getElementById('authMsg'))return;if(x.authenticated){storageRemove('vantix_token');render()}else{message.textContent=x.message;if(x.dev_verification_url){const a=document.createElement('a');a.href=safeLink(x.dev_verification_url);a.textContent=' Open local test verification';a.target='_blank';a.rel='noopener';message.append(a)}}}catch(error){if(message===document.getElementById('authMsg'))message.textContent=error.message}finally{authBusy=false}}
function registerUser(){return submitAuth('register')}
function loginUser(){return submitAuth('login')}
async function logoutUser(){try{await api('/api/auth/logout',{method:'POST',headers:{'Content-Type':'application/json'}});storageRemove('vantix_token');render()}catch(error){alert('Sign-out could not reach the server. Your session is still active. Try again.')}}

function authHeaders(){return {}}
let postBusy=false;
async function createPost(){if(postBusy)return;const input=document.getElementById('postBody');const source=document.getElementById('postSource');const body=input.value.trim();if(!body||body.length>1000){alert('Use 1–1000 characters.');return}postBusy=true;try{await api('/api/feed/post',{method:'POST',headers:{'Content-Type':'application/json',...authHeaders()},body:JSON.stringify({body,label:document.getElementById('postLabel').value,source_url:source.value.trim(),source_label:source.value.trim()?'Source':''})});if(input===document.getElementById('postBody')){input.value='';source.value='';await loadFeed()}}catch(error){alert(error.message)}finally{postBusy=false}}

let feedSnapshot=null,pendingFeed=null,feedBusy=false;
function paintFeed(x){const el=document.getElementById('communityFeed');if(!el)return;
const drafts=Array.from(el.querySelectorAll('input')).map(i=>[i.id,i.value]);
const active=document.activeElement;const focusId=active?.id;const start=active?.selectionStart;const end=active?.selectionEnd;
el.innerHTML=x.data.length?x.data.map(p=>`<div class="panel" style="margin:8px 0"><div class="muted">${esc(p.display_name)} · Email verified · ${esc(p.label)} · ${new Date(p.created_at).toLocaleString()}</div><div style="margin:8px 0;line-height:1.5">${esc(p.body)}</div>${p.source_url?`<a href="${esc(safeLink(p.source_url))}" target="_blank" rel="noopener" style="color:#5fdfff">${esc(p.source_label||'Open source')}</a>`:''}<div class="toolbar"><button class="pill" onclick="reactPost(${p.id},${!p.reacted})">${p.reacted?'Liked':'Like'} · ${Number(p.reactions)||0}</button><button class="pill" onclick="reportContent('post',${p.id})">Report</button></div><div class="rows" style="margin-top:10px">${p.comments_list.map(c=>`<div class="row"><span><b>${esc(c.display_name)}</b> · ${esc(c.body)} <button class="pill" onclick="reportContent('comment',${c.id})">Report</button></span><small>${new Date(c.created_at).toLocaleString()}</small></div>`).join('')}</div><div class="searchbar" style="margin-top:8px"><input class="input" id="comment-${p.id}" placeholder="Comment on this post"><button class="pill" onclick="commentPost(${p.id})">Comment</button></div></div>`).join(''):'<div class="empty">No community posts yet. Be the first verified member to post.</div>';
for(const[id,value]of drafts){const field=document.getElementById(id);if(field)field.value=value}
const focused=document.getElementById(focusId);if(focused){focused.focus();if(start!=null)focused.setSelectionRange(start,end)}
feedSnapshot=JSON.stringify(x.data);pendingFeed=null;
const button=document.getElementById('showFeedUpdates');if(button)button.style.display='none';
}
function applyFeedUpdates(){if(pendingFeed)paintFeed(pendingFeed)}
async function loadFeed(background=false){
if(feedBusy||!document.getElementById('communityFeed'))return;feedBusy=true;
const target=document.getElementById('communityFeed');
try{const response=await fetch('/api/feed',{cache:'no-store'});if(!response.ok)throw Error('Feed unavailable');const x=await response.json();if(!Array.isArray(x.data))throw Error('Invalid feed');if(target!==document.getElementById('communityFeed'))return;
if(JSON.stringify(x.data)!==feedSnapshot){if(background&&feedSnapshot!==null){pendingFeed=x;document.getElementById('showFeedUpdates').style.display='inline-block'}else paintFeed(x)}
document.getElementById('feedUpdateStatus').textContent='Last checked '+new Date().toLocaleTimeString()+' · Updates checked every 10 seconds';
}catch(error){if(target===document.getElementById('communityFeed')){document.getElementById('feedUpdateStatus').textContent='Connection unavailable. Retrying every 10 seconds.';if(feedSnapshot===null)target.innerHTML='<div class="empty">Conversations could not be loaded.</div>'}}
finally{feedBusy=false}
}
setInterval(()=>{if(!document.hidden)loadFeed(true)},10000);

const commentBusy=new Set();
async function commentPost(id){if(commentBusy.has(id))return;const input=document.getElementById('comment-'+id);if(!input.value.trim()||input.value.length>500){alert('Use 1–500 characters.');return}commentBusy.add(id);try{await api('/api/feed/comment',{method:'POST',headers:{'Content-Type':'application/json',...authHeaders()},body:JSON.stringify({post_id:id,body:input.value})});if(input===document.getElementById('comment-'+id)){input.value='';await loadFeed()}}catch(error){alert(error.message)}finally{commentBusy.delete(id)}}
function loadSocial(){const el=document.getElementById('socialFeed');if(el)el.innerHTML='<div class="empty">External social feeds are disabled in this free-only build. Read and post community conversations below.</div>'}

function renderShield(){layout('VANTIX Shield','Token-risk intelligence. Never confuse an unavailable check with a clean result.',`<div class="panel"><div class="searchbar"><label>Chain <select class="input" id="securityChain"><option value="56">BNB Chain</option><option value="1">Ethereum</option></select></label><input class="input" id="token" placeholder="Paste token contract address"><button class="btn" onclick="checkShield()">Check</button></div><div id="shieldResult" style="margin-top:15px"><div class="empty">No token checked.</div></div></div>`)}
async function checkShield(){const t=document.getElementById('token').value.trim();if(!t)return;const el=document.getElementById('shieldResult');el.textContent='Checking availability…';try{const j=await api('/api/shield?chain='+document.getElementById('securityChain').value+'&token='+encodeURIComponent(t));if(el===document.getElementById('shieldResult'))el.innerHTML=`<div class="panel"><span class="badge warn">${esc(j.status)}</span><p>${esc(j.message)}</p><p>Received ${esc(j.retrieved_at||'Never')}</p>${(j.data||[]).map(r=>`<div class="row"><b>${esc(r.title)}</b><span>${esc(r.value)}</span></div>`).join('')}</div>`}catch{if(el===document.getElementById('shieldResult'))el.textContent='UNKNOWN — security service unavailable.'}}

const cfg={
'/stocks':['Stocks','Equities intelligence and company analysis.','US EQUITIES','INDEXES','EARNINGS',['/research','/radar','/alerts']],'/forex':['Forex','Currency markets and macro drivers.','G10','EM FX','CENTRAL BANKS',['/economy','/news','/alerts']],'/commodities':['Commodities','Energy, metals and agricultural market intelligence.','GOLD','OIL','INDUSTRIAL METALS',['/markets','/news','/radar']],'/economy':['Economy','Macro indicators and economic narratives.','INFLATION','RATES','GDP',['/forex','/research','/news']],'/radar':['Market Radar','Unusual moves, volume, narrative and news signals.','PRICE SPIKES','VOLUME','NEWS SHOCKS',['/news','/markets','/ask']],'/watchlist':['Watchlist','Save assets locally and open them from one workspace.','FAVOURITES','PRICE ALERTS','AI MONITORING',['/alerts','/ask','/portfolio']],'/alerts':['Alerts','Locally saved rules only. Alerts are not evaluated and notifications are not sent.','PRICE','NEWS','RISK',['/watchlist','/shield','/radar']],'/research':['Research','Structured research workspace for market questions.','COMPANY','SECTOR','MACRO',['/sectors','/economy','/ask']],'/sectors':['Sector Analysis','Compare sector momentum, catalysts and risk.','TECH','FINANCE','ENERGY',['/stocks','/commodities','/research']]};
function generic(path){
const c=cfg[path];layout(c[0],c[1],'');
if(path==='/forex')page.innerHTML+=`<div class="panel"><h2>Daily reference exchange rates</h2>${marketRows(x=>x.symbol.includes('/'))}</div>`;
else if(path==='/economy'||path==='/sectors')renderIndicators(path);
else if(path==='/stocks'||path==='/research')renderFilings();
else if(path==='/commodities')page.innerHTML+=`<div class="panel"><h2>Energy releases</h2><p class="muted">Published analysis, not live commodity quotes. Gold, silver and oil spot prices are not connected.</p>${newsCards(newsData.filter(x=>x.category==='energy'))}<p><a href="https://www.worldbank.org/en/research/commodity-markets" target="_blank" rel="noopener">World Bank commodity price reports ↗</a></p></div>`;
else if(path==='/radar'){const movers=marketData.filter(x=>x.change!=null).sort((a,b)=>Math.abs(b.change)-Math.abs(a.change));page.innerHTML+=`<div class="panel"><h2>Largest 24-hour moves in tracked assets</h2><p class="muted">Calculated from the seven tracked Binance pairs, not the entire market. Volume is 24-hour quote volume; it is not proof of unusual activity. Causes have not been established.</p>${movers.length?movers.map(x=>`<div class="row"><span><b>${esc(x.symbol)}</b><br><small>${esc(x.source)} · ${esc(x.updated)} · ${esc(x.status)}</small></span><span>${pct(x.change)}<br><small>Volume ${Number(x.volume).toLocaleString()} USDT</small></span></div>`).join(''):'<div class="empty">Price observations unavailable.</div>'}</div>`}
else if(path==='/watchlist')renderWatchExtra();
else if(path==='/alerts')renderAlertExtra();
}
function sourceStatus(sources){return sources.map(x=>`<div class="row"><span>${esc(x.source)}<br><small>Checked ${esc(x.checked_at||'Not checked')}<br>Last received ${esc(x.retrieved_at||'Never')}</small></span><span class="badge">${esc(x.status||'UNKNOWN')}</span></div>`).join('')}
function refreshContext(){let el=document.getElementById('freeContext');if(!el)return;const watched=[];el.innerHTML=`<div class="grid2"><section class="panel"><h2>Source updates</h2><p class="muted">Free public sources. Prices refresh every minute while this tab is visible; reference rates and published releases follow the source’s schedule.</p>${sourceStatus([...marketSources,...newsSources])||'<p class="muted">Sources have not responded yet.</p>'}<button class="pill" onclick="loadData()">Refresh information</button></section><section class="panel"><h2>Latest source reports</h2>${newsList(4)}${watched.length?'<h3>Your watched assets</h3>'+watched.map(x=>`<div class="row"><b>${esc(x.symbol)}</b><span>${money(x.price)} ${esc(x.quote)} · ${esc(x.status)}</span></div>`).join(''):''}</section></div>`}
function appendContext(){page.insertAdjacentHTML('beforeend','<div id="freeContext" style="margin-top:18px"></div>');refreshContext()}
function renderIndicators(path){const sector=path==='/sectors';page.innerHTML+=`<div class="panel"><h2>${sector?'Economic sector composition':'Economic indicators'}</h2><p class="muted">Annual World Bank observations; reporting years can differ. ${sector?'These figures describe the economy, not stock-sector investment returns.':''}</p><label>Country <select class="input" id="countrySelect" onchange="loadIndicators('${path}')">${[['GBR','United Kingdom'],['USA','United States'],['CHN','China'],['DEU','Germany'],['JPN','Japan'],['IND','India'],['WLD','World']].map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label><div id="indicatorResults" aria-live="polite">Loading observations…</div></div>`;loadIndicators(path)}
let indicatorRequest=0;
async function loadIndicators(path){const id=++indicatorRequest;const target=document.getElementById('indicatorResults');const country=document.getElementById('countrySelect').value;try{const r=await fetch('/api'+path+'?country='+country);if(!r.ok)throw Error();const x=await r.json();if(id!==indicatorRequest||target!==document.getElementById('indicatorResults'))return;target.innerHTML=`<p class="muted">${esc(x.source||'World Bank')} · ${esc(x.status||'UNAVAILABLE')} · Checked ${esc(x.checked_at||'Not checked')}</p>`+(x.data?.length?x.data.map(row=>`<div class="row"><span><b>${esc(row.title)}</b><br><small>${esc(row.country)} · Reporting year ${esc(row.updated)}</small><br><a href="${esc(safeLink(row.link))}" target="_blank" rel="noopener">Source ↗</a></span><b>${Number(row.value).toFixed(2)}%</b></div>`).join(''):`<div class="empty">${esc(x.message||'No observations returned.')}</div>`)}catch{if(target===document.getElementById('indicatorResults'))target.innerHTML='<div class="empty">Economic source unavailable. No figures have been substituted.</div>'}}
function renderFilings(){page.innerHTML+=`<section class="panel"><h2>Company filings</h2><p class="muted">Search official SEC submissions by numeric CIK. Filing dates are shown as reported; these are not share prices.</p><div class="searchbar"><label>SEC company CIK <input class="input" id="companyCik" inputmode="numeric" placeholder="e.g. 320193"></label><button class="btn" onclick="loadFilings()">Find filings</button><a href="https://www.sec.gov/edgar/search/" target="_blank" rel="noopener">Find a company’s CIK ↗</a></div><div id="filingResults" aria-live="polite"></div></section>`}
async function loadFilings(){const el=document.getElementById('filingResults');const cik=document.getElementById('companyCik').value.trim();if(!/^\d{1,10}$/.test(cik)){el.textContent='Enter a numeric CIK of up to 10 digits.';return}el.textContent='Looking up SEC filings…';try{const r=await fetch('/api/filings?cik='+encodeURIComponent(cik));const x=await r.json();if(el!==document.getElementById('filingResults'))return;el.innerHTML=`<p class="muted">${esc(x.status||'UNAVAILABLE')} · ${esc(x.checked_at||'Not checked')}</p>`+(x.data?.length?newsCards(x.data):`<p>${esc(x.message||'No filings returned.')}</p>`)}catch{el.textContent='SEC filings could not be retrieved.'}}

function moduleInfo(x){let d=document.getElementById('moduleDetail');if(d)d.innerHTML='<b>'+esc(x)+'</b> selected. Connect the relevant licensed provider to populate this workspace with live evidence.'}
function renderWatchExtra(){let symbols=saved('vantix_watch');page.innerHTML+=`<div class="panel" style="margin-top:14px"><h3>SAVED ASSETS</h3><div class="searchbar"><input class="input" id="watchInput" placeholder="Symbol e.g. BTC"><button class="btn" onclick="addWatch()">Add</button></div><div id="watchList" class="rows" style="margin-top:10px">${symbols.length?symbols.map((s,i)=>`<div class="row"><b>${esc(s)}</b><button class="pill" onclick="removeWatchAt(${i})">Remove</button></div>`).join(''):'<div class="empty">No saved assets yet.</div>'}</div></div>`}
function addWatch(){let v=document.getElementById('watchInput').value.trim().toUpperCase();if(!validSymbol(v)){alert('Use a symbol of 1–24 letters, numbers, dots, slashes, hyphens or underscores.');return}let a=saved('vantix_watch');if(!a.includes(v))a.push(v);storageSet('vantix_watch',JSON.stringify(a));render()}
function removeWatchAt(i){const items=saved('vantix_watch');items.splice(i,1);storageSet('vantix_watch',JSON.stringify(items));render()}
function removeWatch(v){let a=saved('vantix_watch').filter(x=>x!==v);storageSet('vantix_watch',JSON.stringify(a));render()}
function renderAlertExtra(){let a=saved('vantix_alerts');page.innerHTML+=`<div class="panel" style="margin-top:14px"><h3>LOCAL ALERT RULES</h3><div class="searchbar"><input class="input" id="alertSymbol" placeholder="Symbol"><input class="input" id="alertPrice" type="number" placeholder="Price"><button class="btn" onclick="addAlert()">Add</button></div><div class="rows" style="margin-top:10px">${a.length?a.map((x,i)=>`<div class="row"><span><b>${esc(x.symbol)}</b> ≥ ${esc(x.price)}</span><button class="pill" onclick="removeAlert(${i})">Remove</button></div>`).join(''):'<div class="empty">No alerts configured.</div>'}</div></div>`}
function addAlert(){let s=document.getElementById('alertSymbol').value.trim().toUpperCase(),p=Number(document.getElementById('alertPrice').value);if(!validSymbol(s)||!Number.isFinite(p)||p<=0){alert('Enter a valid symbol and a positive finite price.');return}let a=saved('vantix_alerts');a.push({symbol:s,price:p});storageSet('vantix_alerts',JSON.stringify(a));render()}
function removeAlert(i){let a=saved('vantix_alerts');a.splice(i,1);storageSet('vantix_alerts',JSON.stringify(a));render()}
function renderPortfolio(){let holdings=saved('vantix_portfolio');layout('Portfolio Tracker','Local portfolio workspace. Valuations use USDT crypto snapshots when symbols match; USDT is not the same as USD.',`<div class="panel"><h3>ADD HOLDING</h3><div class="searchbar"><input class="input" id="portSymbol" placeholder="BTC"><input class="input" id="portQty" type="number" placeholder="Quantity"><button class="btn" onclick="addHolding()">Add</button></div></div><div class="panel" style="margin-top:14px"><h3>HOLDINGS</h3>${holdings.length?`<table class="table"><tr><th>Asset</th><th>Quantity</th><th>Price (USDT)</th><th>Value (USDT)</th><th>Status / observed</th><th></th></tr>${holdings.map((h,i)=>{let x=marketData.find(m=>m.symbol===h.symbol&&m.quote==='USDT');let v=x?x.price*h.qty:null;return `<tr><td><b>${esc(h.symbol)}</b></td><td>${esc(h.qty)}</td><td>${money(x?.price)}</td><td>${money(v)}</td><td>${esc(x?.status||'UNAVAILABLE')}<br>${esc(x?.updated||'No quote')}</td><td><button class="pill" onclick="removeHolding(${i})">Remove</button></td></tr>`}).join('')}</table>`:'<div class="empty">No holdings yet.</div>'}</div>`)}
function addHolding(){let s=document.getElementById('portSymbol').value.trim().toUpperCase(),q=Number(document.getElementById('portQty').value);if(!validSymbol(s)||!Number.isFinite(q)||q<=0){alert('Enter a valid symbol and a positive finite quantity.');return}let a=saved('vantix_portfolio');a.push({symbol:s,qty:q});storageSet('vantix_portfolio',JSON.stringify(a));render()}
function removeHolding(i){let a=saved('vantix_portfolio');a.splice(i,1);storageSet('vantix_portfolio',JSON.stringify(a));render()}
function render(){let p=location.pathname.replace(/\/$/,'')||'/';document.querySelectorAll('[data-route]').forEach(a=>a.classList.toggle('active',a.dataset.route===p));if(p==='/')renderHome();else if(p==='/ask'||p==='/copilot')renderAsk();else if(p==='/markets')renderMarkets();else if(p==='/crypto')renderCrypto();else if(p==='/news')renderNews();else if(p==='/feed')renderFeed();else if(p==='/shield')renderShield();else if(['/watchlist','/portfolio','/alerts'].includes(p))renderSaved(p.slice(1));else if(p==='/account')renderAccount();else if(p==='/admin')renderAdmin();else if(p==='/reset-password')renderReset();else if(p==='/privacy'||p==='/terms')renderPolicy(p);else if(cfg[p])generic(p);else renderHome();appendContext()}
function postJSON(path,body){return api(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})}
async function requestEmail(action){const el=document.getElementById('authMsg');try{const x=await postJSON('/api/auth/'+action,{email:document.getElementById('authEmail').value});el.textContent=x.message;if(x.dev_verification_url){const a=document.createElement('a');a.href=safeLink(x.dev_verification_url);a.textContent=' Open local test link';el.append(a)}}catch(e){el.textContent=e.message}}
function renderAccount(){layout('Your account','Manage your sign-in and public display name.',`<section class="panel"><div id="authBox"></div></section><section class="panel" style="margin-top:14px"><label>Public display name <input id="displayName" class="input" maxlength="40"></label><button class="btn" onclick="saveProfile()">Save name</button><div id="profileStatus" role="status"></div></section>`);loadAuth();api('/api/profile').then(x=>{const el=document.getElementById('displayName');if(el)el.value=x.display_name}).catch(e=>{const el=document.getElementById('profileStatus');if(el)el.textContent=e.message})}
async function saveProfile(){const el=document.getElementById('profileStatus');try{await postJSON('/api/profile',{display_name:document.getElementById('displayName').value});el.textContent='Display name saved.'}catch(e){el.textContent=e.message}}
function renderReset(){layout('Reset password','Use the link from your reset email.',`<section class="panel"><label>New password <input type="password" autocomplete="new-password" id="resetPassword" class="input" minlength="8" maxlength="256"></label><button class="btn" onclick="resetPassword()">Change password</button><p id="resetStatus" role="status"></p><a href="/account" data-route="/account">Return to sign-in</a></section>`)}
async function resetPassword(){const el=document.getElementById('resetStatus');try{const token=new URLSearchParams(location.hash.slice(1)).get('token');const x=await postJSON('/api/auth/reset',{token,password:document.getElementById('resetPassword').value});history.replaceState({},'','/reset-password');el.textContent=x.message}catch(e){el.textContent=e.message}}
function renderSaved(kind){const title={watchlist:'Watchlist',portfolio:'Portfolio Tracker',alerts:'Price Alerts'}[kind];layout(title,kind==='alerts'?'Checks tracked crypto thresholds while this page is open. No background or email alert delivery.':'Saved to your account. Quote coverage is limited to the displayed providers.',`<section class="panel"><div id="authBox"></div><label>Asset symbol <input class="input" id="savedSymbol" maxlength="24" placeholder="BTC"></label>${kind!=='watchlist'?`<label>${kind==='portfolio'?'Quantity':'Threshold in USDT'} <input class="input" id="savedValue" type="number" min="0" step="any"></label>`:''}<button class="btn" onclick="addSaved('${kind}')">Add</button><p id="savedStatus" role="status"></p><div id="savedRows">Loading saved items…</div>${kind==='alerts'?'<h2>Notifications</h2><div id="notifications"></div>':''}</section>`);loadAuth();loadSaved(kind);if(kind==='alerts')loadNotifications()}
async function loadSaved(kind){const el=document.getElementById('savedRows');try{const x=await api('/api/saved?kind='+kind);if(el!==document.getElementById('savedRows'))return;el.innerHTML=x.data.length?x.data.map(r=>{const q=marketData.find(x=>x.symbol===r.symbol&&x.quote==='USDT');return `<div class="row"><span><b>${esc(r.symbol)}</b>${r.value!=null?' · '+esc(r.value)+(kind==='alerts'?' USDT threshold':' units'):''}<br><small>${q?money(q.price)+' USDT · '+esc(q.status)+' · '+esc(q.updated):'Quote unavailable'}${kind==='portfolio'&&q?'<br>Indicative holding value: '+money(q.price*r.value)+' USDT':''}</small></span><button class="pill" onclick="removeSaved(${r.id},'${kind}')">Remove</button></div>`}).join(''):'<p>No saved items yet.</p>'}catch(e){if(el===document.getElementById('savedRows'))el.textContent=e.message}}
let savedBusy=false;

async function removeSaved(id,kind){try{await postJSON('/api/saved/remove',{id});await loadSaved(kind)}catch(e){alert(e.message)}}
async function loadNotifications(){const el=document.getElementById('notifications');if(!el)return;try{const x=await api('/api/notifications');if(el!==document.getElementById('notifications'))return;el.innerHTML=x.data.length?x.data.map(r=>`<p>${esc(r.message)}<br><small>${esc(r.source)} · ${esc(r.observed_at)}</small></p>`).join(''):'No threshold notifications.'}catch(e){el.textContent=e.message}}

async function loadAdmin(){const el=document.getElementById('adminContent');try{const x=await api('/api/admin');if(el!==document.getElementById('adminContent'))return;el.innerHTML=`<p>${esc(x.note)}</p><div class="toolbar"><a class="btn" href="/api/admin/export?kind=summary">Download summary (CSV)</a><a class="btn" href="/api/admin/export?kind=daily">Daily usage (CSV)</a><a class="btn" href="/api/admin/export?kind=accounts">Accounts (CSV)</a><a class="btn" href="/api/admin/export?kind=print">Printable report</a><a class="btn" href="/api/admin/export?kind=health">Health history (CSV)</a></div><p class="muted">CSV files open in Excel or Google Sheets. Account exports contain personal information and are owner-only. Accounts and health downloads contain up to 5,000 rows; use the next-batch control for larger exports.</p><label>Continue accounts after user ID <input class="input" id="exportAfter" type="number" min="0" value="0"></label><button class="pill" onclick="downloadNextAccounts()">Download next account batch</button><h2>Background monitoring</h2><div id="operationsStatus">Loading checks…</div><button class="pill" onclick="loadOperations()">Refresh health</button><div class="grid3">${Object.entries(x.counts).map(([k,v])=>`<div class="card"><small>${esc(k.replaceAll('_',' '))}</small><div class="big">${Number(v)}</div></div>`).join('')}</div><h2>Reports</h2>${x.reports.map(r=>`<div class="row"><span>${esc(r.kind)} #${r.target_id} · ${esc(r.status)}<br>${esc(r.reason)}</span><span><button class="pill" onclick="moderate('hide','${r.kind}',${r.target_id})">Hide</button><button class="pill" onclick="moderate('restore','${r.kind}',${r.target_id})">Restore</button></span></div>`).join('')||'<p>No reports.</p>'}<h2>Account moderation</h2><label>User ID <input class="input" id="moderateUser" type="number" min="1"></label><button class="pill" onclick="moderate('ban','user',Number(document.getElementById('moderateUser').value))">Suspend</button><button class="pill" onclick="moderate('unban','user',Number(document.getElementById('moderateUser').value))">Restore</button><h2>Source status</h2>${sourceStatus(x.providers)}<h2>Recorded feature actions</h2>${x.usage.map(r=>`<p>${esc(r.event)}: ${Number(r.n)}</p>`).join('')}` ;loadOperations()}catch(e){if(el===document.getElementById('adminContent'))el.textContent=e.message}}
async function loadTokenPairs(){const el=document.getElementById('pairResults');el.textContent='Checking pair data…';try{const x=await api('/api/token-pairs?chain='+document.getElementById('pairChain').value+'&token='+encodeURIComponent(document.getElementById('pairToken').value.trim()));if(el!==document.getElementById('pairResults'))return;el.innerHTML=`<p>${esc(x.status)} · Received ${esc(x.retrieved_at||'Never')}. Provider observation time is not supplied.</p>${x.data.map(r=>`<div class="row"><span><a href="${esc(safeLink(r.link))}" target="_blank" rel="noopener noreferrer">${esc(r.title)}</a><br><small>${esc(r.chain)} · ${esc(r.pair)}</small></span><span>${money(r.price)} USD<br>Liquidity: ${money(r.liquidity)} USD</span></div>`).join('')||'<p>No pairs returned.</p>'}`}catch(e){el.textContent=e.message}}
function downloadNextAccounts(){const after=Number(document.getElementById('exportAfter').value);if(!Number.isSafeInteger(after)||after<0){alert('Enter a valid last user ID.');return}location.href='/api/admin/export?kind=accounts&after='+after}
async function loadOperations(){const el=document.getElementById('operationsStatus');if(!el)return;try{const x=await api('/api/admin/operations');if(el!==document.getElementById('operationsStatus'))return;el.innerHTML=`<p>${esc(x.note)}</p><p>Monitor: ${x.running?'Running':'Not running'} · Database: ${esc(x.database)} · Last cycle: ${esc(x.last_cycle||'Not checked')}</p>${Object.entries(x.checks).map(([k,v])=>`<div class="row"><b>${esc(k)}</b><span>${esc(v.status)} · ${esc(v.checked_at)}<br>Next check interval ${Number(v.retry_seconds)} seconds</span></div>`).join('')}<h3>Recent service errors</h3>${x.errors.slice(-10).map(e=>`<p>${esc(e.at)} · ${esc(e.area)} · ${esc(e.code)}</p>`).join('')||'<p>No errors recorded in this process.</p>'}`}catch(e){el.textContent=e.message}}
async function moderate(action,kind,target_id){if(!Number.isSafeInteger(target_id)||target_id<1){alert('Enter a valid ID.');return}try{await postJSON('/api/admin/moderate',{action,kind,target_id});loadAdmin()}catch(e){alert(e.message)}}
function renderPolicy(path){const privacy=path==='/privacy';layout(privacy?'Privacy':'Terms of use','VANTIX service information',`<section class="panel">${privacy?'<p>Accounts store your email, password hash, session records and display name. Posts and comments are public; saved assets and alerts are scoped to your account. Passwords are not stored in plaintext.</p><p>Hosting, database and email providers process the data needed to deliver those services. AI requests are sent only after you confirm sharing your question and selected public evidence. Provider privacy terms apply; avoid private or sensitive information in AI questions.</p><p>Essential cookies keep you signed in. Optional page-view analytics are off by default. Security and account-action records support abuse prevention and operations. Analytics and account-action events older than 30 days are removed during periodic maintenance while the service is running. Moderation audit records remain available to the owner.</p><button class="pill" onclick="storageSet(\'vantix_analytics\',\'yes\');alert(\'Optional page-view analytics enabled.\')">Enable optional analytics</button> <button class="pill" onclick="storageRemove(\'vantix_analytics\');storageRemove(\'vantix_visitor\');alert(\'Optional analytics disabled.\')">Disable optional analytics</button>':'<p>VANTIX provides information and community discussion, not investment advice or trade execution. Data can be delayed, incomplete or unavailable. AI interpretation can contain errors. Check original sources before making decisions.</p><p>Do not publish unlawful content, harassment, spam, private information or misleading claims. Label rumours, predictions and AI-generated commentary. The owner may remove content and suspend accounts.</p><p>Free providers and hosting impose quotas and availability limits. Features can pause when those limits are reached. No continuous availability, complete market coverage or investment outcome is guaranteed.</p>'}<p id="ownerContact"></p></section>`);api('/api/capabilities').then(x=>{const el=document.getElementById('ownerContact');if(el)el.textContent=x.support_email?'Account, deletion and privacy requests: '+x.support_email:'Site-owner contact is not configured in this local build.'}).catch(()=>{})}
function recordPage(){if(storageGet('vantix_analytics')!=='yes')return;let visitor=storageGet('vantix_visitor');if(!visitor){visitor=crypto.randomUUID();if(!storageSet('vantix_visitor',visitor))return}postJSON('/api/events',{consent:true,visitor,path:location.pathname}).catch(()=>{})}
const originalGo=go;go=function(p){originalGo(p);recordPage()};
setTimeout(()=>{storageRemove('vantix_token');api('/api/capabilities').then(x=>{const el=document.getElementById('serviceNotice');if(el)el.textContent=(x.mode==='public'?'PUBLIC SERVICE':'LOCAL BUILD')+' · '+(x.persistent_storage?'Remote database configured':'Local storage only')+' · '+(x.ai_configured?'AI providers configured':'AI not connected')+' · Source availability varies.'}).catch(()=>{const el=document.getElementById('serviceNotice');if(el)el.textContent='Service connection unavailable.'});recordPage()},0);

document.addEventListener('click',e=>{const asset=e.target.closest('[data-asset]');if(asset){assetAction(asset.dataset.asset);return}let a=e.target.closest('a[data-route]');if(a){e.preventDefault();go(a.dataset.route)}});document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-asset]')){e.preventDefault();assetAction(e.target.dataset.asset)}});window.onpopstate=render;document.getElementById('globalSearch').onclick=()=>go('/ask');render();
</script></body></html>
